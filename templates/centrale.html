<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/static/assets/logo-conquerorz.svg" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConquerorZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF9; --card:#FFFFFF; --border:#E8E6E1; --border-strong:#D4D1CB;
    --ink:#16150F; --muted:#615F58; --subtle:#94908A; --muted-bg:#F4F3F1;
    --accent:#3B9DF7; --accent-deep:#1F7BD6; --accent-soft:#E4F1FE;
    --sidebar-w:248px; --topbar-h:52px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;
    color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
    display:grid; grid-template-columns:var(--sidebar-w) 1fr; height:100vh; overflow:hidden;
  }

  /* ---- Sidebar ---- */
  .sb{ background:var(--bg); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
  .sb-logo{ display:flex; align-items:center; gap:10px; padding:16px 18px 14px; }
  .sb-mark{ width:30px; height:30px; background:#E4F1FE; border-radius:9px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; letter-spacing:-.03em; box-shadow:0 3px 10px -4px rgba(59,157,247,.6); }
  .sb-brand{ font-size:16px; font-weight:700; letter-spacing:-.02em; }
  .sb-brand small{ display:block; font-size:11px; font-weight:500; color:var(--subtle); letter-spacing:0; margin-top:1px; }
  .sb-scroll{ flex:1; overflow-y:auto; padding:6px 12px 16px; min-height:0; }
  .sb-group{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; background:none; border:none; cursor:pointer; font-family:inherit; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--subtle); padding:14px 10px 6px; }
  .sb-group:hover{ color:var(--ink); }
  .sb-group .chev{ width:13px; height:13px; opacity:.65; transition:transform .15s; }
  .sb-grp.collapsed .chev{ transform:rotate(-90deg); }
  .sb-grp.collapsed .sb-items{ display:none; }
  .sb-item{ display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:9px; cursor:pointer; color:var(--muted); font-size:13.5px; font-weight:500; white-space:nowrap; transition:background .14s, color .14s; user-select:none; position:relative; }
  .sb-item:hover{ background:var(--muted-bg); color:var(--ink); }
  .sb-item.active{ background:var(--accent-soft); color:var(--accent-deep); font-weight:600; }
  .sb-item svg{ width:17px; height:17px; flex:none; opacity:.85; }
  .sb-item.active svg{ opacity:1; }
  .sb-item .cnt{ margin-left:auto; font-size:11px; font-weight:600; color:var(--subtle); }
  .sb-foot{ border-top:1px solid var(--border); padding:12px 18px; font-size:12px; color:var(--subtle); display:flex; align-items:center; justify-content:space-between; }
  .sb-foot a.logout{ color:var(--subtle); text-decoration:none; font-weight:500; font-size:11px; padding:4px 8px; border-radius:6px; transition:all .14s; }
  .sb-foot a.logout:hover{ background:var(--muted-bg); color:var(--ink); }

  /* ---- Main ---- */
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--card); }
  .topbar{ height:var(--topbar-h); flex:none; display:flex; align-items:center; gap:12px; padding:0 20px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.9); backdrop-filter:blur(8px); }
  .tb-title{ font-size:15px; font-weight:700; letter-spacing:-.015em; }
  .tb-toggle{ width:34px; height:32px; flex:none; border:1px solid var(--border); background:var(--card); color:var(--muted); border-radius:8px; display:grid; place-items:center; cursor:pointer; transition:.14s; }
  .tb-toggle:hover{ color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft); }
  .tb-toggle svg{ width:16px; height:16px; }
  body.sb-min{ grid-template-columns:70px 1fr; }
  body.sb-min .sb-brand, body.sb-min .sb-group, body.sb-min .sb-item span, body.sb-min .sb-foot{ display:none; }
  body.sb-min .sb-items{ display:block !important; }
  body.sb-min .sb-logo{ justify-content:center; padding:16px 0 14px; }
  body.sb-min .sb-scroll{ padding:8px 12px; }
  body.sb-min .sb-item{ justify-content:center; padding:11px 0; gap:0; }
  .tb-crumb{ font-size:12.5px; color:var(--subtle); }
  .tb-spacer{ flex:1; }
  .tb-link{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted); text-decoration:none; padding:7px 12px; border:1px solid var(--border); border-radius:8px; transition:.14s; }
  .tb-link:hover{ color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft); }
  .tb-link svg{ width:14px; height:14px; }
  .frame-wrap{ flex:1; min-height:0; position:relative; background:var(--bg); }
  iframe#view{ width:100%; height:100%; border:0; display:block; background:var(--bg); }
  .loader{ position:absolute; inset:0; display:none; place-items:center; background:var(--bg); }
  .loader.on{ display:grid; }
  .loader .sp{ width:26px; height:26px; border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <aside class="sb">
    <div class="sb-logo">
      <div class="sb-mark"><svg viewBox="-7 -7 88 86" width="18" height="18"><path d="M34.376 9.28651C17.326 14.3365 2.57505 18.7825 1.59705 19.1655C-0.0049535 19.7925 -0.153954 21.1865 0.0970465 33.1325C0.360046 45.6525 0.492046 46.4195 2.43105 46.6965C4.18305 46.9475 32.653 27.7735 58.274 9.08751C60.968 7.12251 62.993 6.04851 62.774 6.69951C62.555 7.35151 49.526 21.0505 33.82 37.1435C18.114 53.2355 4.91205 66.9845 4.48405 67.6965C4.05505 68.4075 4.24805 69.6455 4.91205 70.4465C5.83305 71.5565 8.67905 71.9025 16.874 71.9025H27.627L41.453 50.6525C66.245 12.5475 68.093 9.78651 68.519 10.2115C68.75 10.4435 64.187 23.4055 58.378 39.0175C52.569 54.6295 47.943 68.3025 48.096 69.4025C48.355 71.2495 49.247 71.4245 59.733 71.6865C67.25 71.8745 71.561 71.5795 72.483 70.8135C73.622 69.8685 73.876 63.6635 73.876 36.7805C73.876 5.23551 73.795 3.82151 71.876 1.90251C70.776 0.802513 68.863 -0.0524882 67.626 0.00251179C66.389 0.0585118 51.426 4.23551 34.376 9.28651Z" fill="#1F7BD6"/></svg></div>
      <div class="sb-brand">Conqueror<span style="color:var(--accent)">Z</span></div>
    </div>
    <div class="sb-scroll" id="nav"></div>
    <div class="sb-foot">
      <span id="userEmail"></span>
      <a class="logout" href="#" onclick="event.preventDefault();document.cookie='sb-access-token=;Max-Age=0;path=/';document.cookie='sb-refresh-token=;Max-Age=0;path=/';try{localStorage.clear();}catch(e){}window.location.href='/logout';">D&eacute;connexion</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="tb-toggle" id="sbToggle" title="Réduire / agrandir le menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="tb-title" id="tbTitle">Mes pages</span>
      <span class="tb-crumb" id="tbCrumb">Landing</span>
      <span class="tb-spacer"></span>
      <a class="tb-link" id="tbOpen" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        Plein écran
      </a>
    </div>
    <div class="frame-wrap">
      <iframe id="view" title="Contenu"></iframe>
      <div class="loader" id="loader"><div class="sp"></div></div>
    </div>
  </main>


<script>
const USER_SERVICES = {{ user_services|safe }};
const USER_PAGES = {{ user_pages|safe }};
const USER_EMAIL = '{{ user_email }}';
const IS_ADMIN = {{ 'true' if is_admin else 'false' }};

const IC = {
  home:'<path d="M3 9.5 12 3l9 6.5V21H3z"/><path d="M9 22V12h6v10"/>',
  chart:'<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>',
  check:'<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  mega:'<path d="m3 11 14-6v14L3 13z"/><path d="M3 11v2a3 3 0 0 0 3 3h1"/>',
  shield:'<path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  ghost:'<path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8Z"/><path d="M9.5 10h.01"/><path d="M14.5 10h.01"/>',
  music:'<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H4a1 1 0 0 1-1-1v-7a9 9 0 0 1 18 0v7a1 1 0 0 1-1 1h-2a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>'
};
function ic(n){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`; }

const SVC_MAP = { "Landing":"landing", "Dashboard":"dashboard", "Créa":"crea", "Admin":null };

const ALL_GROUPS = [
  { g:"Landing", svc:"landing", items:[
    { id:"pages", label:"Mes pages", src:"/landing#pages", icon:"home" },
    { id:"domaines", label:"Domaines", src:"/landing#domains", icon:"link" },
  ]},
  { g:"Dashboard", svc:"dashboard", items:[
    { id:"acq",     label:"Acquisition", src:"/dashboard",             icon:"chart" },
    { id:"flotte",  label:"Flotte",      src:"/dashboard/flotte",      icon:"phone" },
    { id:"emails",  label:"Emails",      src:"/dashboard/emails",      icon:"mail" },
    { id:"ads",     label:"Ads",         src:"/dashboard/ads",         icon:"mega" },
    { id:"proxy",   label:"Proxy",       src:"/dashboard/proxy",       icon:"shield" },
    { id:"mailsva", label:"Mails VA",    src:"/dashboard/mails-va",    icon:"inbox" },
    { id:"comptesva", label:"Comptes VA", src:"/dashboard/comptes-va",  icon:"users" },
  ]},
  { g:"Créa", svc:"crea", items:[
    { id:"phantom", label:"Phantom", src:"/crea#phantom", icon:"ghost" },
    { id:"music", label:"Musique", src:"/crea#music", icon:"music" },
  ]},
  { g:"Admin", svc:null, admin:true, items:[
    { id:"membres", label:"Membres global", src:"/members", icon:"users" },
  ]},
];

// Filter groups and items by user page permissions
const GROUPS = ALL_GROUPS.map(g => {
  if(g.admin) return IS_ADMIN ? g : null;
  const filtered = g.items.filter(it => USER_PAGES.includes(it.id));
  return filtered.length ? {...g, items:filtered} : null;
}).filter(Boolean);
const ALL = GROUPS.flatMap(g => g.items.map(it => ({...it, group:g.g})));
const byId = Object.fromEntries(ALL.map(it => [it.id, it]));

const nav = document.getElementById("nav");
const view = document.getElementById("view");
const loader = document.getElementById("loader");
const tbTitle = document.getElementById("tbTitle");
const tbCrumb = document.getElementById("tbCrumb");
const tbOpen = document.getElementById("tbOpen");

nav.innerHTML = GROUPS.map((g,gi) => `
  <div class="sb-grp" data-grp="${gi}">
    <button class="sb-group" type="button">${g.g}<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    <div class="sb-items">
      ${g.items.map(it => `<div class="sb-item" data-id="${it.id}" title="${it.label}">${ic(it.icon)}<span>${it.label}</span></div>`).join("")}
    </div>
  </div>`).join("");

function setActive(id){
  document.querySelectorAll(".sb-item").forEach(el => el.classList.toggle("active", el.dataset.id === id));
}

function hideInnerChrome(){
  try{
    const doc = view.contentDocument;
    if(!doc) return;
    let st = doc.getElementById("__hub_hide");
    if(!st){ st = doc.createElement("style"); st.id = "__hub_hide"; (doc.head||doc.documentElement).appendChild(st); }
    st.textContent = `
      #sophie-supernav{display:none!important;} body{padding-top:0!important;} .app{padding-top:0!important;}
      .admin-app{grid-template-columns:1fr!important;}
      .admin-app>.sidebar{display:none!important;}
      .sb-foot{display:none!important;}
    `;
  }catch(e){}
}

function load(id, push){
  const it = byId[id] || ALL[0];
  setActive(it.id);
  tbTitle.textContent = it.label;
  tbCrumb.textContent = it.group;
  tbOpen.href = it.src;
  const parts = it.src.split("#");
  const file = parts[0], hash = parts[1] || "";
  const curFile = view.getAttribute("data-file");
  if(curFile === file && view.contentWindow){
    try{ view.contentWindow.location.hash = hash; }catch(e){ view.src = it.src; }
    loader.classList.remove("on");
  } else {
    loader.classList.add("on");
    view.setAttribute("data-file", file);
    view.src = it.src;
  }
  try{ localStorage.setItem("hubPage", it.id); }catch(e){}
  if(push) history.replaceState(null, "", "#"+it.id);
}

view.addEventListener("load", () => { hideInnerChrome(); loader.classList.remove("on"); });

function persistGroups(){
  const col = [...document.querySelectorAll(".sb-grp.collapsed")].map(g=>g.dataset.grp);
  try{ localStorage.setItem("sbGroups", JSON.stringify(col)); }catch(e){}
}
nav.addEventListener("click", e => {
  const grpBtn = e.target.closest(".sb-group");
  if(grpBtn){ grpBtn.closest(".sb-grp").classList.toggle("collapsed"); persistGroups(); return; }
  const item = e.target.closest(".sb-item");
  if(!item) return;
  load(item.dataset.id, true);
});
try{ (JSON.parse(localStorage.getItem("sbGroups")||"[]")).forEach(gi=>{ const el=document.querySelector('.sb-grp[data-grp="'+gi+'"]'); if(el) el.classList.add("collapsed"); }); }catch(e){}

const sbToggle = document.getElementById("sbToggle");
function setMin(on){ document.body.classList.toggle("sb-min", on); try{ localStorage.setItem("sbMin", on?"1":"0"); }catch(e){} }
sbToggle.addEventListener("click", () => setMin(!document.body.classList.contains("sb-min")));
try{ if(localStorage.getItem("sbMin")==="1") document.body.classList.add("sb-min"); }catch(e){}

document.getElementById("userEmail").textContent = USER_EMAIL;

let start = (location.hash||"").replace("#","");
if(!byId[start]){ try{ start = localStorage.getItem("hubPage"); }catch(e){} }
if(!byId[start]) start = ALL[0] ? ALL[0].id : "pages";
load(start, false);
</script>
</body>
</html>
