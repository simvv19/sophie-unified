<style>
  :root {
    --rose: #ff6fa3;
    --rose-deep: #e84a86;
    --cream: #fff7fa;
    --ink: #3a1825;

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* ============================================================ PUBLIC LANDING */
  .landing-bg {

      radial-gradient(700px 500px at -10% 110%, #ffd0e0 0%, transparent 60%),

  }
  .deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .deco svg { position: absolute; }
  .deco .h1 { top: 6%; left: 6%; width: 22px; transform: rotate(-12deg); opacity: .5; }
  .deco .h2 { top: 14%; right: 8%; width: 32px; transform: rotate(18deg); opacity: .35; }
  .deco .h3 { top: 64%; left: 4%; width: 26px; transform: rotate(8deg); opacity: .4; }
  .deco .h4 { bottom: 10%; right: 6%; width: 22px; transform: rotate(-22deg); opacity: .5; }
  .deco .s1 { top: 30%; right: 22%; width: 12px; opacity: .5; }
  .deco .s2 { bottom: 28%; left: 22%; width: 11px; opacity: .55; }
  .page { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 22px; }
  .topbar { display: flex; justify-content: center; margin-top: 4px; }
  .handle { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 17px; color: var(--rose-deep); letter-spacing: -.01em; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 2px; }
  .avatar-ring { width: 168px; height: 168px; border-radius: 50%; padding: 5px;

    box-shadow: 0 22px 44px -18px rgba(232,74,134,.5); }
  .avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--cream); border: 4px solid #fff; }
  .avatar-inner img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .name-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 38px; line-height: 1; letter-spacing: -.015em; margin: 0; }
  .verify { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; background: var(--rose-deep); color: #fff; border-radius: 50%; }
  .verify svg { width: 12px; height: 12px; }
  .chips { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: -2px; font-size: 13px; color: var(--ink-soft); }
  .chip { display: inline-flex; align-items: center; gap: 6px; line-height: 1; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); box-shadow: 0 0 0 3px rgba(52,199,89,.18); animation: pulseDot 1.8s ease-in-out infinite; }

  .chip svg { width: 12px; height: 12px; color: var(--rose-deep); }
  .chip .sep { color: var(--ink-soft); opacity: .35; }
  .sub { margin: 0; text-align: center; font-family: 'Fraunces', serif; font-style: italic; font-size: 15px; color: var(--ink-soft); max-width: 320px; }
  .feature { position: relative; border-radius: 26px; padding: 22px 22px 20px; color: #fff;
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
    box-shadow: 0 24px 50px -22px rgba(232,74,134,.7), 0 1px 0 rgba(255,255,255,.4) inset;
    overflow: hidden; text-decoration: none; display: block;
    transition: transform .25s ease, box-shadow .25s ease;
    animation: featureBreathe 3.2s ease-in-out infinite, featureGlow 2.4s ease-in-out infinite; }
  .feature:hover { transform: translateY(-3px) scale(1.015); }
  .feature:active { transform: translateY(-1px) scale(.99); }
  @keyframes featureBreathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.012); } }
  @keyframes featureGlow {

  .feature::after { content: ''; position: absolute; top: 0; left: -60%; width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 60%, transparent 100%);
    transform: skewX(-18deg); animation: featureShimmer 3.6s ease-in-out infinite; pointer-events: none; }
  @keyframes featureShimmer { 0% { left: -60%; opacity: 0; } 20% { opacity: 1; } 60% { left: 120%; opacity: 1; } 100% { left: 120%; opacity: 0; } }
  .feature-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; background: rgba(255,255,255,.22); padding: 6px 10px; border-radius: 999px; backdrop-filter: blur(4px); position: relative; z-index: 1; }
  .feature-tag svg { width: 11px; height: 11px; animation: tagSparkle 1.6s ease-in-out infinite; }
  @keyframes tagSparkle { 0%,100% { transform: rotate(0deg) scale(1); opacity: .85; } 50% { transform: rotate(20deg) scale(1.25); opacity: 1; } }
  .feature h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; line-height: 1.15; margin: 14px 0 8px; letter-spacing: -.01em; text-wrap: balance; position: relative; z-index: 1; }
  .feature p { font-size: 13.5px; line-height: 1.5; opacity: .92; margin: 0 0 18px; max-width: 92%; position: relative; z-index: 1; }

  .feature .cta svg { width: 14px; height: 14px; animation: ctaArrow 1.2s ease-in-out infinite; }
  @keyframes ctaArrow { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  .feature .url { position: absolute; top: 20px; right: 20px; font-size: 11px; opacity: .9; font-family: ui-monospace, 'SF Mono', monospace; z-index: 2; }
  .foot { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 6px; letter-spacing: .1em; text-transform: uppercase; }

  @media (max-width: 380px) { .name { font-size: 32px; } .avatar-ring { width: 144px; height: 144px; } .feature h2 { font-size: 22px; } }
  @media (prefers-reduced-motion: reduce) {
    .feature, .feature::after, .feature .cta, .feature .cta svg, .feature-tag svg { animation: none !important; }
  }

  /* ============================================================ MULTI-LINK BUTTONS (under main card) */
  .link-list { display: flex; flex-direction: column; gap: 10px; }

    padding: 14px 16px; border-radius: 16px;

  /* ============================================================ CARD VARIANT 2 — POLAROID */

  /* ============================================================ CARD VARIANT 4 — STICKER / Y2K */
  .pcard-sticker { position: relative; background: color-mix(in srgb, var(--rose) 18%, white);

  .pcard-magnetic p { font-size: 13.5px; line-height: 1.5; opacity: .92; margin: 0 0 18px; max-width: 92%; }

  .pcard-kiss p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 20px; max-width: 90%; }
  .pks-cta { position: relative; display: inline-flex; align-items: center; gap: 12px;

  .pks-lips svg { width: 100%; height: 100%; color: var(--rose-deep); }
  .pks-cta::after { content: ''; position: absolute; top: -10px; right: 14px; width: 22px; height: 16px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 16' fill='%23e84a86'><path d='M5 4C3 2 0 3 0 6c0 3 3 5 6 7 1.5 1 5 3 6 3 1 0 4.5-2 6-3 3-2 6-4 6-7 0-3-3-4-5-2-1.5 1.5-4 2.5-7 2.5S6.5 5.5 5 4z'/></svg>");
    background-repeat: no-repeat; background-size: contain; opacity: 0;
    transform: rotate(-18deg) scale(.5); animation: pksDrop 5s ease-in-out infinite 2s; }
  @keyframes pksDrop { 0%,70%,100% { opacity: 0; transform: rotate(-18deg) scale(.5) translateY(-10px); }
    78%,92% { opacity: 1; transform: rotate(-18deg) scale(1) translateY(0); } }

  /* ============================================================ CARD 15 — SEALED LETTER */
  .pcard-letter { background: var(--cream); border-radius: 26px; padding: 28px 24px 24px; position: relative; overflow: hidden;
    box-shadow: 0 30px 60px -28px rgba(232,74,134,.45); border: 1px solid color-mix(in srgb, var(--rose) 18%, white);
    text-align: center; text-decoration: none; display: block; color: var(--ink); }
  .pcard-letter::before { content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(180deg, rgba(255,111,163,.06) 1px, transparent 1px);
    background-size: 100% 26px; pointer-events: none; opacity: .6; }
  .pcard-letter .plt-stamp { position: absolute; top: 14px; right: 14px; width: 44px; height: 54px;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    border: 1px dashed color-mix(in srgb, var(--rose-deep) 40%, transparent);
    padding: 6px; display: grid; place-items: center; color: #fff; transform: rotate(6deg);
    font-family: 'Fraunces', serif; font-size: 9px; line-height: 1.1; letter-spacing: .1em; text-transform: uppercase; }
  .pcard-letter .plt-stamp .plt-heart { width: 18px; height: 18px; margin-bottom: 2px; animation: pltBeat 1.4s ease-in-out infinite; }
  @keyframes pltBeat { 0%,60%,100% { transform: scale(1); } 20% { transform: scale(1.2); } 40% { transform: scale(1.05); } }
  .pcard-letter .plt-to { font-family: 'Caveat', cursive; font-size: 26px; color: var(--ink); line-height: 1;
    transform: rotate(-2deg); margin: 16px 0 6px; position: relative; }
  .pcard-letter .plt-to::after { content: ''; display: block; width: 80%; height: 1px;
    background: rgba(58,24,37,.2); margin: 6px auto 0; }
  .pcard-letter .plt-from { font-size: 12px; color: var(--ink-soft); margin-bottom: 22px;
    font-style: italic; font-family: 'Fraunces', serif; }
  .plt-cta { position: relative; display: inline-flex; align-items: center; gap: 0;
    padding: 0; background: transparent; color: var(--ink); font-weight: 600; overflow: visible; }
  .plt-seal { position: relative; width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--rose) 60%, white), var(--rose-deep) 60%, color-mix(in srgb, var(--rose-deep) 70%, var(--ink)));
    box-shadow: 0 8px 20px -6px rgba(184,50,106,.6), inset 0 -6px 14px rgba(184,50,106,.5), inset 0 4px 8px rgba(255,255,255,.4);
    display: grid; place-items: center; color: #fff; font-family: 'Fraunces', serif; font-style: italic; font-size: 22px;
    z-index: 2; animation: pltWax 4s ease-in-out infinite; }
  .plt-seal::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 1px dashed rgba(255,255,255,.5); }
  @keyframes pltWax { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.05) rotate(-3deg); } }
  .plt-cta .plt-label { margin-left: -10px; padding: 12px 18px 12px 24px;
    background: var(--ink); color: #fff; border-radius: 0 999px 999px 0; font-size: 13px; letter-spacing: .04em; }
  .plt-cta .plt-label small { display: block; font-size: 10px; opacity: .6; letter-spacing: .15em;
    text-transform: uppercase; margin-bottom: 2px; }

  /* ============================================================ TIKTOK 18+ OVERLAY */
  .tt-overlay { position: fixed; inset: 0; z-index: 10000; background: #000; overflow: hidden; }
  .tt-overlay .tt-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(.7); }
  .tt-overlay .tt-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,.6) 100%); }
  .tt-bubble { position: absolute; top: 18px; right: 18px; max-width: 240px;
    background: #fff; color: #111; border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.3; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); }
  .tt-bubble strong { font-weight: 700; }
  .tt-bubble::after { content:""; position:absolute; top:-8px; right:18px; width:0; height:0;
    border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:8px solid #fff; }
  .tt-card { position: absolute; left: 16px; right: 16px; top: 55%; transform: translateY(-50%);

  .tt-card h3 { font-weight: 700; font-size: 20px; margin: 0 0 6px; color: #111; }
  .tt-card p { font-size: 15px; color: #444; margin: 0 0 18px; }
  .tt-card .tt-btn { display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px; border-radius: 999px; color: #fff;
    background: linear-gradient(90deg, #5b3fc7 0%, #8b5cf6 100%);
    font-weight: 700; font-size: 13.5px; letter-spacing: .04em; text-decoration: none;
    box-shadow: 0 10px 22px -10px rgba(91,63,199,.6);
    animation: ttPulse 1.4s ease-in-out infinite;
  }
  @keyframes ttPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .tt-btn .tt-hand { width: 22px; height: 22px; flex: none; background: rgba(255,255,255,.18); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .tt-foot { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.8); font-size: 13px; }
  .tt-foot strong { color: #fff; font-weight: 700; display: block; font-size: 15px; }

  /* ============================================================ ESCAPE BANNER (other in-app browsers) */
  #escape-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; padding: 12px; pointer-events: none; animation: escapeSlide .35s cubic-bezier(.2,.9,.3,1); }
  @keyframes escapeSlide { from { transform: translateY(-110%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .escape-card { pointer-events: auto; max-width: 520px; margin: 0 auto;

  .escape-x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: none; background: transparent; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; opacity: .75; }

  /* ============================================================ LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(180deg, #ffeaf2, #ffd9e6); }
  .login-card { background: #fff; border-radius: 22px; padding: 32px; max-width: 380px; width: 100%; box-shadow: 0 30px 60px -20px rgba(60,20,80,.25); }
  .login-card .logo { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 28px; color: var(--rose-deep); text-align: center; margin: 0 0 6px; }

  /* ============================================================ ADMIN SHELL */
  .admin-app { min-height: 100vh; background: var(--bg); display: grid; grid-template-columns: 240px 1fr; }
  .sidebar { background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 18px 14px; gap: 4px; }
  .sb-logo { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }

  .main { padding: 28px 32px 60px; max-width: 1200px; }

  .btn-danger { color: #c43e6b; border-color: #f5d1de; background: #fff; }
  .btn-danger:hover { background: #fbecf2; }

  /* Folders */
  .folder { background: #fff; border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }

  /* Page card */

  .page-card .pc-copy:hover { background: #fff; color: var(--rose-deep); }
  .page-card .pc-copy.copied { color: #34c759; }

  .global-stats .stat strong { color: var(--rose-deep); font-weight: 700; font-size: 15px; }

  /* Drawer (editor) */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(35,15,42,.4); backdrop-filter: blur(4px); z-index: 100; animation: dFade .2s; }

  fieldset { border: none; padding: 0; margin: 0 0 18px; }

  .cstyle-mini-letter::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8fb6, #e84a86 60%, #b8326a); box-shadow: 0 4px 8px -2px rgba(184,50,106,.6); }

  .bg-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(60,20,80,.18); border-color: #f0d8e0; }

  .seg input:checked + .opt { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  /* Modal (folder editor) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(35,15,42,.4); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: dFade .2s; }

<body>
<div id="app"></div>

<script>
const sb = window.__supabase;
const app = document.getElementById("app");

// ============================================================ ROUTER
function pathSegment() {
  const p = window.location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
  return p;
}

async function route() {
  const seg = pathSegment();
  // Root and /admin both lead to the admin (login or dashboard)
  if (seg === "" || seg === "index.html" || seg === "admin") return showAdmin();
  // /go/<slug> — redirect to the page's main link
  if (seg.startsWith("go/")) {
    const goSlug = seg.replace("go/", "");
    return handleGo(goSlug);
  }
  return showLanding(seg);
}

async function handleGo(slug) {
  const { data } = await sb.from("landing_pages").select("id,data").eq("slug", slug).maybeSingle();
  if (!data) { window.location.href = "/" + slug; return; }
  // Find the first enabled link for this page
  const { data: links } = await sb.from("page_links")
    .select("url").eq("page_id", data.id).eq("enabled", true)
    .order("position", { ascending: true }).limit(1);
  if (links && links.length && links[0].url) {
    // Record visit then redirect
    try { await sb.from("visits").insert({ page_id: data.id, referrer: document.referrer || null, ua: navigator.userAgent }); } catch(e) {}
    window.location.href = links[0].url;
  } else {
    window.location.href = "/" + slug;
  }
}
window.addEventListener("popstate", route);

// ============================================================ ROOT
async function showRoot() {
  const { data } = await sb.from("landing_pages").select("slug").order("created_at", { ascending: true }).limit(1);
  if (data && data.length) {
    window.location.replace("/" + data[0].slug);
  } else {
    app.className = "landing-bg";
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;">
      <div>
        <h1 style="font-family:'Fraunces',serif;font-weight:500;font-size:32px;color:#3a1825;">Bientôt ✿</h1>
        <p style="color:#8a5a6c;font-family:'Fraunces',serif;font-style:italic;">Aucune page n'est encore en ligne.</p>
        <p style="margin-top:20px;"><a href="/admin" style="color:#e84a86;font-size:14px;">Admin</a></p>
      </div>
    </div>`;
  }
}

// ============================================================ PUBLIC LANDING
async function showLanding(slug) {
  const { data, error } = await sb.from("landing_pages").select("id,slug,data,photo_path").eq("slug", slug).maybeSingle();
  if (error || !data) {
    app.className = "landing-bg";
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;">
      <div>
        <h1 style="font-family:'Fraunces',serif;font-weight:500;font-size:48px;color:#3a1825;margin:0;">404</h1>
        <p style="color:#8a5a6c;font-family:'Fraunces',serif;font-style:italic;">Cette page n'existe pas.</p>
      </div>
    </div>`;
    return;
  }
  const photoUrl = data.photo_path ? sb.storage.from("landing_photos").getPublicUrl(data.photo_path).data.publicUrl : "";
  const linksRes = await sb.from("page_links")
    .select("id,title,url,icon,enabled,position")
    .eq("page_id", data.id).eq("enabled", true)
    .order("position", { ascending: true });
  const pageLinks = linksRes.data || [];
  const s = { ...data.data, photo: photoUrl, slug: data.slug, _origin: window.location.origin, _links: pageLinks };
  const env = detectEnv();

  // 18+ overlay (in-app browsers only: TikTok, Snapchat, Instagram, Facebook, Messenger)
  if (s.tiktok_overlay && env.isInApp) {
    renderTikTokOverlay(app, s, env);
    document.title = s.title || data.slug;
    return;
  }

  renderLanding(app, s);
  document.title = s.title || data.slug;
}

function renderLanding(container, s) {
  container.className = "landing-bg";
  document.documentElement.style.setProperty("--rose", s.c_rose || "#ff6fa3");
  document.documentElement.style.setProperty("--rose-deep", s.c_deep || "#e84a86");
  document.documentElement.style.setProperty("--ink", s.c_ink || "#3a1825");
  document.documentElement.style.setProperty("--ink-soft", s.c_inksoft || "#8a5a6c");
  // Apply background preset
  const bg = (typeof BACKGROUNDS !== "undefined" ? BACKGROUNDS : []).find(b => b.id === (s.bg_style||"rose"));
  if (bg) container.style.background = bg.bg;
  container.style.backgroundAttachment = "fixed";
  container.style.minHeight = "100vh";
  const photoSrc = s.photo || placeholderPhoto();
  container.innerHTML = `
    <div class="deco" aria-hidden="true">
      <svg class="h1" viewBox="0 0 24 24"><path fill="${s.c_rose||'#ff6fa3'}" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="h2" viewBox="0 0 24 24"><path fill="#ffb3cd" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="h3" viewBox="0 0 24 24"><path fill="#ff9bbf" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="h4" viewBox="0 0 24 24"><path fill="${s.c_deep||'#e84a86'}" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="s1" viewBox="0 0 24 24"><path fill="${s.c_rose||'#ff6fa3'}" d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
      <svg class="s2" viewBox="0 0 24 24"><path fill="#ff9bbf" d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
    </div>
    <main class="page">
      <div class="topbar"><span class="handle">${esc(s.handle||"@"+s.slug)}</span></div>
      <section class="hero">
        <div><div class="avatar-ring"><div class="avatar-inner"><img src="${esc(photoSrc)}" alt="${esc(s.name||"")}"></div></div></div>
        <div class="name-row">
          <h1 class="name">${esc(s.name||"")}</h1>
          ${s.verified ? `<span class="verify" title="Vérifiée"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 8"/></svg></span>` : ``}
        </div>
        ${(s.chip_online||s.chip_location) ? `<div class="chips">
          ${s.chip_online ? `<span class="chip"><span class="dot"></span>${esc(s.online_text||"En ligne")}</span>` : ``}
          ${(s.chip_online&&s.chip_location) ? `<span class="sep">·</span>` : ``}
          ${s.chip_location ? `<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="loc-text">${esc(s.location_text||"")}</span></span>` : ``}
        </div>` : ``}
        ${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ``}
      </section>
      ${renderCard(s)}
      ${renderLinksList(s)}
      <p class="foot"><span class="kiss">${esc(s.kiss||"")}</span>${esc(s.copy||"")}</p>
    </main>`;

  const env = detectEnv();
  const link = container.querySelector("[data-smartlink]");
  if (link && env.isInApp) {
    const url = link.dataset.smartlink;
    link.addEventListener("click", (e) => { if (!url) return; e.preventDefault(); smartOpen(url, env); });
  }
  maybeAutoShowEscape();
  hydrateNearbyCity(container);
}

// ---- Multi-link buttons rendered below the main card
function renderLinksList(s) {
  const links = s._links || [];
  if (!links.length) return "";
  const origin = s._origin || "https://sophiemercier.fr";
  return `<div class="link-list">${links.map(l => `
    <a class="link-btn" href="/l/${esc(l.id)}" target="_blank" rel="noopener nofollow" data-smartlink="${esc(origin+"/l/"+l.id)}">
      <span class="link-btn-icon">${l.icon ? esc(l.icon) : iconFor(l.url)}</span>
      <span class="link-btn-title">${esc(l.title)}</span>
      <svg class="link-btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  `).join("")}</div>`;
}
function iconFor(url) {
  const u = String(url||"").toLowerCase();
  if (/t\.me|telegram/.test(u)) return "✈️";
  if (/instagram/.test(u)) return "📸";
  if (/tiktok/.test(u)) return "🎵";
  if (/snapchat/.test(u)) return "👻";
  if (/x\.com|twitter/.test(u)) return "𝕏";
  if (/onlyfans/.test(u)) return "🔒";
  if (/youtube|youtu\.be/.test(u)) return "▶️";
  if (/wa\.me|whatsapp/.test(u)) return "💬";
  if (/discord/.test(u)) return "🎮";
  if (/spotify/.test(u)) return "🎧";
  if (/mailto:/.test(u)) return "✉️";
  return "🔗";
}

// ============================================================ IN-APP DETECTION & SMART OPEN
function detectEnv() {
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  const isInstagram = /Instagram/.test(ua);
  const isFacebook = /FBAN|FBAV/.test(ua);
  const isTikTok = /BytedanceWebview|TikTok|musical_ly/i.test(ua);
  const isSnapchat = /Snapchat/.test(ua);
  const isMessenger = /Messenger/.test(ua);
  const isLine = /Line\//.test(ua);
  const isInApp = isInstagram || isFacebook || isTikTok || isSnapchat || isMessenger || isLine;
  return { isIOS, isAndroid, isInApp, isInstagram, isFacebook, isTikTok, isSnapchat };
}

function smartOpen(url, env) {
  if (!url) return;
  if (env.isAndroid && env.isInApp) {
    const stripped = url.replace(/^https?:\/\//, "");
    window.location.href = `intent://${stripped}#Intent;scheme=https;package=com.android.chrome;end`;
    return;
  }
  if (env.isIOS && env.isInApp) {
    const safariUrl = url.replace(/^https?:\/\//, "x-safari-https://");
    window.location.href = safariUrl;
    setTimeout(() => showOpenInBrowserBanner(env), 400);
    return;
  }
  window.location.href = url;
}

function showOpenInBrowserBanner(env) {
  if (document.getElementById("escape-banner")) return;
  if (sessionStorage.getItem("escapeDismissed")) return;
  const browser = env.isIOS ? "Safari" : "Chrome";
  const banner = document.createElement("div");
  banner.id = "escape-banner";
  banner.innerHTML = `
    <div class="escape-card">
      <button class="escape-x">×</button>
      <div class="escape-title">Ouvre dans ${browser} :</div>
      <div class="escape-steps">
        <div class="escape-step"><span class="num">1</span><span>Appuie sur <strong>…</strong> en haut à droite.</span></div>
        <div class="escape-step"><span class="num">2</span><span>Choisis <strong>Ouvrir dans le navigateur</strong>.</span></div>
      </div>
    </div>`;
  document.body.appendChild(banner);
  banner.querySelector(".escape-x").addEventListener("click", () => { banner.remove(); sessionStorage.setItem("escapeDismissed","1"); });
}

function maybeAutoShowEscape() {
  const env = detectEnv();
  if (!env.isInApp) return;
  if (env.isTikTok) return; // TikTok handled by overlay
  setTimeout(() => showOpenInBrowserBanner(env), 3000);
}

async function hydrateNearbyCity(container) {
  const el = container.querySelector(".loc-text");
  if (!el) return;
  try {
    const r = await fetch("/api/geo", { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.nearby) el.textContent = "Proche de " + d.nearby;
  } catch(e) {}
}

    await sb.from("domains").update({ is_primary: false }).eq("is_primary", true);

    await loadDomains();

let chartPeriod = "30d"; // default

const PERIOD_OPTIONS = [
  { id: "today", label: "Aujourd'hui" },
  { id: "yesterday", label: "Hier" },
  { id: "7d", label: "7 jours" },
  { id: "30d", label: "30 jours" },
  { id: "3m", label: "3 mois" }
];

function getPeriodRange(period) {
  // Returns { since: Date, until: Date, buckets: [...], granularity: 'hour'|'day', label }
  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  if (period === "today") {
    const buckets = [];
    for (let h=0; h<24; h++) {
      const d = new Date(startOfToday); d.setHours(h);
      buckets.push({ date: d, key: `${d.toISOString().slice(0,13)}`, count: 0, label: String(h).padStart(2,"0")+"h" });
    }
    return { since: startOfToday, until: now, buckets, granularity: "hour", label: "Aujourd'hui" };
  }
  if (period === "yesterday") {
    const startY = new Date(startOfToday); startY.setDate(startY.getDate()-1);
    const endY = new Date(startOfToday);
    const buckets = [];
    for (let h=0; h<24; h++) {
      const d = new Date(startY); d.setHours(h);
      buckets.push({ date: d, key: d.toISOString().slice(0,13), count: 0, label: String(h).padStart(2,"0")+"h" });
    }
    return { since: startY, until: endY, buckets, granularity: "hour", label: "Hier" };
  }
  let nDays;
  if (period === "7d") nDays = 7;
  else if (period === "3m") nDays = 90;
  else nDays = 30;
  const buckets = [];
  const fmtDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  for (let i=nDays-1; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    buckets.push({ date: d, key: fmtDay(d), count: 0, label: `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}` });
  }
  const since = buckets[0].date;
  return { since, until: now, buckets, granularity: "day", label: `${nDays} derniers jours` };
}

function bucketKeyFor(date, granularity) {
  if (granularity === "hour") return date.toISOString().slice(0,13);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

async function renderClicksChart(period) {
  if (period) chartPeriod = period;
  const wrap = document.getElementById("clicks_chart"); if (!wrap) return;
  wrap.innerHTML = `<div class="chart-card chart-loading">Chargement des stats…</div>`;

  const range = getPeriodRange(chartPeriod);
  const { data, error } = await sb.from("link_clicks")
    .select("clicked_at,user_agent_kind,slug")
    .gte("clicked_at", range.since.toISOString())
    .lte("clicked_at", range.until.toISOString())
    .order("clicked_at", { ascending: true });
  if (error) { wrap.innerHTML = `<div class="chart-card">Erreur stats: ${esc(error.message)}</div>`; return; }
  const events = data || [];

  const byKey = Object.fromEntries(range.buckets.map(b => [b.key, b]));
  events.forEach(ev => { const k = bucketKeyFor(new Date(ev.clicked_at), range.granularity); if (byKey[k]) byKey[k].count++; });

  const byKind = { tiktok: 0, instagram: 0, snapchat: 0, facebook: 0, browser: 0, other: 0 };
  events.forEach(ev => { const k = ev.user_agent_kind; if (byKind[k] !== undefined) byKind[k]++; else byKind.other++; });
  const totalRange = events.length;
  const bySlug = {};
  events.forEach(ev => { bySlug[ev.slug] = (bySlug[ev.slug]||0) + 1; });
  const topPages = Object.entries(bySlug).sort((a,b) => b[1]-a[1]).slice(0,5);

  const periodTabs = PERIOD_OPTIONS.map(o => `
    <button class="period-tab ${o.id===chartPeriod?"active":""}" data-period="${esc(o.id)}">${esc(o.label)}</button>
  `).join("");

  wrap.innerHTML = `
    <div class="chart-card">
      <div class="chart-head">
        <div>
          <h3>${esc(range.label)}</h3>
          <p>${formatNum(totalRange)} clic${totalRange!==1?"s":""} sur la période</p>
        </div>
        <div class="period-tabs">${periodTabs}</div>
      </div>
      <div class="chart-platforms">
        ${[["tiktok","TikTok","#000"],["instagram","Insta","#e1306c"],["snapchat","Snap","#f7d100"],["facebook","FB","#1877f2"],["browser","Direct","#8a5a6c"]]
          .map(([k,lbl,c]) => `<span class="cplat" style="--c:${c}"><span class="cdot"></span>${esc(lbl)} <strong>${formatNum(byKind[k]||0)}</strong></span>`).join("")}
      </div>
      <div class="chart-area">${renderSparkline(range.buckets, range.granularity)}</div>
      ${topPages.length ? `<div class="chart-top">
        <h4>Pages les plus cliquées</h4>
        ${topPages.map(([slug,n]) => {
          const max = topPages[0][1] || 1;
          const w = Math.round((n/max)*100);
          return `<div class="chart-row">
            <span class="chart-slug">/${esc(slug)}</span>
            <span class="chart-bar"><span style="width:${w}%"></span></span>
            <span class="chart-n">${formatNum(n)}</span>
          </div>`;
        }).join("")}
      </div>`:""}
    </div>
  `;
  wrap.querySelectorAll(".period-tab").forEach(btn => {
    btn.addEventListener("click", () => renderClicksChart(btn.dataset.period));
  });
}

function renderSparkline(buckets, granularity) {
  const W = 800, H = 140, P = 24;
  const max = Math.max(1, ...buckets.map(b => b.count));
  const step = (W - P*2) / Math.max(1, buckets.length - 1);
  const pts = buckets.map((b,i) => { const x = P + i*step; const y = H - P - (b.count/max)*(H - P*2); return { x, y, b }; });
  const linePath = pts.map((p,i) => (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const areaPath = linePath + ` L${(P + (buckets.length-1)*step).toFixed(1)},${H-P} L${P},${H-P} Z`;
  // X-axis labels — adapt density to bucket count
  const labels = [];
  let stride;
  if (granularity === "hour") stride = 3;        // every 3 hours
  else if (buckets.length <= 10) stride = 1;     // every day
  else if (buckets.length <= 35) stride = 5;     // every 5 days
  else stride = Math.ceil(buckets.length / 10);  // ~10 labels for 3 months
  for (let i=0; i<buckets.length; i+=stride) {
    const x = P + i*step;
    labels.push(`<text x="${x.toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="10" fill="#8a7a90">${esc(buckets[i].label)}</text>`);
  }
  const dots = pts.map(p => p.b.count>0 ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#e84a86"><title>${p.b.label}: ${p.b.count} clic${p.b.count!==1?"s":""}</title></circle>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">
    <defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e84a86" stop-opacity=".35"/><stop offset="100%" stop-color="#e84a86" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#chartGrad)"/>
    <path d="${linePath}" fill="none" stroke="#e84a86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    ${labels.join("")}
  </svg>`;
}

function renderPagesGrid() {
  const grid = document.getElementById("pages_grid");
  // Global stats
  const statsEl = document.getElementById("global_stats");
  if (statsEl) {
    const total = pages.reduce((a,p) => a + (p.click_count||0), 0);
    statsEl.innerHTML = `
      <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg> <strong>${formatNum(total)}</strong> clic${total!==1?"s":""} au total</span>
      <span class="stat">📄 <strong>${pages.length}</strong> page${pages.length!==1?"s":""}</span>
      <span class="stat">📁 <strong>${folders.length}</strong> dossier${folders.length!==1?"s":""}</span>
    `;
  }
  if (!pages.length && !folders.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <h3>Aucune page pour le moment</h3>
        <p>Crée ta première landing en cliquant sur <strong>Nouvelle page</strong>.</p>
        <button class="btn btn-primary" onclick="document.getElementById('btn_new_page').click()">+ Nouvelle page</button>
      </div>`;
    return;
  }
  let html = "";
  // Folders + their pages
  for (const f of folders) {
    const fPages = pages.filter(p => p.folder_id === f.id);
    const closed = openFolders.has("__closed:"+f.id);
    html += `<div class="folder ${closed?'closed':''}" data-fid="${esc(f.id)}">
      <div class="folder-head">
        <span class="caret">${icon("chevron-down", 14)}</span>
        <span class="emoji">${esc(f.emoji||"📁")}</span>
        <span class="name">${esc(f.name)}</span>
        <span class="count">${fPages.length} page${fPages.length>1?"s":""}</span>
        <button class="menu-btn" data-folder-action="add" data-fid="${esc(f.id)}" title="Ajouter une page ici">${icon("plus", 16)}</button>
        <button class="menu-btn" data-folder-action="rename" data-fid="${esc(f.id)}" title="Renommer">${icon("edit", 16)}</button>
        <button class="menu-btn" data-folder-action="delete" data-fid="${esc(f.id)}" title="Supprimer le dossier">${icon("trash", 16)}</button>
      </div>
      <div class="folder-body">${fPages.map(pageCardHTML).join("") || `<div class="empty-state" style="grid-column:1/-1;padding:24px;">Aucune page dans ce dossier</div>`}</div>
    </div>`;
  }
  // Pages without a folder
  const orphans = pages.filter(p => !p.folder_id);
  if (orphans.length) {
    html += `<div class="folder" data-fid="">
      <div class="folder-head">
        <span class="caret">${icon("chevron-down", 14)}</span>
        <span class="emoji">${icon("inbox", 16)}</span>
        <span class="name">Sans dossier</span>
        <span class="count">${orphans.length} page${orphans.length>1?"s":""}</span>
      </div>
      <div class="folder-body">${orphans.map(pageCardHTML).join("")}</div>
    </div>`;
  }
  grid.innerHTML = html;

  // Bind folder toggles
  grid.querySelectorAll(".folder-head").forEach(head => {
    head.addEventListener("click", e => {
      if (e.target.closest(".menu-btn")) return;
      const folder = head.parentNode;
      folder.classList.toggle("closed");
      const fid = folder.dataset.fid;
      const key = "__closed:"+fid;
      if (folder.classList.contains("closed")) openFolders.add(key); else openFolders.delete(key);
    });
  });
  grid.querySelectorAll(".menu-btn").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      const action = btn.dataset.folderAction;
      const fid = btn.dataset.fid;
      if (action === "rename") openRenameFolderModal(fid);
      else if (action === "delete") onDeleteFolder(fid);
      else if (action === "add") openNewPageModal(fid);
    });
  });
  grid.querySelectorAll(".page-card").forEach(card => {
    card.addEventListener("click", e => {
      // Don't open drawer when clicking copy / open buttons inside the card
      if (e.target.closest(".pc-copy") || e.target.closest(".pc-open")) return;
      openPageDrawer(card.dataset.id);
    });
  });
  grid.querySelectorAll(".pc-copy").forEach(btn => {
    btn.addEventListener("click", async e => {
      e.stopPropagation();
      if (btn.hasAttribute("data-copy-menu")) {
        showDomainCopyMenu(btn, btn.dataset.slug);
      } else {
        await copyToClipboard(btn.dataset.copy, btn);
      }
    });
  });
}

async function copyToClipboard(url, btn) {
  try {
    await navigator.clipboard.writeText(url);
    if (btn) {
      btn.classList.add("copied");
      const orig = btn.innerHTML;
      btn.innerHTML = icon("check", 14);
      toast("Lien copié");
      setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = orig; }, 1500);
    } else {
      toast("Lien copié");
    }
  } catch(_) { toast("Impossible de copier"); }
}

function showDomainCopyMenu(anchor, slug) {
  document.querySelectorAll(".domain-menu").forEach(m => m.remove());
  const rect = anchor.getBoundingClientRect();
  const menu = document.createElement("div");
  menu.className = "domain-menu";
  menu.style.top = (rect.bottom + window.scrollY + 4) + "px";
  menu.style.left = Math.max(8, rect.right + window.scrollX - 260) + "px";
  menu.innerHTML = `
    <div class="domain-menu-head">Copier le lien depuis…</div>
    ${domains.map(d => `
      <button class="domain-menu-item" data-domain="${esc(d.domain)}">
        ${icon("link", 14)}
        <span>${esc(d.domain)}/${esc(slug)}</span>
        ${d.is_primary?`<span class="domain-menu-tag">Principal</span>`:``}
      </button>
    `).join("")}
  `;
  document.body.appendChild(menu);
  menu.querySelectorAll(".domain-menu-item").forEach(b => {
    b.addEventListener("click", async () => {
      await copyToClipboard(`https://${b.dataset.domain}/${slug}`);
      menu.remove();
    });
  });
  setTimeout(() => {
    document.addEventListener("click", function close(e) {
      if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener("click", close); }
    });
  }, 50);
}

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"") + "k";
  return String(n);
}

function openRenameFolderModal(fid) {
  const f = folders.find(x => x.id === fid); if (!f) return;
  showModal({
    title: "Renommer le dossier",
    body: `
      <label>Nom</label>
      <input type="text" id="m_name" value="${esc(f.name)}" autofocus>
      <label>Emoji</label>
      <input type="text" id="m_emoji" value="${esc(f.emoji||"📁")}" maxlength="4">

    submitLabel: "Enregistrer",
    onSubmit: async () => {
      const name = document.getElementById("m_name").value.trim();
      const emoji = document.getElementById("m_emoji").value.trim() || "📁";
      if (!name) return false;
      const { error } = await sb.from("folders").update({ name, emoji }).eq("id", fid);
      if (error) { toast(error.message); return false; }
      f.name = name; f.emoji = emoji; renderPagesGrid(); return true;
    }
  });
}

async function onDeleteFolder(fid) {
  const f = folders.find(x => x.id === fid); if (!f) return;
  const fPages = pages.filter(p => p.folder_id === fid);
  if (!confirm(`Supprimer le dossier "${f.name}" ?\nLes ${fPages.length} page(s) à l'intérieur ne seront pas supprimées, elles reviendront dans "Sans dossier".`)) return;
  const { error } = await sb.from("folders").delete().eq("id", fid);
  if (error) return toast(error.message);
  folders = folders.filter(x => x.id !== fid);
  pages.forEach(p => { if (p.folder_id === fid) p.folder_id = null; });
  renderPagesGrid();
}

function showModal({ title, body, submitLabel, onSubmit }) {
  const wrap = document.createElement("div");
  wrap.className = "modal-overlay";
  wrap.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      <div class="modal-body">${body}</div>
      <div class="actions">
        <button class="btn" data-cancel>Annuler</button>
        <button class="btn btn-primary" data-submit>${esc(submitLabel)}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector("[data-cancel]").addEventListener("click", close);
  wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
  wrap.querySelector("[data-submit]").addEventListener("click", async () => {
    const ok = await onSubmit();
    if (ok !== false) close();
  });
  setTimeout(() => { const inp = wrap.querySelector("input[autofocus]"); if (inp) inp.focus(); }, 50);
}

// --- Page editor drawer
async function openPageDrawer(id) {
  openPageId = id;
  const p = pages.find(x => x.id === id);
  if (!p) return;
  // Load this page's links from DB
  const r = await sb.from("page_links").select("*").eq("page_id", id).order("position", { ascending: true });
  p._links = r.data || [];
  document.querySelectorAll(".drawer-overlay,.drawer").forEach(x => x.remove());
  const overlay = document.createElement("div"); overlay.className = "drawer-overlay";
  document.body.appendChild(overlay);
  overlay.addEventListener("click", closePageDrawer);

  const drawer = document.createElement("div"); drawer.className = "drawer";
  drawer.innerHTML = `
    <div class="drawer-form">
      <div class="drawer-head">
        <h2>Édition · /<span id="hint_slug">${esc(p.slug)}</span></h2>
        <button class="x" data-close>×</button>
      </div>
      <div class="drawer-tabs">
        <button class="active" data-tab="content">Contenu</button>
        <button data-tab="links">Liens</button>
        <button data-tab="design">Apparence</button>
        <button data-tab="platform">Plateformes</button>
        <button data-tab="settings">Réglages</button>
      </div>
      <div id="tab_content"></div>
    </div>
    <div class="drawer-preview">
      <iframe id="preview" title="Aperçu"></iframe>
    </div>
    <div class="drawer-save">
      <span class="status saved" id="save_status">Sauvegardé ✓</span>
      <button class="btn btn-danger" id="btn_delete_page">Supprimer la page</button>
    </div>`;
  document.body.appendChild(drawer);

  drawer.querySelector("[data-close]").addEventListener("click", closePageDrawer);
  drawer.querySelectorAll(".drawer-tabs button").forEach(b => {
    b.addEventListener("click", () => {
      drawer.querySelectorAll(".drawer-tabs button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      renderTab(b.dataset.tab);
    });
  });
  document.getElementById("btn_delete_page").addEventListener("click", onDeleteCurrentPage);

  renderTab("content");
  updatePreview();
}

function closePageDrawer() {
  document.querySelectorAll(".drawer-overlay,.drawer").forEach(x => x.remove());
  openPageId = null;
}

function currentPage() { return pages.find(x => x.id === openPageId); }

function bindInputs(area) {
  area.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.field;
      const val = el.type === "checkbox" ? el.checked : el.value;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), [key]: val };
      const pick = area.querySelector(`[data-pick="${key}"]`);
      if (pick && el.type === "text" && /^#[0-9a-f]{6}$/i.test(val)) pick.value = val;
      scheduleSave(); updatePreview();
    });
  });
  area.querySelectorAll("[data-pick]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.pick;
      const val = el.value;
      const p = currentPage(); p.data = { ...(p.data||{}), [key]: val };
      const txt = area.querySelector(`[data-field="${key}"]`); if (txt) txt.value = val;
      scheduleSave(); updatePreview();
    });
  });
  const slugInp = area.querySelector("[data-slug]");
  if (slugInp) slugInp.addEventListener("change", async e => {
    const newSlug = slugify(e.target.value);
    const p = currentPage();
    if (!newSlug) { e.target.value = p.slug; return; }
    if (pages.some(x => x.id !== p.id && x.slug === newSlug)) {
      toast("Slug déjà pris"); e.target.value = p.slug; return;
    }
    if (newSlug === p.slug) return;
    p.slug = newSlug; e.target.value = newSlug;
    document.getElementById("hint_slug").textContent = newSlug;
    clearTimeout(saveTimer);
    await saveNow();        // immediate save — no debounce — so slug always persists
    renderPagesGrid();
  });
  const folderSel = area.querySelector("[data-folder]");
  if (folderSel) folderSel.addEventListener("change", () => {
    const p = currentPage(); p.folder_id = folderSel.value || null;
    scheduleSave(); renderPagesGrid();
  });
  const photoBtn = document.getElementById("photo_btn");
  if (photoBtn) {
    photoBtn.addEventListener("click", () => document.getElementById("photo_input").click());
    document.getElementById("photo_input").addEventListener("change", onPhotoUpload);
  }
  // Card style picker
  area.querySelectorAll(".cstyle-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.style;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), card_style: id };
      area.querySelectorAll(".cstyle-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Background presets
  area.querySelectorAll(".bg-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.bg;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), bg_style: id };
      area.querySelectorAll(".bg-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Theme presets
  area.querySelectorAll(".theme-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = THEMES.find(x => x.id === chip.dataset.theme); if (!t) return;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), c_rose: t.rose, c_deep: t.deep, c_ink: t.ink, c_inksoft: t.inksoft };
      // Reflect in the color inputs without rerendering the whole tab
      const set = (k, v) => {
        const txt = area.querySelector(`[data-field="${k}"]`);
        const pick = area.querySelector(`[data-pick="${k}"]`);
        if (txt) txt.value = v;
        if (pick) pick.value = v;
      };
      set("c_rose", t.rose); set("c_deep", t.deep); set("c_ink", t.ink); set("c_inksoft", t.inksoft);
      area.querySelectorAll(".theme-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
    // Mark active if matches current colors
    const t = THEMES.find(x => x.id === chip.dataset.theme);
    const p = currentPage(); const d = p?.data || {};
    if (t && d.c_rose === t.rose && d.c_deep === t.deep && d.c_ink === t.ink && d.c_inksoft === t.inksoft) {
      chip.classList.add("active");
    }
  });
}

async function onPhotoUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) { toast("Image > 5 Mo"); return; }
  setSaveStatus("Upload…", "saving");
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${currentPage().slug}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("landing_photos").upload(path, file, { upsert: true, contentType: file.type });
  if (error) { toast(error.message); return; }
  const old = currentPage().photo_path;
  if (old && old !== path) { try { await sb.storage.from("landing_photos").remove([old]); } catch(_) {} }
  currentPage().photo_path = path;
  document.getElementById("photo_preview").src = sb.storage.from("landing_photos").getPublicUrl(path).data.publicUrl;
  await saveNow(); updatePreview(); renderPagesGrid();
}

function scheduleSave() { setSaveStatus("Modification en attente…","saving"); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }
function normalizeUrl(u) {
  if (!u) return u;
  u = String(u).trim();
  if (!u) return u;
  if (/^[a-z]+:\/\//i.test(u)) return u; // already has protocol
  return "https://" + u.replace(/^\/+/, "");
}

async function saveNow() {
  const p = currentPage(); if (!p) return;
  setSaveStatus("Sauvegarde…","saving");
  // Auto-normalize the URL: prepend https:// if missing
  if (p.data?.url) {
    const normalized = normalizeUrl(p.data.url);
    if (normalized !== p.data.url) {
      p.data.url = normalized;
      const inp = document.querySelector("[data-field=\"url\"]");
      if (inp) inp.value = normalized;
    }
  }
  const { error } = await sb.from("landing_pages").update({
    slug: p.slug, data: p.data, photo_path: p.photo_path, folder_id: p.folder_id
  }).eq("id", p.id);
  if (error) { setSaveStatus("Erreur: "+error.message); return; }
  setSaveStatus("Sauvegardé ✓","saved");
}
function setSaveStatus(text, cls) {
  const el = document.getElementById("save_status");
  if (!el) return;
  el.textContent = text;
  el.className = "status"+(cls?" "+cls:"");
}

function updatePreview() {
  const p = currentPage(); if (!p) return;
  const iframe = document.getElementById("preview");
  if (!iframe) return;
  const photoUrl = p.photo_path ? sb.storage.from("landing_photos").getPublicUrl(p.photo_path).data.publicUrl : "";
  const enabledLinks = (p._links||[]).filter(l => l.enabled);
  const s = { ...(p.data||{}), photo: photoUrl, slug: p.slug, _origin: window.location.origin, _links: enabledLinks };
  const wrap = document.createElement("div");
  renderLanding(wrap, s);
  const styleEl = document.querySelector("style");
  iframe.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${styleEl.textContent}</style></head><body><div style="--rose:${s.c_rose||'#ff6fa3'};--rose-deep:${s.c_deep||'#e84a86'};--ink:${s.c_ink||'#3a1825'};--ink-soft:${s.c_inksoft||'#8a5a6c'};">${wrap.outerHTML}</div></body></html>`;
}

// ---- Multi-link CRUD inside the page drawer
function renderLinksEditList() {
  const list = document.getElementById("links_list"); if (!list) return;
  const p = currentPage(); if (!p) return;
  const links = p._links || [];
  if (!links.length) {
    list.innerHTML = `<div class="link-edit-empty">Aucun lien additionnel. Clique <strong>+ Ajouter un lien</strong> pour en créer un.</div>`;
    return;
  }
  list.innerHTML = links.map((l, idx) => `
    <div class="link-edit-row" data-id="${esc(l.id)}">
      <div class="link-edit-handle" title="Glisser pour réordonner">⋮⋮</div>
      <div class="link-edit-icon">${esc(l.icon || iconFor(l.url))}</div>
      <div class="link-edit-meta">
        <div class="link-edit-title">${esc(l.title)} ${l.enabled?"":`<span class="link-edit-off">désactivé</span>`}</div>
        <div class="link-edit-sub">${l.username ? `<span class="link-edit-user">@${esc(l.username.replace(/^@/,""))}</span> · `: ""}${esc(l.url)}</div>
      </div>
      <div class="link-edit-stats">${formatNum(l.click_count||0)} clic${(l.click_count||0)!==1?"s":""}</div>
      <button class="link-edit-btn" data-act="up" ${idx===0?"disabled":""} title="Monter">${icon("arrow-up", 14)}</button>
      <button class="link-edit-btn" data-act="down" ${idx===links.length-1?"disabled":""} title="Descendre">${icon("arrow-down", 14)}</button>
      <button class="link-edit-btn" data-act="edit" title="Modifier">${icon("edit", 14)}</button>
      <button class="link-edit-btn" data-act="toggle" title="${l.enabled?"Désactiver":"Activer"}">${icon(l.enabled?"eye-off":"eye", 14)}</button>
      <button class="link-edit-btn danger" data-act="delete" title="Supprimer">${icon("trash", 14)}</button>
    </div>
  `).join("");
  list.querySelectorAll(".link-edit-row").forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", e => { e.stopPropagation(); onLinkAction(btn.dataset.act, id); });
    });
  });
}

async function onLinkAction(action, id) {
  const p = currentPage(); if (!p) return;
  const links = p._links || [];
  const idx = links.findIndex(l => l.id === id);
  if (idx < 0) return;
  const link = links[idx];

  if (action === "edit") return openLinkModal(link);
  if (action === "delete") {
    if (!confirm(`Supprimer le lien "${link.title}" ?`)) return;
    const { error } = await sb.from("page_links").delete().eq("id", id);
    if (error) return toast(error.message);
    p._links = links.filter(l => l.id !== id);
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "toggle") {
    const newVal = !link.enabled;
    const { error } = await sb.from("page_links").update({ enabled: newVal }).eq("id", id);
    if (error) return toast(error.message);
    link.enabled = newVal;
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "up" || action === "down") {
    const swapIdx = action === "up" ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= links.length) return;
    const other = links[swapIdx];
    // Swap positions
    const linkPos = link.position, otherPos = other.position;
    const updA = sb.from("page_links").update({ position: otherPos }).eq("id", link.id);
    const updB = sb.from("page_links").update({ position: linkPos }).eq("id", other.id);
    await Promise.all([updA, updB]);
    link.position = otherPos; other.position = linkPos;
    p._links = [...links].sort((a,b) => a.position - b.position);
    renderLinksEditList(); updatePreview();
    return;
  }
}

function openLinkModal(link) {
  const editing = !!link;
  showModal({
    title: editing ? "Modifier le lien" : "Nouveau lien",
    body: `
      <label>Titre du bouton</label>
      <input type="text" id="ml_title" placeholder="Ex: Mon Telegram" value="${editing?esc(link.title):""}" autofocus>
      <label>URL</label>
      <input type="url" id="ml_url" placeholder="https://t.me/..." value="${editing?esc(link.url):""}">
      <label>Username du compte (interne, pour l'orga)</label>
      <input type="text" id="ml_username" placeholder="@sophie_xxx" value="${editing?esc(link.username||""):""}">
      <p class="hint">Le username n'apparaît jamais sur la landing publique — c'est juste pour t'y retrouver dans l'admin.</p>
      <label>Icône (1 emoji, optionnel)</label>
      <input type="text" id="ml_icon" maxlength="4" placeholder="auto" value="${editing?esc(link.icon||""):""}">
      <p class="hint">Laisse vide pour détection auto (Telegram = ✈️, Insta = 📸, etc.)</p>
    `,
    submitLabel: editing ? "Enregistrer" : "Créer",
    onSubmit: async () => {
      const title = document.getElementById("ml_title").value.trim();
      let url = document.getElementById("ml_url").value.trim();
      const username = document.getElementById("ml_username").value.trim();
      const icon = document.getElementById("ml_icon").value.trim() || null;
      if (!title || !url) return false;
      url = normalizeUrl(url);
      const p = currentPage();
      if (editing) {
        const { error } = await sb.from("page_links").update({ title, url, username, icon }).eq("id", link.id);
        if (error) { toast(error.message); return false; }
        Object.assign(link, { title, url, username, icon });
      } else {
        const pos = (p._links || []).length;
        const { data: row, error } = await sb.from("page_links").insert({
          page_id: p.id, title, url, username, icon, position: pos, enabled: true
        }).select().single();
        if (error) { toast(error.message); return false; }
        p._links = [...(p._links||[]), row];
      }
      renderLinksEditList(); updatePreview();
      toast(editing ? "Lien modifié" : "Lien ajouté"); return true;
    }
  });
}

async function onDeleteCurrentPage() {
  const p = currentPage(); if (!p) return;
  if (!confirm(`Supprimer la page "${p.slug}" définitivement ?`)) return;
  if (p.photo_path) { try { await sb.storage.from("landing_photos").remove([p.photo_path]); } catch(_) {} }
  const { error } = await sb.from("landing_pages").delete().eq("id", p.id);
  if (error) return toast(error.message);
  pages = pages.filter(x => x.id !== p.id);
  closePageDrawer();
  renderPagesGrid();
  toast("Page supprimée");
}

// Start
route();
</script>
