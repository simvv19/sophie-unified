  .pcard-slide .psl-track { position: relative; background: color-mix(in srgb, var(--ink) 6%, transparent);

  .pcard-slide .psl-shimmer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

  .pcard-slide .psl-thumb { position: absolute; left: 4px; top: 4px; width: 48px; height: 48px; border-radius: 50%;

  /* ============================================================ CARD 14 — LIPSTICK KISS */

    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 64' fill='%23e84a86' opacity='.35'><path d='M50 12c-6-10-22-12-30-4-8 8-6 22 6 30 8 6 18 14 24 22 6-8 16-16 24-22 12-8 14-22 6-30-8-8-24-6-30 4z'/><path d='M48 18c-5-7-15-8-22-2-5 5-4 14 4 20 5 4 13 10 18 16 5-6 13-12 18-16 8-6 9-15 4-20-7-6-17-5-22 2z' fill='%23ff6fa3' opacity='.6'/></svg>");
    background-size: contain; background-repeat: no-repeat; transform: rotate(-12deg); animation: pksFloat 4s ease-in-out infinite; }

  .pcard-kiss h2 { font-family: 'Geist', system-ui, sans-serif; font-weight: 500; font-size: 26px; line-height: 1.15;

  .pks-cta { position: relative; display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 18px 12px 14px; background: #fff; border: 1.5px solid var(--ink); border-radius: 999px;
    color: var(--ink); font-weight: 600; font-size: 14px; overflow: visible; }

  .pks-lips svg { width: 100%; height: 100%; color: var(--rose-deep); }
  .pks-cta::after { content: ''; position: absolute; top: -10px; right: 14px; width: 22px; height: 16px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 16' fill='%23e84a86'><path d='M5 4C3 2 0 3 0 6c0 3 3 5 6 7 1.5 1 5 3 6 3 1 0 4.5-2 6-3 3-2 6-4 6-7 0-3-3-4-5-2-1.5 1.5-4 2.5-7 2.5S6.5 5.5 5 4z'/></svg>");
    background-repeat: no-repeat; background-size: contain; opacity: 0;
    transform: rotate(-18deg) scale(.5); animation: pksDrop 5s ease-in-out infinite 2s; }
  @keyframes pksDrop { 0%,70%,100% { opacity: 0; transform: rotate(-18deg) scale(.5) translateY(-10px); }
    78%,92% { opacity: 1; transform: rotate(-18deg) scale(1) translateY(0); } }

  /* ============================================================ CARD 15 — SEALED LETTER */
  .pcard-letter { background: var(--cream); border-radius: 26px; padding: 28px 24px 24px; position: relative; overflow: hidden;
    box-shadow: 0 30px 60px -28px rgba(45,127,249,.45); border: 1px solid color-mix(in srgb, var(--rose) 18%, white);
    text-align: center; text-decoration: none; display: block; color: var(--ink); }
  .pcard-letter::before { content: ''; position: absolute; inset: 0;

  .pcard-letter .plt-stamp { position: absolute; top: 14px; right: 14px; width: 44px; height: 54px;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));

    font-style: italic; font-family: 'Geist', system-ui, sans-serif; }
  .plt-cta { position: relative; display: inline-flex; align-items: center; gap: 0;

  .plt-seal { position: relative; width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--rose) 60%, white), var(--rose-deep) 60%, color-mix(in srgb, var(--rose-deep) 70%, var(--ink)));
    box-shadow: 0 8px 20px -6px rgba(26,107,224,.6), inset 0 -6px 14px rgba(26,107,224,.5), inset 0 4px 8px rgba(255,255,255,.4);
    display: grid; place-items: center; color: #fff; font-family: 'Geist', system-ui, sans-serif; font-style: italic; font-size: 22px;
    z-index: 2; animation: pltWax 4s ease-in-out infinite; }

  @keyframes pltWax { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.05) rotate(-3deg); } }
  .plt-cta .plt-label { margin-left: -10px; padding: 12px 18px 12px 24px;

    text-transform: uppercase; margin-bottom: 2px; }

  /* ============================================================ TIKTOK 18+ OVERLAY */
  .tt-overlay { position: fixed; inset: 0; z-index: 10000; background: #000; overflow: hidden; }

  .tt-bubble { position: absolute; top: 18px; right: 18px; max-width: 240px;
    background: #fff; color: #111; border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.3; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); }
  .tt-bubble strong { font-weight: 700; }
  .tt-bubble::after { content:""; position:absolute; top:-8px; right:18px; width:0; height:0;

  }
  @keyframes ttPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .tt-btn .tt-hand { width: 22px; height: 22px; flex: none; background: rgba(255,255,255,.18); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .tt-foot { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.8); font-size: 13px; }

  /* ============================================================ ESCAPE BANNER (other in-app browsers) */

  /* ============================================================ LOGIN */

  .main { padding: 28px 32px 60px; max-width: 1200px; }

  .btn-danger:hover { background: #E4F1FE; }

  /* Folders */
  .folder { background: #fff; border: 1px solid var(--border); border-radius: 18px; margin-bottom: 16px; overflow: hidden; box-shadow: rgba(10,11,36,0.016) 0px 3px 4px -2px, rgba(10,11,36,0.016) 0px 8px 4px -4px; }

  /* Page card */
  .page-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; display: flex; flex-direction: column; box-shadow: rgba(10,11,36,0.02) 0px 3px 6px 0px; }

  .page-card .pc-name { font-weight: 600; font-size: 14px; margin: 0 0 2px; }

  /* Drawer (editor) */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(10,11,36,.4); backdrop-filter: blur(4px); z-index: 100; animation: dFade .2s; }
  @keyframes dFade { from { opacity: 0; } to { opacity: 1; } }

  fieldset { border: none; padding: 0; margin: 0 0 18px; }

  input[type=text]:focus, input[type=url]:focus, input[type=email]:focus, textarea:focus, select:focus { outline: none; border-color: var(--admin); box-shadow: 0 0 0 3px rgba(59,157,247,0.15); }

  .photo-row { display: flex; align-items: center; gap: 12px; }

  .toggle-row label { margin: 0; font-size: 13px; cursor: pointer; }
  .slug-row { display: flex; gap: 8px; align-items: center; }

  /* Clicks chart */
  .chart-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; margin-bottom: 20px; box-shadow: rgba(10,11,36,0.016) 0px 3px 4px -2px; }
  .chart-card.chart-loading { color: var(--muted); text-align: center; font-size: 13.5px; padding: 30px; }
  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .chart-head h3 { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 18px; margin: 0 0 2px; letter-spacing: -0.48px; }
  .chart-head p { font-size: 12.5px; color: var(--muted); margin: 0; }
  .period-tabs { display: inline-flex; gap: 2px; padding: 3px; background: #f0f0f5; border-radius: 10px; flex-wrap: wrap; }
  .period-tab { background: transparent; border: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500; color: #6B6B6E; }
  .period-tab:hover { color: var(--ink); }
  .period-tab.active { background: #fff; color: var(--admin-deep); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .chart-platforms { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 6px; }
  .cplat { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-soft); background: #f6f6f8; padding: 4px 10px; border-radius: 999px; }
  .cplat .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--admin-deep)); }
  .cplat strong { color: var(--ink); font-weight: 700; margin-left: 2px; }
  .chart-area { margin: 4px 0 14px; }
  .chart-top { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--border); }
  .chart-top h4 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 8px; }
  .chart-row { display: grid; grid-template-columns: 90px 1fr 40px; gap: 10px; align-items: center; padding: 4px 0; font-size: 12.5px; }
  .chart-slug { font-family: ui-monospace, monospace; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart-bar { height: 8px; background: #f6f6f8; border-radius: 999px; overflow: hidden; }

  .chart-n { text-align: right; color: var(--admin-deep); font-weight: 600; font-size: 12px; }

  /* Links edit list (inside drawer) */
  .links-edit-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .link-edit-empty { padding: 24px; text-align: center; color: var(--muted); background: #f6f6f8; border: 1px dashed var(--border); border-radius: 12px; font-size: 13.5px; }
  .link-edit-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
  .link-edit-handle { color: var(--muted); font-size: 14px; cursor: grab; }
  .link-edit-icon { width: 32px; height: 32px; border-radius: 8px; background: #f6f6f8; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .link-edit-meta { flex: 1; min-width: 0; }

  .link-edit-off { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #e8e8ec; color: #8a7a90; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
  .link-edit-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .link-edit-user { color: var(--admin-deep); font-weight: 600; }
  .link-edit-stats { font-size: 11px; color: var(--admin-deep); background: #f0f0f5; padding: 3px 8px; border-radius: 999px; font-weight: 600; flex: none; }
  .link-edit-btn { background: none; border: 1px solid var(--border); width: 28px; height: 28px; border-radius: 7px; cursor: pointer; color: var(--ink-soft); font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .link-edit-btn:hover:not(:disabled) { background: #f6f6f8; color: var(--ink); }
  .link-edit-btn:disabled { opacity: .3; cursor: not-allowed; }
  .link-edit-btn.danger:hover { background: #E4F1FE; color: #EF4444; border-color: #BBDDFB; }

  /* Card style picker */
  .cstyle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 6px; }
  .cstyle-chip { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .cstyle-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(10,11,36,.18); border-color: #d1d5db; }
  .cstyle-chip.active { border-color: var(--admin-deep); box-shadow: 0 0 0 2px rgba(59,157,247,.20); }
  .cstyle-name { font-size: 11.5px; font-weight: 500; color: var(--ink); text-align: center; }
  .cstyle-mini { height: 60px; border-radius: 8px; position: relative; overflow: hidden; }
  .cstyle-mini-soft { background: linear-gradient(135deg, #2D7FF9 0%, #1A6BE0 100%); }
  .cstyle-mini-soft::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 8px; height: 14px; border-radius: 8px; background: #fff; }
  .cstyle-mini-polaroid { background: #fff; border: 1px solid #ebe4ef; transform: rotate(-3deg); }
  .cstyle-mini-polaroid::after { content: ""; position: absolute; inset: 4px 4px 14px 4px; border-radius: 4px; background: linear-gradient(135deg, #d6e8ff, #5ba3ff); }
  .cstyle-mini-minimal { background: #fff7fa; border: 1.5px solid #b3d4ff; border-radius: 10px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; }
  .cstyle-mini-minimal::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #2D7FF9, #1A6BE0); }
  .cstyle-mini-sticker { background: #e8f0fe; border: 2px solid #1D1D1E; box-shadow: 3px 3px 0 0 #1D1D1E; }
  .cstyle-mini-sticker::after { content: "✿"; position: absolute; top: 8px; right: 10px; color: #1A6BE0; font-weight: 700; }
  .cstyle-mini-locked { background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,200,220,.5)); border: 1px solid #fff; }
  .cstyle-mini-locked::after { content: "🔒"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 18px; }
  .cstyle-mini-magnetic { background: linear-gradient(135deg, #2D7FF9, #1A6BE0); box-shadow: 0 0 12px rgba(45,127,249,.6); }
  .cstyle-mini-magnetic::after { content: "✨"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 18px; }
  .cstyle-mini-heartbeat { background: #fff7fa; border: 1.5px solid #b3d4ff; display: flex; align-items: center; justify-content: center; }
  .cstyle-mini-heartbeat::after { content: "♥"; color: #1A6BE0; font-size: 22px; animation: pmiBeat 1.4s ease-in-out infinite; }
  @keyframes pmiBeat { 0%,60%,100% { transform: scale(1); } 20% { transform: scale(1.3); } }
  .cstyle-mini-marquee { background: #e8f0fe; border: 2px solid #1D1D1E; box-shadow: 3px 3px 0 0 #1D1D1E; display: flex; align-items: center; justify-content: center; font-size: 9px; letter-spacing: .1em; font-weight: 700; color: #1D1D1E; }
  .cstyle-mini-marquee::after { content: "OPEN · OPEN"; }
  .cstyle-mini-liquid { background: #fff; border: 2px solid #1A6BE0; }
  .cstyle-mini-liquid::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(180deg, transparent, #1A6BE0); }
  .cstyle-mini-wordswap { background: linear-gradient(180deg, #1D1D1E, #5a2638); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-style: italic; font-family: 'Geist', system-ui, sans-serif; }
  .cstyle-mini-wordswap::after { content: "rejoindre →"; }
  .cstyle-mini-imessage { background: #fff7fa; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
  .cstyle-mini-imessage::before { content: ""; align-self: flex-start; width: 30%; height: 8px; border-radius: 6px; background: #fff; }
  .cstyle-mini-imessage::after { content: ""; align-self: flex-start; width: 60%; height: 12px; border-radius: 8px; background: linear-gradient(135deg, #2D7FF9, #1A6BE0); }
  .cstyle-mini-cassette { background: linear-gradient(135deg, #5ba3ff, #1A6BE0); display: flex; align-items: center; justify-content: space-around; padding: 0 10px; }
  .cstyle-mini-cassette::before, .cstyle-mini-cassette::after { content: "○"; color: #1D1D1E; font-size: 18px; font-weight: 700; }
  .cstyle-mini-slide { background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,200,220,.4)); display: flex; align-items: center; justify-content: flex-start; padding: 0 4px; }
  .cstyle-mini-slide::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #2D7FF9, #1A6BE0); margin-left: 2px; }
  .cstyle-mini-kiss { background: #fff7fa; display: flex; align-items: center; justify-content: center; }
  .cstyle-mini-kiss::after { content: "💋"; font-size: 22px; }
  .cstyle-mini-letter { background: #fff7fa; display: flex; align-items: center; justify-content: center; }
  .cstyle-mini-letter::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5ba3ff, #1A6BE0 60%, #1456B8); box-shadow: 0 4px 8px -2px rgba(26,107,224,.6); }

  /* Background presets */
  .bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 6px; }
  .bg-chip { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .bg-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(10,11,36,.18); border-color: #d1d5db; }
  .bg-chip.active { border-color: var(--admin-deep); box-shadow: 0 0 0 2px rgba(59,157,247,.20); }
  .bg-preview { height: 42px; border-radius: 8px; background-size: cover !important; }
  .bg-name { font-size: 11.5px; font-weight: 500; color: var(--ink); text-align: center; }

  /* Theme presets */
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 6px; }
  .theme-chip { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .theme-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(10,11,36,.18); border-color: #d1d5db; }
  .theme-chip.active { border-color: var(--admin-deep); box-shadow: 0 0 0 2px rgba(59,157,247,.20); }
  .theme-grad { height: 36px; border-radius: 8px; }
  .theme-name { font-size: 12px; font-weight: 500; color: var(--ink); text-align: center; }

  /* Switch / segmented for platform target */
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; padding: 4px; background: #f0f0f5; border-radius: 12px; margin-top: 6px; }
  .seg label { margin: 0; cursor: pointer; }
  .seg input { display: none; }
  .seg .opt { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: #6B6B6E; text-align: center; transition: background .15s; }
  .seg input:checked + .opt { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .seg .opt svg { width: 14px; height: 14px; }

  /* Modal (folder editor) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,11,36,.4); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: dFade .2s; }
  .modal { background: #fff; border-radius: 18px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 30px 60px -20px rgba(10,11,36,.4); }
  .modal h3 { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 18px; margin: 0 0 14px; letter-spacing: -0.48px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* Domains section */
  .domains-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
  .domain-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: #fff; border: 1px solid var(--border); border-radius: 18px; box-shadow: rgba(10,11,36,0.016) 0px 3px 4px -2px; }
  .domain-status { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .domain-status.status-active { background: #34c759; box-shadow: 0 0 0 3px rgba(52,199,89,.18); }
  .domain-status.status-pending { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  .domain-status.status-error { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
  .domain-info { flex: 1; min-width: 0; }
  .domain-name { font-family: ui-monospace, monospace; font-size: 15px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .domain-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--admin-deep); color: #fff; letter-spacing: .04em; text-transform: uppercase; }
  .domain-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .domain-meta code { background: #f0f0f5; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  .domain-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .domain-actions .btn { padding: 8px 12px; font-size: 12.5px; }
  .domains-help { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; }
  .domains-help h3 { font-family: 'Geist', system-ui, sans-serif; font-weight: 500; font-size: 16px; margin: 0 0 10px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .domains-help ol { margin: 0 0 16px; padding-left: 22px; }
  .domains-help code { background: #f0f0f5; padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: ui-monospace, monospace; }
  .domains-help a { color: var(--admin-deep); }

  /* Domain copy menu */
  .domain-menu { position: absolute; z-index: 500; min-width: 260px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 6px; box-shadow: 0 16px 32px -12px rgba(10,11,36,.25); animation: dFade .15s; }
  .domain-menu-head { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #9B9B9E; font-weight: 600; padding: 8px 10px 4px; }
  .domain-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); text-align: left; }
  .domain-menu-item:hover { background: #f6f6f8; }
  .domain-menu-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
  .domain-menu-tag { background: var(--admin-deep); color: #fff; font-size: 9.5px; padding: 2px 6px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; font-family: inherit; flex: none; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: #1D1D1E; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; z-index: 1000; box-shadow: 0 14px 30px -10px rgba(0,0,0,.4); animation: tIn .2s; }
  @keyframes tIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Responsive */
  @media (max-width: 900px) {
    .admin-app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .drawer { grid-template-columns: 1fr; width: 100vw; }
    .drawer-preview { display: none; }
    .drawer-save { right: 0; }
  }

  /* ============================================================
     WEBAPP REDESIGN — ConquerorZ (overrides above; admin chrome only,
     public link cards & .cstyle-mini previews intentionally untouched)
     ============================================================ */
  .admin-app, .login-wrap, .drawer, .modal-overlay, .domain-menu, .toast {
    --s-bg:#FAFAF9; --s-card:#FFFFFF; --s-border:#E8E6E1; --s-border-strong:#D4D1CB;
    --s-ink:#16150F; --s-muted:#615F58; --s-subtle:#94908A; --s-muted-bg:#F4F3F1;
    --s-r:12px; --s-r-sm:8px; --s-ease:cubic-bezier(.2,0,0,1);
  }

  /* ---- Shell ---- */
  .admin-app { grid-template-columns: 252px 1fr; background: var(--s-bg); }
  .sidebar {
    background: var(--s-bg); border-right: 1px solid var(--s-border);
    padding: 16px 12px; gap: 2px;
  }
  .sb-logo { gap: 10px; padding: 8px 8px 18px; }
  .sb-logo .mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--admin); color:#fff;
    font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px -4px rgba(59,157,247,.5);
  }
  .sb-logo .lbl { color: var(--s-ink); font-weight: 600; font-size: 15px; }
  .sb-section {
    color: var(--s-subtle); font-size: 10.5px; letter-spacing: .12em;
    padding: 14px 10px 6px;
  }
  .sb-item {
    position: relative; color: var(--s-muted); font-size: 13.5px; font-weight: 500;
    padding: 9px 10px; border-radius: var(--s-r-sm); gap: 11px;
  }
  .sb-item svg { width: 17px; height: 17px; opacity: .85; }
  .sb-item:hover { background: var(--s-muted-bg); color: var(--s-ink); }
  .sb-item.active { background: var(--s-muted-bg); color: var(--s-ink); font-weight: 600; }
  .sb-item.active::before {
    content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:0 3px 3px 0; background: var(--admin);
  }
  .sb-item.active svg { color: var(--admin); opacity: 1; }
  .sb-foot { border-top: 1px solid var(--s-border); padding: 12px 8px 4px; }
  .sb-foot .email { color: var(--s-subtle); font-size: 12px; }
  .sb-foot button { color: var(--s-muted); text-decoration: none; font-weight: 500; }

<div id="app"></div>

<script>
(async function(){
const sb = window.__supabase;
const app = document.getElementById("app");

// ============================================================ ROUTER
function pathSegment() {
  const p = window.location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
  return p;
}

async function route() {
  return showAdmin();
  const seg = pathSegment();
  // Root and /admin both lead to the admin (login or dashboard)
  if (seg === "" || seg === "index.html" || seg === "admin") return showAdmin();
  return showLanding(seg);
}
window.addEventListener("popstate", route);

// ============================================================ ROOT
async function showRoot() {
  const { data } = await sb.from("landing_pages").select("slug").order("created_at", { ascending: true }).limit(1);
  if (data && data.length) {
    window.location.replace("/" + data[0].slug);
  } else {
    app.className = "landing-bg";
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;">
      <div>
        <h1 style="font-family:'Fraunces',serif;font-weight:500;font-size:32px;color:#1D1D1E;">Bientôt ✿</h1>
        <p style="color:#808084;font-family:'Fraunces',serif;font-style:italic;">Aucune page n'est encore en ligne.</p>
        <p style="margin-top:20px;"><a href="/admin" style="color:#1A6BE0;font-size:14px;">Admin</a></p>
      </div>
    </div>`;
  }
}

// ============================================================ PUBLIC LANDING
async function showLanding(slug) {
  const { data, error } = await sb.from("landing_pages").select("id,slug,data,photo_path").eq("slug", slug).maybeSingle();
  if (error || !data) {
    app.className = "landing-bg";
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;">
      <div>
        <h1 style="font-family:'Fraunces',serif;font-weight:500;font-size:48px;color:#1D1D1E;margin:0;">404</h1>
        <p style="color:#808084;font-family:'Fraunces',serif;font-style:italic;">Cette page n'existe pas.</p>
      </div>
    </div>`;
    return;
  }
  const photoUrl = data.photo_path ? sb.storage.from("landing_photos").getPublicUrl(data.photo_path).data.publicUrl : "";
  const linksRes = await sb.from("page_links")
    .select("id,title,url,icon,enabled,position")
    .eq("page_id", data.id).eq("enabled", true)
    .order("position", { ascending: true });
  const pageLinks = linksRes.data || [];
  const s = { ...data.data, photo: photoUrl, slug: data.slug, _origin: window.location.origin, _links: pageLinks };
  const env = detectEnv();

  // 18+ overlay (all visitors when enabled)
  if (s.tiktok_overlay) {
    renderTikTokOverlay(app, s, env);
    document.title = s.title || data.slug;
    return;
  }

  renderLanding(app, s);
  document.title = s.title || data.slug;
}

function renderLanding(container, s) {
  container.className = "landing-bg";
  document.documentElement.style.setProperty("--rose", s.c_rose || "#2D7FF9");
  document.documentElement.style.setProperty("--rose-deep", s.c_deep || "#1A6BE0");
  document.documentElement.style.setProperty("--ink", s.c_ink || "#1D1D1E");
  document.documentElement.style.setProperty("--ink-soft", s.c_inksoft || "#808084");
  // Apply background preset
  const bg = (typeof BACKGROUNDS !== "undefined" ? BACKGROUNDS : []).find(b => b.id === (s.bg_style||"rose"));
  if (bg) container.style.background = bg.bg;
  container.style.backgroundAttachment = "fixed";
  container.style.minHeight = "100vh";
  const photoSrc = s.photo || placeholderPhoto();
  container.innerHTML = `
    <div class="deco" aria-hidden="true">
      <svg class="h1" viewBox="0 0 24 24"><path fill="${s.c_rose||'#2D7FF9'}" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="h2" viewBox="0 0 24 24"><path fill="#ffb3cd" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="h3" viewBox="0 0 24 24"><path fill="#6aadff" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="h4" viewBox="0 0 24 24"><path fill="${s.c_deep||'#1A6BE0'}" d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      <svg class="s1" viewBox="0 0 24 24"><path fill="${s.c_rose||'#2D7FF9'}" d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
      <svg class="s2" viewBox="0 0 24 24"><path fill="#6aadff" d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
    </div>
    <main class="page">
      <div class="topbar"><span class="handle">${esc(s.handle||"@"+s.slug)}</span></div>
      <section class="hero">
        <div><div class="avatar-ring"><div class="avatar-inner"><img src="${esc(photoSrc)}" alt="${esc(s.name||"")}"></div></div></div>
        <div class="name-row">
          <h1 class="name">${esc(s.name||"")}</h1>
          ${s.verified ? `<span class="verify" title="Vérifiée"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 8"/></svg></span>` : ``}
        </div>
        ${(s.chip_online||s.chip_location) ? `<div class="chips">
          ${s.chip_online ? `<span class="chip"><span class="dot"></span>${esc(s.online_text||"En ligne")}</span>` : ``}
          ${(s.chip_online&&s.chip_location) ? `<span class="sep">·</span>` : ``}
          ${s.chip_location ? `<span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="loc-text">${esc(s.location_text||"")}</span></span>` : ``}
        </div>` : ``}
        ${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ``}
      </section>
      ${renderCard(s)}
      ${renderLinksList(s)}
      <p class="foot"><span class="kiss">${esc(s.kiss||"")}</span>${esc(s.copy||"")}</p>
    </main>`;

  const env = detectEnv();
  const link = container.querySelector("[data-smartlink]");
  if (link && env.isInApp) {
    const url = link.dataset.smartlink;
    link.addEventListener("click", (e) => { if (!url) return; e.preventDefault(); smartOpen(url, env); });
  }
  maybeAutoShowEscape();
  hydrateNearbyCity(container);
}

// ---- Multi-link buttons rendered below the main card
function renderLinksList(s) {
  const links = s._links || [];
  if (!links.length) return "";
  const origin = s._origin || "https://sophiemercier.fr";
  return `<div class="link-list">${links.map(l => `
    <a class="link-btn" href="/l/${esc(l.id)}" target="_blank" rel="noopener nofollow" data-smartlink="${esc(origin+"/l/"+l.id)}">
      <span class="link-btn-icon">${l.icon ? esc(l.icon) : iconFor(l.url)}</span>
      <span class="link-btn-title">${esc(l.title)}</span>
      <svg class="link-btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  `).join("")}</div>`;
}
function iconFor(url) {
  const u = String(url||"").toLowerCase();
  if (/t\.me|telegram/.test(u)) return "✈️";
  if (/instagram/.test(u)) return "📸";
  if (/tiktok/.test(u)) return "🎵";
  if (/snapchat/.test(u)) return "👻";
  if (/x\.com|twitter/.test(u)) return "𝕏";
  if (/onlyfans/.test(u)) return "🔒";
  if (/youtube|youtu\.be/.test(u)) return "▶️";
  if (/wa\.me|whatsapp/.test(u)) return "💬";
  if (/discord/.test(u)) return "🎮";
  if (/spotify/.test(u)) return "🎧";
  if (/mailto:/.test(u)) return "✉️";
  return "🔗";
}

// ---- Card variants — choose by s.card_style
function renderCard(s) {
  const style = s.card_style || "soft";
  const href = `/go/${esc(s.slug)}`;
  const data = esc((s._origin||"https://sophiemercier.fr")+"/go/"+s.slug);
  const renderers = {
    soft: cardSoft, polaroid: cardPolaroid, minimal: cardMinimal, sticker: cardSticker, locked: cardLocked,
    magnetic: cardMagnetic, heartbeat: cardHeartbeat, marquee: cardMarquee, liquid: cardLiquid, wordswap: cardWordswap,
    imessage: cardImessage, cassette: cardCassette, slide: cardSlide, kiss: cardKiss, letter: cardLetter
  };
  const fn = renderers[style] || cardSoft;
  return fn(s, href, data);
}

function cardMagnetic(s, href, dataSmart) {
  return `<a class="pcard-magnetic" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <span class="pmg-tag">${esc(s.tag||"Mon lien")} ✿</span>
    <h2>${esc(s.card_title||"")}</h2>
    <p>${esc(s.card_desc||"")}</p>
    <span class="pmg-cta">
      <span class="pmg-cta-glow"></span>
      ${esc(s.cta||"Ouvrir")}
      <svg class="pmg-cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </span>
  </a>`;
}

function cardHeartbeat(s, href, dataSmart) {
  const title = (s.card_title || "Viens, je suis là pour toi ✿").replace(/\b(là|ici|là-bas)\b/i, m => `<em>${m}</em>`);
  return `<a class="pcard-heartbeat" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <span class="phb-kicker"><span class="phb-dot"></span>${esc(s.online_text||"En ligne maintenant")}</span>
    <h2>${title}</h2>
    <p>${esc(s.card_desc||"")}</p>
    <span class="phb-cta">
      <svg class="phb-heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>
      ${esc(s.cta||"Me rejoindre")}
    </span>
  </a>`;
}

function cardMarquee(s, href, dataSmart) {
  const trackText = s.cta || "Ouvrir le lien";
  const sec = s.tag || "Just for you";
  return `<a class="pcard-marquee" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <div class="pmq-top">
      <span class="pmq-badge"><span class="pmq-badge-dot"></span>${esc(s.tag||"New")}</span>
      <svg class="pmq-flower" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
    </div>
    <h2>${esc(s.card_title||"Click here baby ✿")}</h2>
    <p>${esc(s.card_desc||"")}</p>
    <span class="pmq-cta">
      <span class="pmq-cta-track">
        <span>${esc(trackText)} <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg></span>
        <span>${esc(sec)} <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg></span>
        <span>${esc(trackText)} <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg></span>
        <span>${esc(sec)} <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg></span>
      </span>
    </span>
  </a>`;
}

function cardLiquid(s, href, dataSmart) {
  return `<a class="pcard-liquid" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <div class="plq-row">
      <div class="plq-ava">${s.photo ? `<img src="${esc(s.photo)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">` : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.35-9.5-9C.7 8.3 3.2 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3.8 0 6.3 4.3 4.5 8-2.5 4.65-9.5 9-9.5 9z"/></svg>`}</div>
      <div>
        <p class="plq-name">${esc(s.name||"Sophie")}</p>
        <div class="plq-sub">${esc(s.tag||"accès privé")}</div>
      </div>
    </div>
    <h2>${esc(s.card_title||"Mon petit secret, juste pour toi.")}</h2>
    <p>${esc(s.card_desc||"")}</p>
    <span class="plq-cta">
      ${esc(s.cta||"Découvrir")}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </span>
  </a>`;
}

function cardWordswap(s, href, dataSmart) {
  const title = (s.card_title || "L'envers du décor, juste pour toi.").replace(/\b(décor|secret|monde)\b/i, m => `<em>${m}</em>`);
  const words = (s.wordswap_words || "rejoindre,découvrir,parler,trouver").split(",").map(w=>w.trim()).filter(Boolean);
  const verb = s.cta_prefix || "Me";
  return `<a class="pcard-wordswap" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <span class="pws-tag">${esc(s.tag||"Mon lien")}</span>
    <h2>${title}</h2>
    <p>${esc(s.card_desc||"")}</p>
    <span class="pws-cta">
      <span>${esc(verb)}</span>
      <span class="pws-words">
        <span class="pws-stack">
          ${words.map(w => `<span class="pink">${esc(w)}</span>`).join("")}
          <span class="pink">${esc(words[0]||"rejoindre")}</span>
        </span>
      </span>
      <span class="pws-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
    </span>
  </a>`;
}

function cardImessage(s, href, dataSmart) {
  const initial = (s.name||"S").trim().charAt(0).toUpperCase();
  const t = new Date(); const time = `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
  return `<a class="pcard-imessage" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <div class="pim-head">
      <div class="pim-ava">${s.photo ? `<img src="${esc(s.photo)}" alt="">` : esc(initial)}</div>
      <div class="pim-who">
        <div class="pim-name">${esc(s.name||"Sophie")}</div>
        <div class="pim-stat">est en train d'écrire…</div>
      </div>
      <div class="pim-time">${esc(time)}</div>
    </div>
    <div class="pim-bubbles">
      <div class="pim-bub">${esc(s.imessage_msg1||"Coucou toi ✿")}</div>
      <div class="pim-bub pim-typing"><span></span><span></span><span></span></div>
      <span class="pim-bub pim-link">
        <div class="pim-prev">
          <div class="pim-prev-url">sophiemercier.fr</div>
          <div class="pim-prev-ttl">${esc(s.card_title||"Tiens, regarde par ici ♡")}</div>
        </div>
        <div class="pim-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
      </span>
    </div>
  </a>`;
}

function cardCassette(s, href, dataSmart) {
  return `<a class="pcard-cassette" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <div class="pcs-label">
      <div class="pcs-side">SIDE A · 90 MIN</div>
      <div class="pcs-title">${esc(s.card_title||"For you ♡")}</div>
      <div class="pcs-by">— recorded by ${esc(s.name||"Sophie")}</div>
    </div>
    <div class="pcs-deck">
      <div class="pcs-reel"></div>
      <div class="pcs-strip"></div>
      <div class="pcs-reel"></div>
    </div>
    <div class="pcs-cta">
      <span class="pcs-play"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></span>
      ${esc(s.cta||"Lance la lecture")}
    </div>
  </a>`;
}

function cardSlide(s, href, dataSmart) {
  const t = new Date();
  const time = `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
  const date = t.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  return `<a class="pcard-slide" href="${href}" target="_blank" rel="noopener nofollow" data-smartlink="${dataSmart}">
    <p class="psl-time">${esc(time)}</p>

// ============================================================ IN-APP DETECTION & SMART OPEN
function detectEnv() {
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  const isInstagram = /Instagram/.test(ua);
  const isFacebook = /FBAN|FBAV/.test(ua);
  const isTikTok = /BytedanceWebview|TikTok|musical_ly/i.test(ua);
  const isSnapchat = /Snapchat/.test(ua);
  const isMessenger = /Messenger/.test(ua);
  const isLine = /Line\//.test(ua);
  const isInApp = isInstagram || isFacebook || isTikTok || isSnapchat || isMessenger || isLine;
  return { isIOS, isAndroid, isInApp, isInstagram, isFacebook, isTikTok, isSnapchat };
}

function smartOpen(url, env) {
  if (!url) return;
  if (env.isAndroid && env.isInApp) {
    const stripped = url.replace(/^https?:\/\//, "");
    window.location.href = `intent://${stripped}#Intent;scheme=https;package=com.android.chrome;end`;
    return;
  }
  if (env.isIOS && env.isInApp) {
    const safariUrl = url.replace(/^https?:\/\//, "x-safari-https://");
    window.location.href = safariUrl;
    setTimeout(() => showOpenInBrowserBanner(env), 400);
    return;
  }
  window.location.href = url;
}

function showOpenInBrowserBanner(env) {
  if (document.getElementById("escape-banner")) return;
  if (sessionStorage.getItem("escapeDismissed")) return;
  const browser = env.isIOS ? "Safari" : "Chrome";
  const banner = document.createElement("div");
  banner.id = "escape-banner";
  banner.innerHTML = `
    <div class="escape-card">
      <button class="escape-x">×</button>
      <div class="escape-title">Ouvre dans ${browser} :</div>
      <div class="escape-steps">
        <div class="escape-step"><span class="num">1</span><span>Appuie sur <strong>…</strong> en haut à droite.</span></div>
        <div class="escape-step"><span class="num">2</span><span>Choisis <strong>Ouvrir dans le navigateur</strong>.</span></div>
      </div>
    </div>`;
  document.body.appendChild(banner);
  banner.querySelector(".escape-x").addEventListener("click", () => { banner.remove(); sessionStorage.setItem("escapeDismissed","1"); });
}

function maybeAutoShowEscape() {
  const env = detectEnv();
  if (!env.isInApp) return;
  if (env.isTikTok) return; // TikTok handled by overlay
  setTimeout(() => showOpenInBrowserBanner(env), 3000);
}

async function hydrateNearbyCity(container) {
  const el = container.querySelector(".loc-text");
  if (!el) return;
  try {
    const r = await fetch("/api/geo", { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.nearby) el.textContent = "Proche de " + d.nearby;
  } catch(e) {}
}

async function onDomainAction(action, id) {
  const d = domains.find(x => x.id === id); if (!d) return;
  if (action === "primary") {
    await sb.from("domains").update({ is_primary: false }).eq("is_primary", true);
    await sb.from("domains").update({ is_primary: true }).eq("id", id);
    await loadDomains();
    renderSection();
    if (currentSection === "pages") renderPagesGrid();
    return;
  }
  if (action === "remove") {
    if (!confirm(`Retirer ${d.domain} ?`)) return;
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch("/api/domains/remove", {
      method: "POST",
      headers: { "content-type": "application/json", Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ id })
    });
    const j = await r.json();
    if (!r.ok) return toast(j.error || "Erreur");
    toast("Domaine retiré");
    await loadDomains();
    renderSection();
  }
}

let chartPeriod = "30d"; // default

const PERIOD_OPTIONS = [
  { id: "today", label: "Aujourd'hui" },
  { id: "yesterday", label: "Hier" },
  { id: "7d", label: "7 jours" },
  { id: "30d", label: "30 jours" },
  { id: "3m", label: "3 mois" }
];

function getPeriodRange(period) {
  // Returns { since: Date, until: Date, buckets: [...], granularity: 'hour'|'day', label }
  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  if (period === "today") {
    const buckets = [];
    for (let h=0; h<24; h++) {
      const d = new Date(startOfToday); d.setHours(h);
      buckets.push({ date: d, key: `${d.toISOString().slice(0,13)}`, count: 0, label: String(h).padStart(2,"0")+"h" });
    }
    return { since: startOfToday, until: now, buckets, granularity: "hour", label: "Aujourd'hui" };
  }
  if (period === "yesterday") {
    const startY = new Date(startOfToday); startY.setDate(startY.getDate()-1);
    const endY = new Date(startOfToday);
    const buckets = [];
    for (let h=0; h<24; h++) {
      const d = new Date(startY); d.setHours(h);
      buckets.push({ date: d, key: d.toISOString().slice(0,13), count: 0, label: String(h).padStart(2,"0")+"h" });
    }
    return { since: startY, until: endY, buckets, granularity: "hour", label: "Hier" };
  }
  let nDays;
  if (period === "7d") nDays = 7;
  else if (period === "3m") nDays = 90;
  else nDays = 30;
  const buckets = [];
  const fmtDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  for (let i=nDays-1; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    buckets.push({ date: d, key: fmtDay(d), count: 0, label: `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}` });
  }
  const since = buckets[0].date;
  return { since, until: now, buckets, granularity: "day", label: `${nDays} derniers jours` };
}

function bucketKeyFor(date, granularity) {
  if (granularity === "hour") return date.toISOString().slice(0,13);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

async function renderClicksChart(period) {
  if (period) chartPeriod = period;
  const wrap = document.getElementById("clicks_chart"); if (!wrap) return;
  wrap.innerHTML = `<div class="chart-card chart-loading">Chargement des stats…</div>`;

  const range = getPeriodRange(chartPeriod);
  const { data, error } = await sb.from("link_clicks")
    .select("clicked_at,user_agent_kind,slug")
    .gte("clicked_at", range.since.toISOString())
    .lte("clicked_at", range.until.toISOString())
    .order("clicked_at", { ascending: true });
  if (error) { wrap.innerHTML = `<div class="chart-card">Erreur stats: ${esc(error.message)}</div>`; return; }
  const events = data || [];

  const byKey = Object.fromEntries(range.buckets.map(b => [b.key, b]));
  events.forEach(ev => { const k = bucketKeyFor(new Date(ev.clicked_at), range.granularity); if (byKey[k]) byKey[k].count++; });

  const byKind = { tiktok: 0, instagram: 0, snapchat: 0, facebook: 0, browser: 0, other: 0 };
  events.forEach(ev => { const k = ev.user_agent_kind; if (byKind[k] !== undefined) byKind[k]++; else byKind.other++; });
  const totalRange = events.length;
  const bySlug = {};
  events.forEach(ev => { bySlug[ev.slug] = (bySlug[ev.slug]||0) + 1; });
  const topPages = Object.entries(bySlug).sort((a,b) => b[1]-a[1]).slice(0,5);

  const periodTabs = PERIOD_OPTIONS.map(o => `
    <button class="period-tab ${o.id===chartPeriod?"active":""}" data-period="${esc(o.id)}">${esc(o.label)}</button>
  `).join("");

  wrap.innerHTML = `
    <div class="chart-card chart-dark">
      <div class="chart-head">
        <div class="chart-headline">
          <div class="chart-total">${formatNum(totalRange)}</div>
          <div class="chart-sublabel">clic${totalRange!==1?"s":""} · ${esc(range.label)}</div>
        </div>
        <div class="period-tabs">${periodTabs}</div>
      </div>
      <div class="chart-platforms">
        ${[["tiktok","TikTok","#000"],["instagram","Insta","#e1306c"],["snapchat","Snap","#f7d100"],["facebook","FB","#1877f2"],["browser","Direct","#808084"]]
          .map(([k,lbl,c]) => `<span class="cplat" style="--c:${c}"><span class="cdot"></span>${esc(lbl)} <strong>${formatNum(byKind[k]||0)}</strong></span>`).join("")}
      </div>
      <div class="chart-area">${renderSparkline(range.buckets, range.granularity)}</div>
      ${topPages.length ? `<div class="chart-top">
        <h4>Pages les plus cliquées</h4>
        ${topPages.map(([slug,n]) => {
          const max = topPages[0][1] || 1;
          const w = Math.round((n/max)*100);
          return `<div class="chart-row">
            <span class="chart-slug">/${esc(slug)}</span>
            <span class="chart-bar"><span style="width:${w}%"></span></span>
            <span class="chart-n">${formatNum(n)}</span>
          </div>`;
        }).join("")}
      </div>`:""}
    </div>
  `;

function renderSparkline(buckets, granularity) {
  const W = 800, H = 150, P = 8, BL = 26;
  const max = Math.max(1, ...buckets.map(b => b.count));
  const n = buckets.length;
  const gap = n > 60 ? 1.5 : n > 30 ? 3 : 5;
  const bw = Math.max(2, (W - P*2 - gap*(n-1)) / n);
  const plotH = H - BL - 10;
  const baseY = H - BL;
  let bars = "";
  buckets.forEach((b,i) => {
    const bh = b.count>0 ? Math.max(3, (b.count/max)*plotH) : 2;
    const x = P + i*(bw+gap);
    const y = baseY - bh;
    const r = Math.min(3, bw/2);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${r.toFixed(1)}" fill="url(#barGrad)" opacity="${b.count>0?1:0.45}"><title>${b.label}: ${b.count} clic${b.count!==1?"s":""}</title></rect>`;
  });
  let stride;
  if (granularity === "hour") stride = 4;
  else if (n <= 10) stride = 1;
  else if (n <= 35) stride = 6;
  else stride = Math.ceil(n/8);
  let labels = "";
  for (let i=0; i<n; i+=stride) {
    const x = P + i*(bw+gap) + bw/2;
    labels += `<text x="${x.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10" font-family="'Space Mono',monospace" fill="rgba(255,255,255,.4)">${esc(buckets[i].label)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px">
    <defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6FB7FF"/><stop offset="100%" stop-color="#3B9DF7"/></linearGradient></defs>
    <line x1="${P}" y1="${baseY.toFixed(1)}" x2="${W-P}" y2="${baseY.toFixed(1)}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
    ${bars}
    ${labels}
  </svg>`;
}

      folder.classList.toggle("closed");

        showDomainCopyMenu(btn, btn.dataset.slug);
      } else {
        await copyToClipboard(btn.dataset.copy, btn);
      }
    });
  });

async function copyToClipboard(url, btn) {
  try {
    await navigator.clipboard.writeText(url);
    if (btn) {
      btn.classList.add("copied");
      const orig = btn.innerHTML;
      btn.innerHTML = icon("check", 14);
      toast("Lien copié");
      setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = orig; }, 1500);
    } else {
      toast("Lien copié");
    }
  } catch(_) { toast("Impossible de copier"); }
}

function showDomainCopyMenu(anchor, slug) {
  document.querySelectorAll(".domain-menu").forEach(m => m.remove());
  const rect = anchor.getBoundingClientRect();
  const menu = document.createElement("div");
  menu.className = "domain-menu";
  menu.style.top = (rect.bottom + window.scrollY + 4) + "px";
  menu.style.left = Math.max(8, rect.right + window.scrollX - 260) + "px";
  menu.innerHTML = `
    <div class="domain-menu-head">Copier le lien depuis…</div>
    ${domains.map(d => `
      <button class="domain-menu-item" data-domain="${esc(d.domain)}">
        ${icon("link", 14)}
        <span>${esc(d.domain)}/${esc(slug)}</span>
        ${d.is_primary?`<span class="domain-menu-tag">Principal</span>`:``}
      </button>
    `).join("")}
  `;
  document.body.appendChild(menu);
  menu.querySelectorAll(".domain-menu-item").forEach(b => {
    b.addEventListener("click", async () => {
      await copyToClipboard(`https://${b.dataset.domain}/${slug}`);
      menu.remove();
    });
  });
  setTimeout(() => {
    document.addEventListener("click", function close(e) {
      if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener("click", close); }
    });
  }, 50);
}

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"") + "k";
  return String(n);
}

      <label>Nom</label>

async function onDeleteFolder(fid) {
  const f = folders.find(x => x.id === fid); if (!f) return;
  const fPages = pages.filter(p => p.folder_id === fid);
  if (!confirm(`Supprimer le dossier "${f.name}" ?\nLes ${fPages.length} page(s) à l'intérieur ne seront pas supprimées, elles reviendront dans "Sans dossier".`)) return;
  const { error } = await sb.from("folders").delete().eq("id", fid);
  if (error) return toast(error.message);
  folders = folders.filter(x => x.id !== fid);
  pages.forEach(p => { if (p.folder_id === fid) p.folder_id = null; });
  renderPagesGrid();
}

function openNewPageModal(folderId) {
  showModal({
    title: "Nouvelle page",
    body: `

      <input type="text" id="m_name" placeholder="Julie" autofocus>
      <label>Slug (URL)</label>

    `,
    submitLabel: "Créer",
    onSubmit: async () => {

      let slug = document.getElementById("m_slug").value.trim();
      if (!slug) slug = slugify(name);
      else slug = slugify(slug);
      if (!name) return false;
      let s = slug, i = 2;
      while (pages.some(p => p.slug === s)) { s = slug+"-"+i; i++; }
      const data = { ...DEFAULT_PAGE_DATA, name, title: name, handle: "@"+s };
      const { data: row, error } = await sb.from("landing_pages").insert({
        owner_id: currentUser.id, slug: s, data, folder_id: folderId || null, position: pages.length
      }).select().single();
      if (error) { toast(error.message); return false; }
      pages.push(row); renderPagesGrid();
      openPageDrawer(row.id);
      toast("Page créée"); return true;
    }
  });

  const wrap = document.createElement("div");

      <h3>${esc(title)}</h3>
      <div class="modal-body">${body}</div>

        <button class="btn" data-cancel>Annuler</button>
        <button class="btn btn-primary" data-submit>${esc(submitLabel)}</button>
      </div>

  document.body.appendChild(wrap);

  wrap.querySelector("[data-cancel]").addEventListener("click", close);

  setTimeout(() => { const inp = wrap.querySelector("input[autofocus]"); if (inp) inp.focus(); }, 50);
}

        <div id="links_list" class="links-edit-list"></div>
        <button class="btn btn-primary" id="btn_add_link" style="margin-top:12px">
          ${icon("plus", 16)}
          Ajouter un lien
        </button>
      </fieldset>
    `;
    renderLinksEditList();
    document.getElementById("btn_add_link").addEventListener("click", () => openLinkModal(null));
  } else if (tab === "design") {
    const themeChips = THEMES.map(t => `
      <button class="theme-chip" data-theme="${esc(t.id)}" type="button" title="${esc(t.name)}">
        <span class="theme-grad" style="background:linear-gradient(135deg,${t.rose} 0%,${t.deep} 100%)"></span>
        <span class="theme-name">${esc(t.name)}</span>
      </button>`).join("");
    const styleChips = CARD_STYLES.map(c => `
      <button class="cstyle-chip ${(d.card_style||"soft")===c.id?"active":""}" data-style="${esc(c.id)}" type="button" title="${esc(c.name)}">
        <span class="cstyle-mini cstyle-mini-${esc(c.id)}"></span>
        <span class="cstyle-name">${esc(c.name)}</span>
      </button>`).join("");
    const bgChips = BACKGROUNDS.map(b => `
      <button class="bg-chip ${(d.bg_style||"rose")===b.id?"active":""}" data-bg="${esc(b.id)}" type="button" title="${esc(b.name)}">
        <span class="bg-preview" style="background:${b.bg}"></span>
        <span class="bg-name">${esc(b.name)}</span>
      </button>`).join("");
    area.innerHTML = `
      <fieldset>
        <legend>Style de carte</legend>
        <p class="hint">Choisis l'apparence de ta carte de lien principale.</p>
        <div class="cstyle-grid">${styleChips}</div>
      </fieldset>
      <fieldset>
        <legend>Fond de la landing</legend>
        <p class="hint">Choisis un dégradé pour le fond de la page.</p>
        <div class="bg-grid">${bgChips}</div>
      </fieldset>
      <fieldset>
        <legend>Thèmes de couleur</legend>
        <p class="hint">Applique un thème prédéfini ou personnalise tes couleurs en dessous.</p>
        <div class="theme-grid">${themeChips}</div>
      </fieldset>
      <fieldset>
        <legend>Couleurs personnalisées</legend>
        <label>Couleur principale</label><div class="color-row"><input type="color" data-pick="c_rose" value="${esc(d.c_rose||"#2D7FF9")}"><input type="text" data-field="c_rose" value="${esc(d.c_rose||"#2D7FF9")}"></div>
        <label>Couleur foncée</label><div class="color-row"><input type="color" data-pick="c_deep" value="${esc(d.c_deep||"#1A6BE0")}"><input type="text" data-field="c_deep" value="${esc(d.c_deep||"#1A6BE0")}"></div>
        <label>Texte</label><div class="color-row"><input type="color" data-pick="c_ink" value="${esc(d.c_ink||"#1D1D1E")}"><input type="text" data-field="c_ink" value="${esc(d.c_ink||"#1D1D1E")}"></div>
        <label>Texte secondaire</label><div class="color-row"><input type="color" data-pick="c_inksoft" value="${esc(d.c_inksoft||"#808084")}"><input type="text" data-field="c_inksoft" value="${esc(d.c_inksoft||"#808084")}"></div>
      </fieldset>
      <fieldset>
        <legend>SEO</legend>
        <label>Titre de l'onglet</label><input type="text" data-field="title" value="${esc(d.title||"")}">
      </fieldset>
    `;
  } else if (tab === "platform") {
    area.innerHTML = `
      <fieldset>
        <legend>Source de trafic principale</legend>
        <p class="hint">Configure le comportement spécial pour le réseau d'où viennent tes visiteurs.</p>
        <div class="seg">
          <label><input type="radio" name="platform" value="auto" data-field="platform" ${(d.platform||"auto")==="auto"?"checked":""}><span class="opt">Auto</span></label>
          <label><input type="radio" name="platform" value="tiktok" data-field="platform" ${d.platform==="tiktok"?"checked":""}><span class="opt">TikTok</span></label>
          <label><input type="radio" name="platform" value="instagram" data-field="platform" ${d.platform==="instagram"?"checked":""}><span class="opt">Instagram</span></label>
          <label><input type="radio" name="platform" value="snapchat" data-field="platform" ${d.platform==="snapchat"?"checked":""}><span class="opt">Snapchat</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Écran 18+ TikTok</legend>
        <div class="toggle-row">
          <input type="checkbox" data-field="tiktok_overlay" ${d.tiktok_overlay?"checked":""} id="cb_tt">
          <label for="cb_tt">Activer l'écran 18+ uniquement pour les visiteurs TikTok</label>
        </div>
        <p class="hint">Quand activé : si un visiteur arrive depuis TikTok, il verra un écran 18+ (style GetAllMyLinks) qui le force à appuyer longtemps pour ouvrir le lien dans son vrai navigateur. Pour les autres plateformes, la landing normale s'affiche.</p>
        <label>Titre de l'écran</label><input type="text" data-field="tiktok_title" value="${esc(d.tiktok_title||"Continuer vers mon contenu")}">
        <label>Sous-titre</label><textarea data-field="tiktok_subtitle">${esc(d.tiktok_subtitle||"Pour accéder au lien, ouvre la page dans ton navigateur.")}</textarea>
        <label>Texte du bouton</label><input type="text" data-field="tiktok_button" value="${esc(d.tiktok_button||"APPUI LONG POUR OUVRIR")}">
      </fieldset>
    `;
  } else if (tab === "settings") {
    const folderOpts = `<option value="">Sans dossier</option>` + folders.map(f => `<option value="${esc(f.id)}" ${p.folder_id===f.id?"selected":""}>${esc((f.emoji||"📁")+" "+f.name)}</option>`).join("");
    area.innerHTML = `
      <fieldset>
        <legend>Organisation</legend>
        <label>Dossier</label>
        <select data-folder>${folderOpts}</select>
      </fieldset>
      <fieldset>
        <legend>Aperçu public</legend>
        <p class="hint">URL publique : <a href="/${esc(p.slug)}" target="_blank" style="color:var(--rose-deep);">sophiemercier.fr/${esc(p.slug)}</a></p>
        <p class="hint">Lien de redirection masqué : <code>/go/${esc(p.slug)}</code></p>
      </fieldset>
    `;
  }

  bindInputs(area);
}

function bindInputs(area) {
  area.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.field;
      const val = el.type === "checkbox" ? el.checked : el.value;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), [key]: val };
      const pick = area.querySelector(`[data-pick="${key}"]`);
      if (pick && el.type === "text" && /^#[0-9a-f]{6}$/i.test(val)) pick.value = val;
      scheduleSave(); updatePreview();
    });
  });
  area.querySelectorAll("[data-pick]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.pick;
      const val = el.value;
      const p = currentPage(); p.data = { ...(p.data||{}), [key]: val };
      const txt = area.querySelector(`[data-field="${key}"]`); if (txt) txt.value = val;
      scheduleSave(); updatePreview();
    });
  });
  const slugInp = area.querySelector("[data-slug]");
  if (slugInp) slugInp.addEventListener("change", async e => {
    const newSlug = slugify(e.target.value);
    const p = currentPage();
    if (!newSlug) { e.target.value = p.slug; return; }
    if (pages.some(x => x.id !== p.id && x.slug === newSlug)) {
      toast("Slug déjà pris"); e.target.value = p.slug; return;
    }
    if (newSlug === p.slug) return;
    p.slug = newSlug; e.target.value = newSlug;
    document.getElementById("hint_slug").textContent = newSlug;
    clearTimeout(saveTimer);
    await saveNow();        // immediate save — no debounce — so slug always persists
    renderPagesGrid();
  });
  const folderSel = area.querySelector("[data-folder]");
  if (folderSel) folderSel.addEventListener("change", () => {
    const p = currentPage(); p.folder_id = folderSel.value || null;
    scheduleSave(); renderPagesGrid();
  });
  const photoBtn = document.getElementById("photo_btn");
  if (photoBtn) {
    photoBtn.addEventListener("click", () => document.getElementById("photo_input").click());
    document.getElementById("photo_input").addEventListener("change", onPhotoUpload);
  }
  // Card style picker
  area.querySelectorAll(".cstyle-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.style;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), card_style: id };
      area.querySelectorAll(".cstyle-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Background presets
  area.querySelectorAll(".bg-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.bg;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), bg_style: id };
      area.querySelectorAll(".bg-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Theme presets
  area.querySelectorAll(".theme-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = THEMES.find(x => x.id === chip.dataset.theme); if (!t) return;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), c_rose: t.rose, c_deep: t.deep, c_ink: t.ink, c_inksoft: t.inksoft };
      // Reflect in the color inputs without rerendering the whole tab
      const set = (k, v) => {
        const txt = area.querySelector(`[data-field="${k}"]`);
        const pick = area.querySelector(`[data-pick="${k}"]`);
        if (txt) txt.value = v;
        if (pick) pick.value = v;
      };
      set("c_rose", t.rose); set("c_deep", t.deep); set("c_ink", t.ink); set("c_inksoft", t.inksoft);
      area.querySelectorAll(".theme-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
    // Mark active if matches current colors
    const t = THEMES.find(x => x.id === chip.dataset.theme);
    const p = currentPage(); const d = p?.data || {};
    if (t && d.c_rose === t.rose && d.c_deep === t.deep && d.c_ink === t.ink && d.c_inksoft === t.inksoft) {
      chip.classList.add("active");
    }
  });
}

async function onPhotoUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) { toast("Image > 5 Mo"); return; }
  setSaveStatus("Upload…", "saving");
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${currentPage().slug}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("landing_photos").upload(path, file, { upsert: true, contentType: file.type });
  if (error) { toast(error.message); return; }
  const old = currentPage().photo_path;
  if (old && old !== path) { try { await sb.storage.from("landing_photos").remove([old]); } catch(_) {} }
  currentPage().photo_path = path;
  document.getElementById("photo_preview").src = sb.storage.from("landing_photos").getPublicUrl(path).data.publicUrl;
  await saveNow(); updatePreview(); renderPagesGrid();
}

function scheduleSave() { setSaveStatus("Modification en attente…","saving"); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }
function normalizeUrl(u) {
  if (!u) return u;
  u = String(u).trim();
  if (!u) return u;
  if (/^[a-z]+:\/\//i.test(u)) return u; // already has protocol
  return "https://" + u.replace(/^\/+/, "");
}

async function saveNow() {
  const p = currentPage(); if (!p) return;
  setSaveStatus("Sauvegarde…","saving");
  // Auto-normalize the URL: prepend https:// if missing
  if (p.data?.url) {
    const normalized = normalizeUrl(p.data.url);
    if (normalized !== p.data.url) {
      p.data.url = normalized;
      const inp = document.querySelector("[data-field=\"url\"]");
      if (inp) inp.value = normalized;
    }
  }
  const { error } = await sb.from("landing_pages").update({
    slug: p.slug, data: p.data, photo_path: p.photo_path, folder_id: p.folder_id
  }).eq("id", p.id);
  if (error) { setSaveStatus("Erreur: "+error.message); return; }
  setSaveStatus("Sauvegardé ✓","saved");
}
function setSaveStatus(text, cls) {
  const el = document.getElementById("save_status");
  if (!el) return;
  el.textContent = text;
  el.className = "status"+(cls?" "+cls:"");
}

function updatePreview() {
  const p = currentPage(); if (!p) return;
  const iframe = document.getElementById("preview");
  if (!iframe) return;
  const photoUrl = p.photo_path ? sb.storage.from("landing_photos").getPublicUrl(p.photo_path).data.publicUrl : "";
  const enabledLinks = (p._links||[]).filter(l => l.enabled);
  const s = { ...(p.data||{}), photo: photoUrl, slug: p.slug, _origin: window.location.origin, _links: enabledLinks };
  const wrap = document.createElement("div");
  renderLanding(wrap, s);
  const styleEl = document.querySelector("style");
  iframe.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${styleEl.textContent}</style></head><body><div style="--rose:${s.c_rose||'#2D7FF9'};--rose-deep:${s.c_deep||'#1A6BE0'};--ink:${s.c_ink||'#1D1D1E'};--ink-soft:${s.c_inksoft||'#808084'};">${wrap.outerHTML}</div></body></html>`;
}

// ---- Multi-link CRUD inside the page drawer
function renderLinksEditList() {
  const list = document.getElementById("links_list"); if (!list) return;
  const p = currentPage(); if (!p) return;
  const links = p._links || [];
  if (!links.length) {
    list.innerHTML = `<div class="link-edit-empty">Aucun lien additionnel. Clique <strong>+ Ajouter un lien</strong> pour en créer un.</div>`;
    return;
  }
  list.innerHTML = links.map((l, idx) => `
    <div class="link-edit-row" data-id="${esc(l.id)}">
      <div class="link-edit-handle" title="Glisser pour réordonner">⋮⋮</div>
      <div class="link-edit-icon">${esc(l.icon || iconFor(l.url))}</div>
      <div class="link-edit-meta">
        <div class="link-edit-title">${esc(l.title)} ${l.enabled?"":`<span class="link-edit-off">désactivé</span>`}</div>
        <div class="link-edit-sub">${l.username ? `<span class="link-edit-user">@${esc(l.username.replace(/^@/,""))}</span> · `: ""}${esc(l.url)}</div>
      </div>
      <div class="link-edit-stats">${formatNum(l.click_count||0)} clic${(l.click_count||0)!==1?"s":""}</div>
      <button class="link-edit-btn" data-act="up" ${idx===0?"disabled":""} title="Monter">${icon("arrow-up", 14)}</button>
      <button class="link-edit-btn" data-act="down" ${idx===links.length-1?"disabled":""} title="Descendre">${icon("arrow-down", 14)}</button>
      <button class="link-edit-btn" data-act="edit" title="Modifier">${icon("edit", 14)}</button>
      <button class="link-edit-btn" data-act="toggle" title="${l.enabled?"Désactiver":"Activer"}">${icon(l.enabled?"eye-off":"eye", 14)}</button>
      <button class="link-edit-btn danger" data-act="delete" title="Supprimer">${icon("trash", 14)}</button>
    </div>
  `).join("");
  list.querySelectorAll(".link-edit-row").forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", e => { e.stopPropagation(); onLinkAction(btn.dataset.act, id); });
    });
  });
}

async function onLinkAction(action, id) {
  const p = currentPage(); if (!p) return;
  const links = p._links || [];
  const idx = links.findIndex(l => l.id === id);
  if (idx < 0) return;
  const link = links[idx];

  if (action === "edit") return openLinkModal(link);
  if (action === "delete") {
    if (!confirm(`Supprimer le lien "${link.title}" ?`)) return;
    const { error } = await sb.from("page_links").delete().eq("id", id);
    if (error) return toast(error.message);
    p._links = links.filter(l => l.id !== id);
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "toggle") {
    const newVal = !link.enabled;
    const { error } = await sb.from("page_links").update({ enabled: newVal }).eq("id", id);
    if (error) return toast(error.message);
    link.enabled = newVal;
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "up" || action === "down") {
    const swapIdx = action === "up" ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= links.length) return;
    const other = links[swapIdx];
    // Swap positions
    const linkPos = link.position, otherPos = other.position;
    const updA = sb.from("page_links").update({ position: otherPos }).eq("id", link.id);
    const updB = sb.from("page_links").update({ position: linkPos }).eq("id", other.id);
    await Promise.all([updA, updB]);
    link.position = otherPos; other.position = linkPos;
    p._links = [...links].sort((a,b) => a.position - b.position);
    renderLinksEditList(); updatePreview();
    return;
  }
}

function openLinkModal(link) {
  const editing = !!link;
  showModal({
    title: editing ? "Modifier le lien" : "Nouveau lien",
    body: `
      <label>Titre du bouton</label>
      <input type="text" id="ml_title" placeholder="Ex: Mon Telegram" value="${editing?esc(link.title):""}" autofocus>
      <label>URL</label>
      <input type="url" id="ml_url" placeholder="https://t.me/..." value="${editing?esc(link.url):""}">
      <label>Username du compte (interne, pour l'orga)</label>
      <input type="text" id="ml_username" placeholder="@sophie_xxx" value="${editing?esc(link.username||""):""}">
      <p class="hint">Le username n'apparaît jamais sur la landing publique — c'est juste pour t'y retrouver dans l'admin.</p>
      <label>Icône (1 emoji, optionnel)</label>
      <input type="text" id="ml_icon" maxlength="4" placeholder="auto" value="${editing?esc(link.icon||""):""}">
      <p class="hint">Laisse vide pour détection auto (Telegram = ✈️, Insta = 📸, etc.)</p>
    `,
    submitLabel: editing ? "Enregistrer" : "Créer",
    onSubmit: async () => {
      const title = document.getElementById("ml_title").value.trim();
      let url = document.getElementById("ml_url").value.trim();
      const username = document.getElementById("ml_username").value.trim();
      const icon = document.getElementById("ml_icon").value.trim() || null;
      if (!title || !url) return false;
      url = normalizeUrl(url);
      const p = currentPage();
      if (editing) {
        const { error } = await sb.from("page_links").update({ title, url, username, icon }).eq("id", link.id);
        if (error) { toast(error.message); return false; }
        Object.assign(link, { title, url, username, icon });
      } else {
        const pos = (p._links || []).length;
        const { data: row, error } = await sb.from("page_links").insert({
          page_id: p.id, title, url, username, icon, position: pos, enabled: true
        }).select().single();
        if (error) { toast(error.message); return false; }
        p._links = [...(p._links||[]), row];
      }
      renderLinksEditList(); updatePreview();
      toast(editing ? "Lien modifié" : "Lien ajouté"); return true;
    }
  });
}

async function onDeleteCurrentPage() {
  const p = currentPage(); if (!p) return;
  if (!confirm(`Supprimer la page "${p.slug}" définitivement ?`)) return;
  if (p.photo_path) { try { await sb.storage.from("landing_photos").remove([p.photo_path]); } catch(_) {} }
  const { error } = await sb.from("landing_pages").delete().eq("id", p.id);
  if (error) return toast(error.message);
  pages = pages.filter(x => x.id !== p.id);
  closePageDrawer();
  renderPagesGrid();
  toast("Page supprimée");
}

// Start
route();
})();
</script>
