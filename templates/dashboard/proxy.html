{% raw %}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="/static/assets/logo-conquerorz.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ConquerorZ · Proxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#FAFAF9; --card:#FFFFFF; --border:#E8E6E1; --border-strong:#D4D1CB;
    --ink:#16150F; --muted:#615F58; --subtle:#94908A; --muted-bg:#F4F3F1;
    --accent:#3B9DF7; --accent-deep:#1F7BD6; --accent-soft:#E4F1FE;
    --green:#15803d; --green-bg:#ecfdf5;
    --red:#E5484D; --red-bg:#FFF0F0;
    --radius:10px;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { background:var(--bg); }
  body { font-family:'Schibsted Grotesk',system-ui,sans-serif; color:var(--ink); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .layout { max-width:960px; margin:0 auto; padding:32px 28px 64px; }
  .header { margin-bottom:28px; }
  .header h1 { font-size:24px; font-weight:700; letter-spacing:-0.02em; }
  .header .sub { color:var(--subtle); font-size:13px; }

  .proxy-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:20px; }

  .proxy-card {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:28px; text-align:center; transition:border-color .15s;
  }
  .proxy-card:hover { border-color:var(--border-strong); }
  .proxy-name {
    font-size:18px; font-weight:700; letter-spacing:-0.01em; margin-bottom:4px;
  }
  .proxy-host { font-size:11px; color:var(--subtle); font-family:monospace; margin-bottom:20px; }
  .proxy-ip {
    font-family:monospace; font-size:26px; font-weight:700; letter-spacing:-0.02em;
    color:var(--ink); margin:8px 0 4px;
  }
  .proxy-ip.loading { color:var(--subtle); font-size:14px; }
  .ip-label { font-size:12px; color:var(--subtle); margin-bottom:20px; }

  .rotate-btn {
    font-family:inherit; font-size:14px; font-weight:600;
    padding:12px 28px; border-radius:10px; border:0;
    background:var(--ink); color:#fff; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    transition:all .15s;
  }
  .rotate-btn:hover:not(:disabled) { opacity:0.85; }
  .rotate-btn:disabled { opacity:0.4; cursor:default; }
  .rotate-btn svg { width:16px; height:16px; transition:transform .6s ease; }
  .rotate-btn.spinning svg { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .result { margin-top:16px; min-height:24px; }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:500; }
  .badge.ok { background:var(--green-bg); color:var(--green); }
  .badge.err { background:var(--red-bg); color:var(--red); }
  .badge.loading { background:var(--accent-soft); color:var(--accent-deep); }
  .last-rotate { margin-top:12px; font-family:monospace; font-size:11px; color:var(--subtle); }
</style>
</head>
<body>
<div class="layout">
  <div class="header">
    <h1>Proxy</h1>
    <div class="sub">Change l'IP de sortie de tes proxies en un clic.</div>
  </div>
  <div class="proxy-grid" id="proxyGrid">
    <div style="text-align:center;padding:48px;color:var(--subtle);">Chargement...</div>
  </div>
</div>

<script>
let proxies = [];

function fmtTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}

async function loadProxies(){
  const r = await fetch('/api/proxy/list');
  const j = await r.json();
  proxies = j.proxies || [];
  render();
  // Load live IPs
  proxies.forEach((p,i) => loadIp(p.id, i));
}

function render(){
  const grid = document.getElementById('proxyGrid');
  if(!proxies.length){
    grid.innerHTML = '<div style="text-align:center;padding:48px;color:var(--subtle);">Aucun proxy configuré</div>';
    return;
  }
  grid.innerHTML = proxies.map((p,i) => `
    <div class="proxy-card" data-idx="${i}">
      <div class="proxy-name">${p.name || 'Proxy ' + (i+1)}</div>
      <div class="proxy-host">${p.proxy_host}:${p.proxy_port} · SOCKS5</div>
      <div class="proxy-ip${p.last_ip ? '' : ' loading'}" id="ip-${i}">${p.last_ip || 'Chargement...'}</div>
      <div class="ip-label">IP actuelle</div>
      <button class="rotate-btn" id="btn-${i}" onclick="rotate(${i})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg>
        Changer l'IP
      </button>
      <div class="result" id="res-${i}"></div>
      <div class="last-rotate" id="last-${i}">${p.last_rotated_at ? 'Dernier: ' + fmtTime(p.last_rotated_at) : ''}</div>
    </div>
  `).join('');
}

async function loadIp(proxyId, idx){
  try {
    const r = await fetch('/api/proxy/ip?proxy_id=' + proxyId);
    const j = await r.json();
    const el = document.getElementById('ip-' + idx);
    if(j.ip){
      el.textContent = j.ip;
      el.classList.remove('loading');
    } else if(!el.textContent || el.textContent === 'Chargement...'){
      el.textContent = 'Indisponible';
      el.classList.remove('loading');
    }
    // else: keep the last known IP already shown
  } catch(e){
    const el = document.getElementById('ip-' + idx);
    if(!el.textContent || el.textContent === 'Chargement...') el.textContent = 'Erreur';
  }
}

async function rotate(idx){
  const p = proxies[idx];
  const btn = document.getElementById('btn-' + idx);
  const res = document.getElementById('res-' + idx);
  const ipEl = document.getElementById('ip-' + idx);

  btn.disabled = true;
  btn.classList.add('spinning');
  res.innerHTML = '<div class="badge loading">Changement en cours…</div>';

  try {
    const r = await fetch('/api/proxy/rotate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({proxy_id: p.id})
    });
    const j = await r.json();
    if(j.ok){
      ipEl.textContent = j.ip || '—';
      ipEl.classList.remove('loading');
      res.innerHTML = '<div class="badge ok"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l3 3 7-7"/></svg> ' + (j.ip || 'OK') + '</div>';
      document.getElementById('last-' + idx).textContent = 'Dernier: à l\'instant';
      // Clear success after 5s
      setTimeout(() => { res.innerHTML = ''; }, 5000);
    } else {
      res.innerHTML = '<div class="badge err">' + (j.error || 'Erreur') + '</div>';
    }
  } catch(e){
    res.innerHTML = '<div class="badge err">Erreur réseau</div>';
  }
  btn.classList.remove('spinning');
  btn.disabled = false;
}

loadProxies();
</script>
</body>
</html>
{% endraw %}
