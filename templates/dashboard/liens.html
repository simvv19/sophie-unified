function pct(x,total){if(!total)return '0 %';return (Math.round((x/total)*1000)/10).toString().replace('.',',')+' %'}

// ============================================================ ATOMS
function Button({variant='primary',size='md',icon,children,...rest}){

    base:{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,borderRadius:8,fontFamily:'inherit',fontWeight:500,border:'1px solid transparent',cursor:'pointer',transition:'background var(--dur-micro) var(--ease)',whiteSpace:'nowrap'},

// ============================================================ CHARTS
function TimeSeriesChart({series,height=240,accent='var(--accent)',gradId='ts-grad'}){
  const [hi,setHi]=useState(null);const wrapRef=useRef(null);
  const W=1000,H=1000,PL=4,PR=1,PT=6,PB=10;
  const pts=series.filter(s=>s.value!=null);const vals=pts.map(s=>s.value);
  const max=Math.max(10,...vals);const niceMax=Math.ceil(max/5)*5;const n=series.length;
  const xPct=i=>PL+(i*(100-PL-PR))/(n-1);const yPct=v=>PT+(1-v/niceMax)*(100-PT-PB);
  let dPath='',dArea='',firstX=null,lastX=null,started=false;
  series.forEach((s,i)=>{if(s.value==null)return;const x=xPct(i)*W/100,y=yPct(s.value)*H/100;if(!started){dPath+=`M ${x} ${y}`;firstX=x;started=true}else dPath+=` L ${x} ${y}`;lastX=x});
  const baseY=(100-PB)*H/100;if(started)dArea=dPath+` L ${lastX} ${baseY} L ${firstX} ${baseY} Z`;
  function onMove(e){const r=wrapRef.current.getBoundingClientRect();const relPct=(e.clientX-r.left)/r.width*100;let best=null,bd=1e9;series.forEach((s,i)=>{if(s.value==null)return;const d=Math.abs(xPct(i)-relPct);if(d<bd){bd=d;best=i}});setHi(best)}
  const gy=[0,.25,.5,.75,1];const hiPt=hi!=null?series[hi]:null;
  return(
    <div ref={wrapRef} style={{position:'relative',width:'100%',height}} onMouseMove={onMove} onMouseLeave={()=>setHi(null)}>
      {gy.map((g,i)=>{const topPct=PT+g*(100-PT-PB);const val=Math.round(niceMax*(1-g));return(
        <div key={i} style={{position:'absolute',left:0,right:0,top:`${topPct}%`,height:0}}>
          <div style={{position:'absolute',left:`${PL}%`,right:`${PR}%`,borderTop:i===gy.length-1?'1px solid var(--border)':'1px dashed var(--border-subtle)'}}></div>
          <div style={{position:'absolute',left:0,top:-8,width:`${PL}%`,paddingRight:8,textAlign:'right',fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums'}}>{fmt(val)}</div>
        </div>
      )})}
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',overflow:'visible'}}>
        <defs><linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3B9DF7" stopOpacity="0.20"/><stop offset="100%" stopColor="#3B9DF7" stopOpacity="0"/></linearGradient></defs>
        {dArea&&<path d={dArea} fill={`url(#${gradId})`}/>}
        {dPath&&<path d={dPath} fill="none" stroke={accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>}
        {hiPt&&hiPt.value!=null&&<line x1={xPct(hi)*W/100} x2={xPct(hi)*W/100} y1={PT*H/100} y2={baseY} stroke="var(--border-strong)" strokeWidth="1" strokeDasharray="3 3" vectorEffect="non-scaling-stroke"/>}
      </svg>
      {series.map((s,i)=>s.label?<div key={i} style={{position:'absolute',left:`${xPct(i)}%`,bottom:0,transform:'translateX(-50%)',fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>{s.label}</div>:null)}
      {hiPt&&hiPt.value!=null&&(
        <>
          <div style={{position:'absolute',left:`${xPct(hi)}%`,top:`${yPct(hiPt.value)}%`,width:11,height:11,marginLeft:-5.5,marginTop:-5.5,borderRadius:'50%',background:'#fff',border:`2.5px solid ${accent}`,pointerEvents:'none',zIndex:4}}></div>
          <div style={{position:'absolute',left:`${xPct(hi)}%`,top:`${yPct(hiPt.value)}%`,transform:'translate(-50%, calc(-100% - 14px))',pointerEvents:'none',zIndex:5}}>
            <div style={{background:'var(--fg)',color:'#fff',borderRadius:8,padding:'7px 10px',boxShadow:'var(--shadow-md)',whiteSpace:'nowrap',textAlign:'center'}}>
              <div style={{fontSize:16,fontWeight:600,fontVariantNumeric:'tabular-nums',fontFamily:'var(--font-mono)'}}>{fmt(hiPt.value)}</div>
              <div style={{fontSize:11,color:'rgba(255,255,255,0.7)'}}>clics &middot; {hiPt.label||''}</div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function Sparkline({series,width=96,height=30,color='var(--accent)'}){
  const pts=series.filter(s=>s.value!=null);const vals=pts.map(s=>s.value);
  const max=Math.max(1,...vals),min=Math.min(...vals);const n=pts.length;
  if(n<2)return <div style={{width,height}}></div>;
  const x=i=>(i*width)/(n-1);const y=v=>height-3-((v-min)/Math.max(1,max-min))*(height-6);
  const d=pts.map((s,i)=>`${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(s.value).toFixed(1)}`).join(' ');
  const area=d+` L ${width} ${height} L 0 ${height} Z`;
  return(
    <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} style={{display:'block'}}>
      <defs><linearGradient id="spk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3B9DF7" stopOpacity="0.18"/><stop offset="100%" stopColor="#3B9DF7" stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill="url(#spk)"/><path d={d} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Donut({data,size=168,thickness=22}){
  const [hi,setHi]=useState(null);const total=data.reduce((a,d)=>a+d.clicks,0);
  const R=(size-thickness)/2;const C=2*Math.PI*R;let acc=0;const top=data[0]||{clicks:0,label:'—'};
  return(
    <div style={{display:'flex',alignItems:'center',gap:22}}>
      <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
        <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{transform:'rotate(-90deg)'}}>
          <circle cx={size/2} cy={size/2} r={R} fill="none" stroke="var(--bg-muted)" strokeWidth={thickness}/>
          {data.map((d,i)=>{const frac=d.clicks/total;const len=frac*C;const gap=2;const el=(
            <circle key={i} cx={size/2} cy={size/2} r={R} fill="none" stroke={d.color} strokeWidth={hi===i?thickness+4:thickness} strokeDasharray={`${Math.max(0,len-gap)} ${C-Math.max(0,len-gap)}`} strokeDashoffset={-acc} strokeLinecap="butt" style={{transition:'stroke-width var(--dur-micro) var(--ease)',cursor:'default'}} onMouseEnter={()=>setHi(i)} onMouseLeave={()=>setHi(null)}/>
          );acc+=len;return el})}
        </svg>
        <div style={{position:'absolute',inset:0,display:'grid',placeItems:'center',textAlign:'center'}}>
          <div>
            <div style={{fontSize:22,fontWeight:600,letterSpacing:'-0.02em',fontVariantNumeric:'tabular-nums'}}>{hi!=null?pct(data[hi].clicks,total):pct(top.clicks,total)}</div>
            <div style={{fontSize:11,color:'var(--fg-muted)',maxWidth:80,lineHeight:1.25}}>{hi!=null?data[hi].label:top.label}</div>
          </div>
        </div>
      </div>
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:2}}>
        {data.map((d,i)=>(
          <div key={i} onMouseEnter={()=>setHi(i)} onMouseLeave={()=>setHi(null)} style={{display:'flex',alignItems:'center',gap:9,padding:'5px 6px',borderRadius:6,background:hi===i?'var(--bg-muted)':'transparent',cursor:'default'}}>
            <span style={{width:9,height:9,borderRadius:3,background:d.color,flexShrink:0}}></span>
            <span style={{flex:1,fontSize:13,color:'var(--fg)'}}>{d.label}</span>
            <span style={{fontSize:12,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)'}}>{fmt(d.clicks)}</span>
            <span style={{fontSize:13,fontWeight:600,fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',minWidth:46,textAlign:'right'}}>{pct(d.clicks,total)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================ WORLD MAP
function WorldMap({cities,total,height=440}){
  const VW=980,VH=470;const[geo,setGeo]=useState(null);const[err,setErr]=useState(false);const[hi,setHi]=useState(null);const[t,setT]=useState(null);
  const svgRef=useRef(null);const zoomRef=useRef(null);const initRef=useRef(null);
  useEffect(()=>{let dead=false;async function load(){try{if(!window.d3||!window.topojson){setErr(true);return}if(!window.__czTopo){window.__czTopo=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')}const topo=window.__czTopo;const land=topojson.feature(topo,topo.objects.countries);const feats=land.features.filter(f=>f.id!=='010');const fc={type:'FeatureCollection',features:feats};const projection=d3.geoNaturalEarth1();projection.fitExtent([[8,8],[VW-8,VH-8]],fc);const path=d3.geoPath(projection);const paths=feats.map(f=>path(f));if(!dead)setGeo({paths,project:([lon,lat])=>projection([lon,lat])})}catch(e){if(!dead)setErr(true)}}load();return()=>{dead=true}},[]);
  useEffect(()=>{if(!geo||!svgRef.current||!window.d3)return;const corners=[[-12,60],[34,60],[34,18],[-12,18],[11,40]].map(geo.project);const xs=corners.map(p=>p[0]),ys=corners.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const cx=(x0+x1)/2,cy=(y0+y1)/2;let k=.92*Math.min(VW/(x1-x0),VH/(y1-y0));k=Math.max(1,Math.min(9,k));const tx=VW/2-k*cx,ty=VH/2-k*cy;const initial=d3.zoomIdentity.translate(tx,ty).scale(k);initRef.current=initial;const zoom=d3.zoom().scaleExtent([1,9]).translateExtent([[0,0],[VW,VH]]).on('zoom',e=>setT(e.transform));zoomRef.current=zoom;const sel=d3.select(svgRef.current);sel.call(zoom);sel.call(zoom.transform,initial)},[geo]);
  function zoomBy(f){if(!zoomRef.current||!svgRef.current)return;d3.select(svgRef.current).transition().duration(260).call(zoomRef.current.scaleBy,f)}
  function reset(){if(!zoomRef.current||!svgRef.current||!initRef.current)return;d3.select(svgRef.current).transition().duration(360).call(zoomRef.current.transform,initRef.current)}
  useEffect(()=>{if(geo&&window.lucide)lucide.createIcons()},[geo,err]);
  const k=t?t.k:1;const maxClicks=Math.max(...cities.map(c=>c.clicks),1);const rBase=c=>4+Math.sqrt(c.clicks/maxClicks)*20;const rOf=c=>rBase(c)/k;
  const tstr=t?`translate(${t.x},${t.y}) scale(${t.k})`:'';
  return(
    <div style={{position:'relative',width:'100%'}}>
      <div style={{position:'relative',width:'100%',borderRadius:10,overflow:'hidden',background:'linear-gradient(180deg,#FBFBFA 0%,#F4F3F1 100%)',border:'1px solid var(--border)'}}>
        <svg ref={svgRef} viewBox={`0 0 ${VW} ${VH}`} style={{width:'100%',height,display:'block',cursor:'grab',touchAction:'none'}}>
          <g transform={tstr}>
            {geo&&geo.paths.map((d,i)=><path key={i} d={d} fill="#E7E5E0" stroke="#D8D5CF" strokeWidth="0.6" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>)}
            {geo&&t&&cities.slice(0,5).map((c,i)=>{const p=geo.project([c.lon,c.lat]);if(!p)return null;return <g key={'h'+i} transform={`translate(${p[0]} ${p[1]})`}><circle r={rOf(c)} fill="var(--accent)" className="cz-pulse" style={{animationDelay:`${i*.45}s`}}/></g>})}
            {geo&&t&&cities.map((c,i)=>{const p=geo.project([c.lon,c.lat]);if(!p)return null;const r=rOf(c);const on=hi===i;return(
              <g key={i} transform={`translate(${p[0]} ${p[1]})`} style={{cursor:'pointer'}} onMouseEnter={()=>setHi(i)} onMouseLeave={()=>setHi(null)}>
                <circle r={r+6/k} fill="transparent"/><circle r={r} fill="var(--accent)" fillOpacity={on?.96:.74} stroke="#fff" strokeWidth={on?2:1.25} vectorEffect="non-scaling-stroke"/><circle r={Math.max(1.4/k,r*.34)} fill="#fff" fillOpacity={.92}/>
              </g>
            )})}
          </g>

const PERIODS=[
  {value:'ajd',label:"Aujourd'hui",days:1},
  {value:'hier',label:'Hier',days:1},
  {value:'7j',label:'7 jours',days:7},
  {value:'30j',label:'30 jours',days:30},
  {value:'3mois',label:'3 mois',days:91},
];

// Known city coords for the map
const CITY_COORDS={
  'Paris':{lat:48.857,lon:2.352},'Lyon':{lat:45.764,lon:4.836},'Marseille':{lat:43.296,lon:5.370},'Bordeaux':{lat:44.838,lon:-0.579},
  'Lille':{lat:50.629,lon:3.057},'Toulouse':{lat:43.605,lon:1.444},'Nantes':{lat:47.218,lon:-1.554},'Strasbourg':{lat:48.573,lon:7.752},
  'Bruxelles':{lat:50.851,lon:4.352},'Geneve':{lat:46.204,lon:6.143},'Montreal':{lat:45.502,lon:-73.567},
  'New York':{lat:40.713,lon:-74.006},'Los Angeles':{lat:34.052,lon:-118.244},'Londres':{lat:51.507,lon:-0.128},
  'Casablanca':{lat:33.573,lon:-7.590},'Dakar':{lat:14.692,lon:-17.446},'Abidjan':{lat:5.360,lon:-4.008},
  'Berlin':{lat:52.520,lon:13.405},'Madrid':{lat:40.417,lon:-3.703},'Dubai':{lat:25.205,lon:55.271},
};
const DEVICE_COLORS={iphone:'var(--accent)',android:'#FF9500',pc:'#6366F1',mac:'#5C5A55',tablet:'#1F8A3C',other:'var(--border-strong)'};
const DEVICE_LABELS={iphone:'iPhone',android:'Android',pc:'Windows PC',mac:'Mac',tablet:'Tablette',other:'Autre'};
const PLATFORM_TONES={instagram:'accent',tiktok:'neutral',snapchat:'orange',facebook:'info',direct:'neutral',google:'success',twitter:'info'};

function dateRange(period){
  const now=new Date();
  let from;
  if(period==='hier'){from=new Date(now);from.setDate(from.getDate()-1);from.setHours(0,0,0,0);const to=new Date(from);to.setHours(23,59,59,999);return{from:from.toISOString(),to:to.toISOString()}}
  if(period==='ajd'){from=new Date(now);from.setHours(0,0,0,0);return{from:from.toISOString(),to:now.toISOString()}}
  from=new Date(now);
  const days=PERIODS.find(p=>p.value===period)?.days||7;
  from.setDate(from.getDate()-days);from.setHours(0,0,0,0);
  return{from:from.toISOString(),to:now.toISOString()};
}

async function fetchVisits(period,pageId){
  const {from,to}=dateRange(period);
  let q=sb.from('visits').select('*').gte('created_at',from).lte('created_at',to);
  if(pageId)q=q.eq('page_id',pageId);
  const {data}=await q;
  return data||[];
}

async function fetchPages(){
  const {data}=await sb.from('landing_pages').select('id,slug,data,created_at').order('created_at',{ascending:true});
  return data||[];
}

function buildTimeSeries(visits,period){
  const {from}=dateRange(period);const per=PERIODS.find(p=>p.value===period);
  const days=per.days;const buckets=days<=1?24:days;
  const series=Array.from({length:buckets},(_,i)=>({label:'',value:0}));
  visits.forEach(v=>{
    const d=new Date(v.created_at);
    if(days<=1){const h=d.getHours();if(h<buckets){series[h].value++;series[h].label=h%3===0?h+'h':''}}
    else{const diff=Math.floor((d-new Date(from))/(1000*60*60*24));if(diff>=0&&diff<buckets){series[diff].value++;if(buckets<=7)series[diff].label=['lun','mar','mer','jeu','ven','sam','dim'][(diff+new Date(from).getDay())%7];else if(diff%5===0)series[diff].label=(diff+1)+''}}
  });
  return series;
}

function groupBy(arr,key){const m={};arr.forEach(v=>{const k=v[key]||'Inconnu';m[k]=(m[k]||0)+1});return Object.entries(m).map(([k,v])=>({key:k,count:v})).sort((a,b)=>b.count-a.count)}

  useEffect(()=>{setLoading(true);Promise.all([fetchVisits(period),fetchPages()]).then(([v,p])=>{setVisits(v);setPages(p);setLoading(false)})},[period]);
  useEffect(()=>{if(window.lucide)lucide.createIcons()});
  function onCreated(pg){setPages(prev=>[...prev,pg])}

  const views=visits.filter(v=>v.type==='view');const clicks=visits.filter(v=>v.type==='click');
  const convRate=views.length?clicks.length/views.length:0;
  const countries=groupBy(visits,'country');
  const series=buildTimeSeries(clicks,period);
  const per=PERIODS.find(p=>p.value===period);

      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:14}}>
        <StatCard emphasis icon="mouse-pointer-click" label="Total clics" value={fmt(clicks.length)}/>
        <StatCard icon="eye" label="Vues" value={fmt(views.length)}/>
        <StatCard icon="percent" label="Conversion" value={(Math.round(convRate*1000)/10).toString().replace('.',',')} unit="%"/>
        <StatCard icon="globe" label="Pays" value={countries.length}/>
      </div>

      <Card style={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
          <div><div style={{fontSize:14,fontWeight:600}}>Clics sur vos liens</div><div style={{fontSize:12,color:'var(--fg-muted)',marginTop:2}}>{per.label} &middot; tous liens confondus</div></div>
          <div style={{textAlign:'right'}}><div style={{fontSize:22,fontWeight:600,letterSpacing:'-0.02em',fontVariantNumeric:'tabular-nums'}}>{fmt(clicks.length)}</div><div style={{fontSize:11,color:'var(--fg-subtle)'}}>clics au total</div></div>
        </div>
        <TimeSeriesChart series={series} height={240} gradId="ov-grad"/>

      {back&&<button onClick={back} title="Retour" style={{width:32,height:32,marginLeft:-4,display:'grid',placeItems:'center',borderRadius:8,border:'1px solid var(--border)',background:'#fff',cursor:'pointer',color:'var(--fg-muted)',flexShrink:0}}><i data-lucide="arrow-left" style={{width:16,height:16}}></i></button>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:15,fontWeight:600,letterSpacing:'-0.01em'}}>{title}</div>
        {subtitle&&<div style={{fontSize:12,color:'var(--fg-muted)',marginTop:1}}>{subtitle}</div>}
      </div>
    </header>
  );
}

function App(){
  const [view,setView]=useState('overview');const [page,setPage]=useState(null);const [period,setPeriod]=useState('7j');
  useEffect(()=>{if(window.lucide)lucide.createIcons()});
  function openPage(p){setPage(p);setView('detail');window.scrollTo(0,0)}
  function back(){setView('overview');setPage(null)}
  let title,subtitle,backFn=null,screen;
  if(view==='detail'&&page){title=page.data?.title||page.slug;subtitle='Analytics de la page';backFn=back;screen=<PageDetail page={page} period={period} setPeriod={setPeriod}/>}
  else{title='Mes pages';subtitle='Suivi des clics sur vos pages';screen=<LinksOverview period={period} setPeriod={setPeriod} onOpen={openPage}/>}
  return(
    <div style={{minHeight:'100vh',maxWidth:1320,margin:'0 auto'}}>
      <TopBar title={title} subtitle={subtitle} back={backFn}/>
      {screen}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
