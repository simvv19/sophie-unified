<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liens — Analytics · ConquerorZ</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/logo-conquerorz.svg">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<style>
:root {
  --bg:#FAFAF9;--bg-elevated:#FFFFFF;--bg-muted:#F4F3F1;--bg-sunken:#EFEDE9;
  --border:#E8E6E1;--border-strong:#D4D1CB;--border-subtle:#F0EEEA;
  --fg:#0A0A0A;--fg-muted:#5C5A55;--fg-subtle:#8A8780;--fg-on-accent:#FFFFFF;
  --accent:#3B9DF7;--accent-hover:#1F7BD6;--accent-press:#1565B8;--accent-soft:#E4F1FE;--accent-soft-hover:#D0E5FC;
  --orange:#FF9500;--orange-soft:#FFF1DC;
  --success:#1F8A3C;--success-soft:#E3F4E7;--warning:#B8860B;--warning-soft:#FBF1D7;
  --danger:#D8241A;--danger-soft:#FBE0DE;--info:#2563EB;--info-soft:#DDE8FE;
  --font-sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --text-xs:12px;--text-sm:13px;--text-base:14px;--text-md:16px;--text-lg:18px;--text-xl:22px;--text-2xl:28px;
  --shadow-xs:0 1px 2px rgb(0 0 0/.04);--shadow-sm:0 1px 3px rgb(0 0 0/.06),0 1px 2px rgb(0 0 0/.04);
  --shadow-md:0 4px 12px rgb(0 0 0/.08);--shadow-lg:0 12px 32px rgb(0 0 0/.12);
  --ease:cubic-bezier(.2,0,0,1);--dur-micro:120ms;--dur-base:280ms;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--fg);font-size:var(--text-base);
  -webkit-font-smoothing:antialiased;line-height:1.5}
.cz-row:hover{background:var(--bg-muted)}
.cz-pulse{transform-box:fill-box;transform-origin:center;animation:czpulse 2.6s var(--ease) infinite}
@keyframes czpulse{0%{transform:scale(1);opacity:.42}70%{transform:scale(3.2);opacity:0}100%{transform:scale(3.2);opacity:0}}
.cz-spin{animation:czspin .8s linear infinite}
@keyframes czspin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--bg-elevated)}

/* ========== DRAWER ========== */
@keyframes dFade{from{opacity:0}to{opacity:1}}
@keyframes dSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-overlay{position:fixed;inset:0;background:rgba(10,11,36,.4);backdrop-filter:blur(4px);z-index:100;animation:dFade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(960px,100vw);background:#fff;z-index:101;display:grid;grid-template-columns:1fr 480px;animation:dSlide .25s cubic-bezier(.2,.9,.3,1)}
.drawer-form{overflow-y:auto;padding:22px 24px 110px;border-right:1px solid var(--border)}
.drawer-preview{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
.drawer-preview iframe{width:380px;height:calc(100vh - 40px);max-height:780px;border:none;border-radius:22px;box-shadow:0 20px 40px -16px rgba(10,11,36,.25);background:#fff}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drawer-head h2{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:20px;margin:0;letter-spacing:-.48px}
.drawer-head .x{background:none;border:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--fg-muted);font-size:22px;line-height:1}
.drawer-head .x:hover{background:#f6f6f8}
.drawer-tabs{display:flex;gap:4px;padding:4px;background:#f0f0f5;border-radius:12px;margin-bottom:18px}
.drawer-tabs button{flex:1;background:transparent;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#6B6B6E;font-family:inherit}
.drawer-tabs button.active{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.06);font-weight:600}
.drawer-save{position:absolute;bottom:0;left:0;right:480px;background:#fff;border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px}
.drawer-save .status{flex:1;font-size:12.5px;color:var(--fg-muted)}
.drawer-save .status.saving{color:var(--accent)}
.drawer-save .status.saved{color:#34c759}
.drawer fieldset{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.drawer fieldset legend{font-size:14px;font-weight:600;padding:0 8px;color:var(--fg)}
.drawer fieldset label{display:block;font-size:12.5px;font-weight:500;color:var(--fg-muted);margin:10px 0 4px}
.drawer fieldset input[type="text"],.drawer fieldset input[type="url"],.drawer fieldset textarea,.drawer fieldset select{width:100%;height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff}
.drawer fieldset textarea{height:auto;padding:10px 12px;resize:vertical}
.drawer fieldset .hint{font-size:11.5px;color:var(--fg-subtle);margin:4px 0 0}
.drawer fieldset .slug-row{display:flex;align-items:center}
.drawer fieldset .slug-row .prefix{padding:0 10px;height:36px;display:flex;align-items:center;background:var(--bg-muted);border:1px solid var(--border-strong);border-right:none;border-radius:8px 0 0 8px;font-size:12px;color:var(--fg-subtle);white-space:nowrap}
.drawer fieldset .slug-row input{border-radius:0 8px 8px 0}
.drawer fieldset .toggle-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.drawer fieldset .toggle-row label{margin:0;cursor:pointer;font-size:13px}
.drawer fieldset .color-row{display:flex;align-items:center;gap:8px}
.drawer fieldset .color-row input[type="color"]{width:36px;height:36px;border:1px solid var(--border-strong);border-radius:8px;padding:2px;cursor:pointer}
.drawer fieldset .color-row input[type="text"]{flex:1}
.drawer fieldset .photo-row{display:flex;align-items:center;gap:12px;margin:4px 0}
.drawer fieldset .photo-preview{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
.drawer .seg{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.drawer .seg label{flex:1;cursor:pointer;text-align:center}
.drawer .seg label input{display:none}
.drawer .seg label .opt{display:block;padding:8px 10px;font-size:13px;font-weight:500;color:var(--fg-muted)}
.drawer .seg label input:checked+.opt{background:var(--accent);color:#fff;font-weight:600}

/* Link edit list */
.link-edit-empty{padding:24px;text-align:center;color:var(--fg-muted);background:#f6f6f8;border:1px dashed var(--border);border-radius:12px;font-size:13.5px}
.link-edit-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
.link-edit-handle{color:var(--fg-muted);font-size:14px;cursor:grab}
.link-edit-icon{width:32px;height:32px;border-radius:8px;background:#f6f6f8;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.link-edit-meta{flex:1;min-width:0}
.link-edit-title{font-weight:600;font-size:13.5px;color:var(--fg);display:flex;align-items:center;gap:6px}
.link-edit-off{font-size:10px;padding:1px 6px;border-radius:4px;background:#e8e8ec;color:#8a7a90;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.link-edit-sub{font-size:11.5px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.link-edit-user{color:var(--accent);font-weight:600}
.link-edit-stats{font-size:11px;color:var(--accent);background:#f0f0f5;padding:3px 8px;border-radius:999px;font-weight:600;flex:none}
.link-edit-btn{background:none;border:1px solid var(--border);width:28px;height:28px;border-radius:7px;cursor:pointer;color:var(--fg-subtle);font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.link-edit-btn:hover:not(:disabled){background:#f6f6f8;color:var(--fg)}
.link-edit-btn:disabled{opacity:.3;cursor:not-allowed}
.link-edit-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}

/* Theme / Card style / Background grids */
.theme-grid{display:flex;gap:8px;flex-wrap:wrap}
.theme-chip{border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.theme-chip.active{border-color:var(--accent)}
.theme-grad{width:40px;height:40px;border-radius:8px;display:block}
.theme-name{font-size:10px;color:var(--fg-muted);font-weight:500}
.cstyle-grid,.bg-grid{display:flex;gap:8px;flex-wrap:wrap}
.cstyle-chip,.bg-chip{border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:72px}
.cstyle-chip.active,.bg-chip.active{border-color:var(--accent)}
.cstyle-mini{width:48px;height:32px;border-radius:6px;background:#f0f0f5;border:1px solid var(--border)}
.bg-preview{width:48px;height:32px;border-radius:6px;border:1px solid var(--border)}
.cstyle-name,.bg-name{font-size:10px;color:var(--fg-muted);font-weight:500}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,11,36,.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;animation:dFade .2s}
.modal{background:#fff;border-radius:16px;padding:24px;width:420px;max-width:92vw;box-shadow:0 20px 40px -16px rgba(10,11,36,.25);z-index:201}
.modal h3{font-size:18px;font-weight:600;margin:0 0 16px}
.modal label{display:block;font-size:12.5px;font-weight:500;color:var(--fg-muted);margin:10px 0 4px}
.modal input[type="text"],.modal input[type="url"]{width:100%;height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.modal .hint{font-size:11.5px;color:var(--fg-subtle);margin:4px 0 0}
.modal .modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* Btn styles for drawer */
.btn{height:36px;padding:0 18px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;border:1px solid var(--border-strong);background:#fff;color:var(--fg)}
.btn:hover{background:var(--bg-muted)}
.btn-primary{background:var(--accent);color:#fff;border:none}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;animation:dFade .2s}

@media(max-width:768px){
  .drawer{grid-template-columns:1fr;width:100vw}
  .drawer-preview{display:none}
  .drawer-save{right:0}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ============================================================ SUPABASE
const sb = window.supabase.createClient(
  "https://sfaxubipmidysfvtfvdx.supabase.co",
  "sb_publishable_lRUeA0F7gERIq5SdUcLEWA_p5czx1uv"
);

// ============================================================ HELPERS
function fmt(n){n=Math.round(n);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function pct(x,total){if(!total)return '0 %';return (Math.round((x/total)*1000)/10).toString().replace('.',',')+' %'}

// ============================================================ ATOMS
function Button({variant='primary',size='md',icon,children,...rest}){
  const s={
    base:{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,borderRadius:8,fontFamily:'inherit',fontWeight:500,border:'1px solid transparent',cursor:'pointer',transition:'background var(--dur-micro) var(--ease)',whiteSpace:'nowrap'},
    primary:{background:'var(--accent)',color:'#fff'},
    secondary:{background:'#fff',color:'var(--fg)',borderColor:'var(--border-strong)'},
    ghost:{background:'transparent',color:'var(--fg)'},
    sm:{height:28,padding:'0 10px',fontSize:13},md:{height:36,padding:'0 14px',fontSize:14},lg:{height:44,padding:'0 20px',fontSize:15},
  };
  return <button {...rest} style={{...s.base,...s[variant],...s[size],...(rest.style||{})}}>{icon&&<i data-lucide={icon} style={{width:14,height:14}}></i>}{children}</button>;
}

function Badge({tone='neutral',dot,children,style}){
  const tones={success:{background:'var(--success-soft)',color:'var(--success)'},orange:{background:'var(--orange-soft)',color:'var(--warning)'},danger:{background:'var(--danger-soft)',color:'var(--danger)'},accent:{background:'var(--accent-soft)',color:'var(--accent-press)'},info:{background:'var(--info-soft)',color:'var(--info)'},neutral:{background:'var(--bg-muted)',color:'var(--fg-muted)'}};
  return <span style={{display:'inline-flex',alignItems:'center',gap:6,height:22,padding:'0 8px',borderRadius:4,fontSize:11,fontWeight:600,letterSpacing:'0.04em',...tones[tone],...(style||{})}}>{dot&&<span style={{width:6,height:6,borderRadius:'50%',background:tones[tone]?.color}}></span>}{children}</span>;
}

function Segmented({options,value,onChange}){
  return(
    <div style={{display:'inline-flex',padding:2,gap:2,background:'var(--bg-muted)',border:'1px solid var(--border)',borderRadius:9}}>
      {options.map(o=>{const on=o.value===value;return(
        <button key={o.value} onClick={()=>onChange(o.value)} style={{height:34,padding:'0 12px',borderRadius:7,border:'none',cursor:'pointer',font:'inherit',fontSize:13,fontWeight:on?600:500,color:on?'var(--fg)':'var(--fg-muted)',background:on?'#fff':'transparent',boxShadow:on?'var(--shadow-xs)':'none',transition:'background var(--dur-micro) var(--ease)'}}>{o.label}</button>
      )})}
    </div>
  );
}

function Card({children,style,pad=20}){
  return <div style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',borderRadius:12,boxShadow:'var(--shadow-sm)',padding:pad,...(style||{})}}>{children}</div>;
}

function StatCard({label,value,unit,delta,tone='success',emphasis,icon}){
  return(
    <div style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',borderRadius:12,boxShadow:'var(--shadow-sm)',padding:18,position:'relative',overflow:'hidden',outline:emphasis?'1px solid var(--accent-soft)':'none'}}>
      {emphasis&&<div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,var(--accent-soft) 0%,transparent 42%)',opacity:.5,pointerEvents:'none'}}></div>}
      <div style={{position:'relative',display:'flex',alignItems:'center',gap:7}}>
        {icon&&<i data-lucide={icon} style={{width:14,height:14,color:emphasis?'var(--accent)':'var(--fg-subtle)'}}></i>}
        <span style={{fontSize:12,color:'var(--fg-muted)',fontWeight:500}}>{label}</span>
      </div>
      <div style={{position:'relative',display:'flex',alignItems:'baseline',gap:8,marginTop:9}}>
        <span style={{fontSize:30,fontWeight:600,letterSpacing:'-0.02em',fontVariantNumeric:'tabular-nums',lineHeight:1}}>{value}{unit&&<span style={{fontSize:16,color:'var(--fg-muted)',fontWeight:500,marginLeft:2}}>{unit}</span>}</span>
      </div>
      {delta!=null&&(
        <div style={{position:'relative',marginTop:10,display:'flex',alignItems:'center',gap:5}}>
          <i data-lucide={tone==='danger'?'trending-down':'trending-up'} style={{width:13,height:13,color:tone==='danger'?'var(--danger)':'var(--success)'}}></i>
          <span style={{fontSize:12,fontWeight:600,color:tone==='danger'?'var(--danger)':'var(--success)',fontFamily:'var(--font-mono)'}}>{delta}</span>
          <span style={{fontSize:12,color:'var(--fg-subtle)'}}>vs p&eacute;riode pr&eacute;c.</span>
        </div>
      )}
    </div>
  );
}

function MeterRow({label,sub,value,pctVal,color='var(--accent)',icon,code}){
  return(
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'9px 0'}}>
      {code&&<span style={{width:26,height:18,flexShrink:0,display:'grid',placeItems:'center',fontSize:10,fontWeight:600,fontFamily:'var(--font-mono)',color:'var(--fg-muted)',background:'var(--bg-muted)',border:'1px solid var(--border)',borderRadius:4}}>{code}</span>}
      {icon&&<i data-lucide={icon} style={{width:16,height:16,color:'var(--fg-muted)',flexShrink:0}}></i>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8,marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:500,color:'var(--fg)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{label}{sub&&<span style={{color:'var(--fg-subtle)',fontWeight:400,marginLeft:6}}>{sub}</span>}</span>
          <span style={{display:'flex',alignItems:'baseline',gap:8,flexShrink:0}}>
            <span style={{fontSize:12,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)'}}>{value}</span>
            <span style={{fontSize:13,fontWeight:600,color:'var(--fg)',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',minWidth:42,textAlign:'right'}}>{pctVal}</span>
          </span>
        </div>
        <div style={{height:6,borderRadius:999,background:'var(--bg-muted)',overflow:'hidden'}}>
          <div style={{width:pctVal,height:'100%',borderRadius:999,background:color,transition:'width var(--dur-base) var(--ease)'}}></div>
        </div>
      </div>
    </div>
  );
}

// ============================================================ CHARTS
function TimeSeriesChart({series,height=240,accent='var(--accent)',gradId='ts-grad'}){
  const [hi,setHi]=useState(null);const wrapRef=useRef(null);
  const W=1000,H=1000,PL=4,PR=1,PT=6,PB=10;
  const pts=series.filter(s=>s.value!=null);const vals=pts.map(s=>s.value);
  const max=Math.max(10,...vals);const niceMax=Math.ceil(max/5)*5;const n=series.length;
  const xPct=i=>PL+(i*(100-PL-PR))/(n-1);const yPct=v=>PT+(1-v/niceMax)*(100-PT-PB);
  let dPath='',dArea='',firstX=null,lastX=null,started=false;
  series.forEach((s,i)=>{if(s.value==null)return;const x=xPct(i)*W/100,y=yPct(s.value)*H/100;if(!started){dPath+=`M ${x} ${y}`;firstX=x;started=true}else dPath+=` L ${x} ${y}`;lastX=x});
  const baseY=(100-PB)*H/100;if(started)dArea=dPath+` L ${lastX} ${baseY} L ${firstX} ${baseY} Z`;
  function onMove(e){const r=wrapRef.current.getBoundingClientRect();const relPct=(e.clientX-r.left)/r.width*100;let best=null,bd=1e9;series.forEach((s,i)=>{if(s.value==null)return;const d=Math.abs(xPct(i)-relPct);if(d<bd){bd=d;best=i}});setHi(best)}
  const gy=[0,.25,.5,.75,1];const hiPt=hi!=null?series[hi]:null;
  return(
    <div ref={wrapRef} style={{position:'relative',width:'100%',height}} onMouseMove={onMove} onMouseLeave={()=>setHi(null)}>
      {gy.map((g,i)=>{const topPct=PT+g*(100-PT-PB);const val=Math.round(niceMax*(1-g));return(
        <div key={i} style={{position:'absolute',left:0,right:0,top:`${topPct}%`,height:0}}>
          <div style={{position:'absolute',left:`${PL}%`,right:`${PR}%`,borderTop:i===gy.length-1?'1px solid var(--border)':'1px dashed var(--border-subtle)'}}></div>
          <div style={{position:'absolute',left:0,top:-8,width:`${PL}%`,paddingRight:8,textAlign:'right',fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums'}}>{fmt(val)}</div>
        </div>
      )})}
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',overflow:'visible'}}>
        <defs><linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3B9DF7" stopOpacity="0.20"/><stop offset="100%" stopColor="#3B9DF7" stopOpacity="0"/></linearGradient></defs>
        {dArea&&<path d={dArea} fill={`url(#${gradId})`}/>}
        {dPath&&<path d={dPath} fill="none" stroke={accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>}
        {hiPt&&hiPt.value!=null&&<line x1={xPct(hi)*W/100} x2={xPct(hi)*W/100} y1={PT*H/100} y2={baseY} stroke="var(--border-strong)" strokeWidth="1" strokeDasharray="3 3" vectorEffect="non-scaling-stroke"/>}
      </svg>
      {series.map((s,i)=>s.label?<div key={i} style={{position:'absolute',left:`${xPct(i)}%`,bottom:0,transform:'translateX(-50%)',fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>{s.label}</div>:null)}
      {hiPt&&hiPt.value!=null&&(
        <>

function Sparkline({series,width=96,height=30,color='var(--accent)'}){
  const pts=series.filter(s=>s.value!=null);const vals=pts.map(s=>s.value);
  const max=Math.max(1,...vals),min=Math.min(...vals);const n=pts.length;
  if(n<2)return <div style={{width,height}}></div>;
  const x=i=>(i*width)/(n-1);const y=v=>height-3-((v-min)/Math.max(1,max-min))*(height-6);
  const d=pts.map((s,i)=>`${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(s.value).toFixed(1)}`).join(' ');
  const area=d+` L ${width} ${height} L 0 ${height} Z`;
  return(
    <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} style={{display:'block'}}>
      <defs><linearGradient id="spk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3B9DF7" stopOpacity="0.18"/><stop offset="100%" stopColor="#3B9DF7" stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill="url(#spk)"/><path d={d} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function WorldMap({cities,total,height=440}){

  function reset(){if(!zoomRef.current||!svgRef.current||!initRef.current)return;d3.select(svgRef.current).transition().duration(360).call(zoomRef.current.transform,initRef.current)}
  useEffect(()=>{if(geo&&window.lucide)lucide.createIcons()},[geo,err]);
  const k=t?t.k:1;const maxClicks=Math.max(...cities.map(c=>c.clicks),1);const rBase=c=>4+Math.sqrt(c.clicks/maxClicks)*20;const rOf=c=>rBase(c)/k;
  const tstr=t?`translate(${t.x},${t.y}) scale(${t.k})`:'';

            {geo&&t&&cities.slice(0,5).map((c,i)=>{const p=geo.project([c.lon,c.lat]);if(!p)return null;return <g key={'h'+i} transform={`translate(${p[0]} ${p[1]})`}><circle r={rOf(c)} fill="var(--accent)" className="cz-pulse" style={{animationDelay:`${i*.45}s`}}/></g>})}
            {geo&&t&&cities.map((c,i)=>{const p=geo.project([c.lon,c.lat]);if(!p)return null;const r=rOf(c);const on=hi===i;return(
              <g key={i} transform={`translate(${p[0]} ${p[1]})`} style={{cursor:'pointer'}} onMouseEnter={()=>setHi(i)} onMouseLeave={()=>setHi(null)}>

              </g>

function dateRange(period){
  const now=new Date();
  let from;
  if(period==='hier'){from=new Date(now);from.setDate(from.getDate()-1);from.setHours(0,0,0,0);const to=new Date(from);to.setHours(23,59,59,999);return{from:from.toISOString(),to:to.toISOString()}}
  if(period==='ajd'){from=new Date(now);from.setHours(0,0,0,0);return{from:from.toISOString(),to:now.toISOString()}}
  from=new Date(now);
  const days=PERIODS.find(p=>p.value===period)?.days||7;
  from.setDate(from.getDate()-days);from.setHours(0,0,0,0);
  return{from:from.toISOString(),to:now.toISOString()};
}

async function fetchVisits(period,pageId){
  const {from,to}=dateRange(period);
  let q=sb.from('visits').select('*').gte('created_at',from).lte('created_at',to);
  if(pageId)q=q.eq('page_id',pageId);
  const {data}=await q;
  return data||[];
}

async function fetchPages(){
  const {data}=await sb.from('landing_pages').select('id,slug,data,created_at').order('created_at',{ascending:true});
  return data||[];
}

function buildTimeSeries(visits,period){
  const {from}=dateRange(period);const per=PERIODS.find(p=>p.value===period);
  const days=per.days;const buckets=days<=1?24:days;
  const series=Array.from({length:buckets},(_,i)=>({label:'',value:0}));
  visits.forEach(v=>{
    const d=new Date(v.created_at);
    if(days<=1){const h=d.getHours();if(h<buckets){series[h].value++;series[h].label=h%3===0?h+'h':''}}
    else{const diff=Math.floor((d-new Date(from))/(1000*60*60*24));if(diff>=0&&diff<buckets){series[diff].value++;if(buckets<=7)series[diff].label=['lun','mar','mer','jeu','ven','sam','dim'][(diff+new Date(from).getDay())%7];else if(diff%5===0)series[diff].label=(diff+1)+''}}
  });
  return series;
}

function groupBy(arr,key){const m={};arr.forEach(v=>{const k=v[key]||'Inconnu';m[k]=(m[k]||0)+1});return Object.entries(m).map(([k,v])=>({key:k,count:v})).sort((a,b)=>b.count-a.count)}

// ============================================================ DETAIL
function PageDetail({page,period,setPeriod}){
  const [visits,setVisits]=useState([]);const [loading,setLoading]=useState(true);
  useEffect(()=>{setLoading(true);fetchVisits(period,page.id).then(v=>{setVisits(v);setLoading(false)})},[period,page.id]);
  useEffect(()=>{if(window.lucide)lucide.createIcons()});

  const views=visits.filter(v=>v.type==='view');const clicks=visits.filter(v=>v.type==='click');
  const convRate=views.length?clicks.length/views.length:0;
  const countries=groupBy(visits,'country');
  const citiesRaw=groupBy(visits,'city');
  const devices=groupBy(visits,'device');
  const platforms=groupBy(visits,'platform');
  const series=buildTimeSeries(clicks,period);
  const per=PERIODS.find(p=>p.value===period);

  const cityData=citiesRaw.slice(0,10).map(c=>{const coords=CITY_COORDS[c.key];return{city:c.key,clicks:c.count,lat:coords?.lat||0,lon:coords?.lon||0}}).filter(c=>c.lat!==0);
  const deviceData=devices.map(d=>({key:d.key,label:DEVICE_LABELS[d.key]||d.key,clicks:d.count,color:DEVICE_COLORS[d.key]||'var(--border-strong)'}));

  if(loading)return <div style={{padding:60,textAlign:'center',color:'var(--fg-subtle)'}}><span className="cz-spin" style={{display:'inline-block',width:20,height:20,border:'2.5px solid var(--border-strong)',borderTopColor:'var(--accent)',borderRadius:'50%'}}></span></div>;

  return(
    <div style={{padding:'22px 24px 56px',background:'var(--bg)',minHeight:'calc(100vh - 56px)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,marginBottom:18,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{width:38,height:38,borderRadius:9,background:'var(--accent-soft)',display:'grid',placeItems:'center',flexShrink:0}}><i data-lucide="link" style={{width:18,height:18,color:'var(--accent-press)'}}></i></span>
          <div><div style={{fontSize:15,fontWeight:600}}>{page.data?.title||page.slug}</div><div style={{fontSize:12,color:'var(--fg-muted)',fontFamily:'var(--font-mono)'}}>sophiemercier.fr/{page.slug}</div></div>
        </div>
        <Segmented value={period} onChange={setPeriod} options={PERIODS.map(p=>({value:p.value,label:p.label}))}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:14}}>
        <StatCard emphasis icon="mouse-pointer-click" label="Clics" value={fmt(clicks.length)}/>
        <StatCard icon="eye" label="Vues" value={fmt(views.length)}/>
        <StatCard icon="percent" label="Conversion" value={(Math.round(convRate*1000)/10).toString().replace('.',',')} unit="%"/>
        <StatCard icon="globe" label="Pays" value={countries.length}/>
      </div>

      <Card style={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
          <div><div style={{fontSize:14,fontWeight:600}}>Clics dans le temps</div><div style={{fontSize:12,color:'var(--fg-muted)',marginTop:2}}>{per.label}</div></div>
        </div>
        <TimeSeriesChart series={series} height={210} gradId="dt-grad"/>
      </Card>

      <div style={{display:'grid',gridTemplateColumns:'1.62fr 1fr',gap:14,marginBottom:14}}>
        <Card>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div><div style={{fontSize:14,fontWeight:600}}>Localisation des clics</div><div style={{fontSize:12,color:'var(--fg-muted)',marginTop:2}}>{cityData.length} villes &middot; {countries.length} pays</div></div>
          </div>
          {cityData.length>0?<WorldMap cities={cityData} total={visits.length} height={420}/>:<div style={{height:420,display:'grid',placeItems:'center',color:'var(--fg-subtle)'}}>Pas encore de donnees geo</div>}
        </Card>
        <Card>
          <div style={{fontSize:14,fontWeight:600,marginBottom:4}}>Par pays</div>
          <div style={{fontSize:12,color:'var(--fg-muted)',marginBottom:8}}>Part des visites</div>
          <div style={{maxHeight:420,overflowY:'auto'}}>
            {countries.map(c=><MeterRow key={c.key} label={c.key} value={fmt(c.count)} pctVal={pct(c.count,visits.length)}/>)}
            {countries.length===0&&<div style={{padding:20,color:'var(--fg-subtle)',textAlign:'center'}}>—</div>}
          </div>
        </Card>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <Card>
          <div style={{fontSize:14,fontWeight:600,marginBottom:4}}>Par appareil</div>
          <div style={{fontSize:12,color:'var(--fg-muted)',marginBottom:16}}>Repartition des visites</div>
          {deviceData.length>0?<Donut data={deviceData}/>:<div style={{padding:20,color:'var(--fg-subtle)',textAlign:'center'}}>Pas de donnees</div>}
        </Card>
        <Card>
          <div style={{fontSize:14,fontWeight:600,marginBottom:4}}>Par source</div>
          <div style={{fontSize:12,color:'var(--fg-muted)',marginBottom:8}}>D'ou viennent vos visiteurs</div>
          <div>
            {platforms.map(p=><MeterRow key={p.key} label={p.key.charAt(0).toUpperCase()+p.key.slice(1)} value={fmt(p.count)} pctVal={pct(p.count,visits.length)} color={p.key==='instagram'?'var(--accent)':p.key==='tiktok'?'#0A0A0A':p.key==='snapchat'?'var(--orange)':'var(--info)'}/>)}
            {platforms.length===0&&<div style={{padding:20,color:'var(--fg-subtle)',textAlign:'center'}}>—</div>}
          </div>
        </Card>
      </div>
    </div>
  );
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function iconFor(url){
  if(!url)return'🔗';
  if(/t\.me|telegram/i.test(url))return'✈️';if(/instagram/i.test(url))return'📸';
  if(/snapchat/i.test(url))return'👻';if(/tiktok/i.test(url))return'🎵';
  if(/twitter|x\.com/i.test(url))return'🐦';if(/onlyfans/i.test(url))return'🔥';
  if(/youtube/i.test(url))return'▶️';return'🔗';
}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
function normalizeUrl(u){if(!u)return u;u=String(u).trim();if(!u)return u;if(/^[a-z]+:\/\//i.test(u))return u;return"https://"+u.replace(/^\/+/,"")}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function lIcon(name,size=14){return `<svg width="${size}" height="${size}" style="pointer-events:none"><use href="#"></use></svg>`}

  document.body.appendChild(drawer);

        <p class="hint">Configure le comportement special pour le reseau d'ou viennent tes visiteurs.</p>
        <div class="seg">
          <label><input type="radio" name="platform" value="auto" data-field="platform" ${(d.platform||"auto")==="auto"?"checked":""}><span class="opt">Auto</span></label>
          <label><input type="radio" name="platform" value="tiktok" data-field="platform" ${d.platform==="tiktok"?"checked":""}><span class="opt">TikTok</span></label>
          <label><input type="radio" name="platform" value="instagram" data-field="platform" ${d.platform==="instagram"?"checked":""}><span class="opt">Instagram</span></label>
          <label><input type="radio" name="platform" value="snapchat" data-field="platform" ${d.platform==="snapchat"?"checked":""}><span class="opt">Snapchat</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Ecran 18+ TikTok</legend>
        <div class="toggle-row">
          <input type="checkbox" data-field="tiktok_overlay" ${d.tiktok_overlay?"checked":""} id="cb_tt">
          <label for="cb_tt">Activer l'ecran 18+ uniquement pour les visiteurs TikTok</label>
        </div>
        <p class="hint">Quand active : si un visiteur arrive depuis TikTok, il verra un ecran 18+ qui le force a appuyer longtemps pour ouvrir le lien dans son vrai navigateur.</p>
        <label>Titre de l'ecran</label><input type="text" data-field="tiktok_title" value="${esc(d.tiktok_title||"Continuer vers mon contenu")}">
        <label>Sous-titre</label><textarea data-field="tiktok_subtitle">${esc(d.tiktok_subtitle||"Pour acceder au lien, ouvre la page dans ton navigateur.")}</textarea>
        <label>Texte du bouton</label><input type="text" data-field="tiktok_button" value="${esc(d.tiktok_button||"APPUI LONG POUR OUVRIR")}">
      </fieldset>
    `;
  } else if (tab === "settings") {
    area.innerHTML = `
      <fieldset>
        <legend>Apercu public</legend>
        <p class="hint">URL publique : <a href="/${esc(p.slug)}" target="_blank" style="color:var(--accent)">sophiemercier.fr/${esc(p.slug)}</a></p>
        <p class="hint">Lien de redirection masque : <code>/go/${esc(p.slug)}</code></p>
      </fieldset>
    `;
  }

  bindInputs(area);
}

function bindInputs(area) {
  area.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.field;
      const val = el.type === "checkbox" ? el.checked : (el.type === "radio" ? el.value : el.value);
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), [key]: val };
      const pick = area.querySelector('[data-pick="'+key+'"]');
      if (pick && el.type === "text" && /^#[0-9a-f]{6}$/i.test(val)) pick.value = val;
      scheduleSave(); updatePreview();
    });
  });
  area.querySelectorAll("[data-pick]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.pick;
      const val = el.value;
      const p = currentPage(); p.data = { ...(p.data||{}), [key]: val };
      const txt = area.querySelector('[data-field="'+key+'"]'); if (txt) txt.value = val;
      scheduleSave(); updatePreview();
    });
  });
  const slugInp = area.querySelector("[data-slug]");
  if (slugInp) slugInp.addEventListener("change", async e => {
    const newSlug = slugify(e.target.value);
    const p = currentPage();
    if (!newSlug) { e.target.value = p.slug; return; }
    if (newSlug === p.slug) return;
    p.slug = newSlug; e.target.value = newSlug;
    const h = document.getElementById("hint_slug"); if (h) h.textContent = newSlug;
    clearTimeout(drawerSaveTimer);
    await saveNow();
  });
  // Card style picker
  area.querySelectorAll(".cstyle-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.style;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), card_style: id };
      area.querySelectorAll(".cstyle-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Background presets
  area.querySelectorAll(".bg-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.bg;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), bg_style: id };
      area.querySelectorAll(".bg-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Theme presets
  area.querySelectorAll(".theme-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = THEMES.find(x => x.id === chip.dataset.theme); if (!t) return;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), c_rose: t.rose, c_deep: t.deep, c_ink: t.ink, c_inksoft: t.inksoft };
      const set = (k, v) => {
        const txt = area.querySelector('[data-field="'+k+'"]');
        const pick = area.querySelector('[data-pick="'+k+'"]');
        if (txt) txt.value = v; if (pick) pick.value = v;
      };
      set("c_rose",t.rose);set("c_deep",t.deep);set("c_ink",t.ink);set("c_inksoft",t.inksoft);
      area.querySelectorAll(".theme-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
    const t = THEMES.find(x => x.id === chip.dataset.theme);
    const p = currentPage(); const dd = p?.data || {};
    if (t && dd.c_rose===t.rose && dd.c_deep===t.deep && dd.c_ink===t.ink && dd.c_inksoft===t.inksoft) chip.classList.add("active");
  });
}

function scheduleSave() {
  setSaveStatus("Modification en attente...","saving");
  clearTimeout(drawerSaveTimer);
  drawerSaveTimer = setTimeout(saveNow, 600);
}

async function saveNow() {
  const p = currentPage(); if (!p) return;
  setSaveStatus("Sauvegarde...","saving");
  if (p.data?.url) {
    const normalized = normalizeUrl(p.data.url);
    if (normalized !== p.data.url) {
      p.data.url = normalized;
      const inp = document.querySelector('[data-field="url"]');
      if (inp) inp.value = normalized;
    }
  }
  const {error} = await sb.from("landing_pages").update({
    slug: p.slug, data: p.data, photo_path: p.photo_path, folder_id: p.folder_id
  }).eq("id", p.id);
  if (error) { setSaveStatus("Erreur: "+error.message); return; }
  setSaveStatus("Sauvegarde ✓","saved");
}

function setSaveStatus(text, cls) {
  const el = document.getElementById("save_status");
  if (!el) return;
  el.textContent = text;
  el.className = "status"+(cls?" "+cls:"");
}

function updatePreview() {
  const p = currentPage(); if (!p) return;
  const iframe = document.getElementById("preview");
  if (!iframe) return;
  const d = p.data || {};
  const enabledLinks = (p._links||[]).filter(l => l.enabled);
  // Build a simple preview
  const linksHtml = enabledLinks.map(l => `<a href="#" style="display:block;margin:6px 0;padding:12px 16px;background:rgba(255,255,255,.9);border-radius:12px;text-decoration:none;color:inherit;font-weight:600;font-size:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)">${esc(l.icon||iconFor(l.url))} ${esc(l.title)}</a>`).join("");
  iframe.srcdoc = `<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;background:${BACKGROUNDS.find(b=>b.id===(d.bg_style||"rose"))?.bg||"#e8f0fe"};color:${d.c_ink||"#1D1D1E"}}</style>
</head><body>
<div style="text-align:center;margin-bottom:20px">
  <div style="width:72px;height:72px;border-radius:50%;background:${d.c_rose||"#2D7FF9"};margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:700">${esc((d.name||p.slug||"?")[0].toUpperCase())}</div>
  <div style="font-size:16px;font-weight:700">${esc(d.name||p.slug)}</div>
  <div style="font-size:13px;color:${d.c_inksoft||"#808084"};margin-top:2px">${esc(d.handle||"")}</div>
  <div style="font-size:12px;color:${d.c_inksoft||"#808084"};margin-top:4px">${esc(d.sub||"")}</div>
</div>
<div style="width:100%;max-width:340px">
  <div style="background:rgba(255,255,255,.95);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)">
    ${d.tag?`<div style="display:inline-block;padding:3px 10px;border-radius:6px;background:${d.c_rose||"#2D7FF9"};color:#fff;font-size:11px;font-weight:600;margin-bottom:8px">${esc(d.tag)}</div>`:""}
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">${esc(d.card_title||"")}</div>
    <div style="font-size:12px;color:${d.c_inksoft||"#808084"};margin-bottom:10px">${esc(d.card_desc||"")}</div>
    <div style="background:${d.c_rose||"#2D7FF9"};color:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:600;font-size:14px">${esc(d.cta||"Ouvrir le lien")}</div>
  </div>
  ${linksHtml}
</div>
${d.kiss?`<div style="margin-top:20px;font-size:11px;color:${d.c_inksoft||"#808084"}">${esc(d.kiss)}</div>`:""}
</body></html>`;
}

// --- Links edit list
function renderLinksEditList() {
  const list = document.getElementById("links_list"); if (!list) return;
  const p = currentPage(); if (!p) return;
  const links = p._links || [];
  if (!links.length) {
    list.innerHTML = '<div class="link-edit-empty">Aucun lien additionnel. Clique <strong>+ Ajouter un lien</strong> pour en creer un.</div>';
    return;
  }
  list.innerHTML = links.map((l, idx) => `
    <div class="link-edit-row" data-id="${esc(l.id)}">
      <div class="link-edit-handle" title="Glisser pour reordonner">&#8286;&#8286;</div>
      <div class="link-edit-icon">${esc(l.icon || iconFor(l.url))}</div>
      <div class="link-edit-meta">
        <div class="link-edit-title">${esc(l.title)} ${l.enabled?"":'<span class="link-edit-off">desactive</span>'}</div>
        <div class="link-edit-sub">${l.username ? '<span class="link-edit-user">@'+esc(l.username.replace(/^@/,""))+'</span> · ' : ""}${esc(l.url)}</div>
      </div>
      <button class="link-edit-btn" data-act="up" ${idx===0?"disabled":""} title="Monter">&#x25B2;</button>
      <button class="link-edit-btn" data-act="down" ${idx===links.length-1?"disabled":""} title="Descendre">&#x25BC;</button>
      <button class="link-edit-btn" data-act="edit" title="Modifier">&#9998;</button>
      <button class="link-edit-btn" data-act="toggle" title="${l.enabled?"Desactiver":"Activer"}">${l.enabled?"&#x1F441;":"&#x1F6AB;"}</button>
      <button class="link-edit-btn danger" data-act="delete" title="Supprimer">&#x1F5D1;</button>
    </div>
  `).join("");
  list.querySelectorAll(".link-edit-row").forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", e => { e.stopPropagation(); onLinkAction(btn.dataset.act, id); });
    });
  });
}

async function onLinkAction(action, id) {
  const p = currentPage(); if (!p) return;
  const links = p._links || [];
  const idx = links.findIndex(l => l.id === id);
  if (idx < 0) return;
  const link = links[idx];

  if (action === "edit") return openLinkModal(link);
  if (action === "delete") {
    if (!confirm('Supprimer le lien "'+link.title+'" ?')) return;
    await sb.from("page_links").delete().eq("id", id);
    p._links = links.filter(l => l.id !== id);
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "toggle") {
    const newVal = !link.enabled;
    await sb.from("page_links").update({enabled: newVal}).eq("id", id);
    link.enabled = newVal;
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "up" || action === "down") {
    const swapIdx = action === "up" ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= links.length) return;
    const other = links[swapIdx];
    const linkPos = link.position, otherPos = other.position;
    await Promise.all([
      sb.from("page_links").update({position: otherPos}).eq("id", link.id),
      sb.from("page_links").update({position: linkPos}).eq("id", other.id)
    ]);
    link.position = otherPos; other.position = linkPos;
    p._links = [...links].sort((a,b) => a.position - b.position);
    renderLinksEditList(); updatePreview();
    return;
  }
}

function openLinkModal(link) {
  const editing = !!link;
  document.querySelectorAll(".modal-overlay").forEach(x=>x.remove());
  const overlay = document.createElement("div"); overlay.className = "modal-overlay";
  const modal = document.createElement("div"); modal.className = "modal";
  modal.innerHTML = `
    <h3>${editing ? "Modifier le lien" : "Nouveau lien"}</h3>
    <label>Titre du bouton</label>
    <input type="text" id="ml_title" placeholder="Ex: Mon Telegram" value="${editing?esc(link.title):""}">
    <label>URL</label>
    <input type="url" id="ml_url" placeholder="https://t.me/..." value="${editing?esc(link.url):""}">
    <label>Username du compte (interne, pour l'orga)</label>
    <input type="text" id="ml_username" placeholder="@sophie_xxx" value="${editing?esc(link.username||""):""}">
    <p class="hint">Le username n'apparait jamais sur la landing publique.</p>
    <label>Icone (1 emoji, optionnel)</label>
    <input type="text" id="ml_icon" maxlength="4" placeholder="auto" value="${editing?esc(link.icon||""):""}">
    <p class="hint">Laisse vide pour detection auto (Telegram = plane, Insta = camera, etc.)</p>
    <div class="modal-btns">
      <button class="btn" id="ml_cancel">Annuler</button>
      <button class="btn btn-primary" id="ml_submit">${editing ? "Enregistrer" : "Creer"}</button>
    </div>
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  document.getElementById("ml_cancel").addEventListener("click", () => overlay.remove());
  document.getElementById("ml_title").focus();
  document.getElementById("ml_submit").addEventListener("click", async () => {
    const title = document.getElementById("ml_title").value.trim();
    let url = document.getElementById("ml_url").value.trim();
    const username = document.getElementById("ml_username").value.trim();
    const icon = document.getElementById("ml_icon").value.trim() || null;
    if (!title || !url) return;
    url = normalizeUrl(url);
    const p = currentPage();
    if (editing) {
      const {error} = await sb.from("page_links").update({title, url, username, icon}).eq("id", link.id);
      if (error) { toast(error.message); return; }
      Object.assign(link, {title, url, username, icon});
    } else {
      const pos = (p._links||[]).length;
      const {data:row, error} = await sb.from("page_links").insert({
        page_id: p.id, title, url, username, icon, position: pos, enabled: true
      }).select().single();
      if (error) { toast(error.message); return; }
      p._links = [...(p._links||[]), row];
    }
    overlay.remove();
    renderLinksEditList(); updatePreview();
    toast(editing ? "Lien modifie" : "Lien ajoute");
  });
}

async function onDeleteCurrentPage() {
  const p = currentPage(); if (!p) return;
  if (!confirm('Supprimer la page "'+p.slug+'" definitivement ?')) return;
  await sb.from("landing_pages").delete().eq("id", p.id);
  closePageDrawer();
  toast("Page supprimee");
  // Reload the page list
  setTimeout(() => window.location.reload(), 500);
}
// ============================================================ APP
function TopBar({title,subtitle,back}){
  return(
    <header style={{height:56,padding:'0 24px',display:'flex',alignItems:'center',gap:14,borderBottom:'1px solid var(--border)',background:'rgb(250 250 249/.85)',backdropFilter:'blur(8px)',position:'sticky',top:0,zIndex:20}}>
      {back&&<button onClick={back} title="Retour" style={{width:32,height:32,marginLeft:-4,display:'grid',placeItems:'center',borderRadius:8,border:'1px solid var(--border)',background:'#fff',cursor:'pointer',color:'var(--fg-muted)',flexShrink:0}}><i data-lucide="arrow-left" style={{width:16,height:16}}></i></button>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:15,fontWeight:600,letterSpacing:'-0.01em'}}>{title}</div>
        {subtitle&&<div style={{fontSize:12,color:'var(--fg-muted)',marginTop:1}}>{subtitle}</div>}
      </div>
    </header>
  );
}

function App(){
  const [view,setView]=useState('overview');const [page,setPage]=useState(null);const [period,setPeriod]=useState('7j');
  useEffect(()=>{if(window.lucide)lucide.createIcons()});
  function openPage(p){setPage(p);setView('detail');window.scrollTo(0,0)}
  function back(){setView('overview');setPage(null)}
  function openEdit(p){openPageDrawer(p)}
  let title,subtitle,backFn=null,screen;
  if(view==='detail'&&page){title=page.data?.title||page.slug;subtitle='Analytics de la page';backFn=back;screen=<PageDetail page={page} period={period} setPeriod={setPeriod}/>}
  else{title='Mes pages';subtitle='Suivi des clics sur vos pages';screen=<LinksOverview period={period} setPeriod={setPeriod} onOpen={openPage} onEdit={openEdit}/>}
  return(
    <div style={{minHeight:'100vh',maxWidth:1320,margin:'0 auto'}}>
      <TopBar title={title} subtitle={subtitle} back={backFn}/>
      {screen}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
