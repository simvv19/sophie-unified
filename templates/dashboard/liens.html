<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liens — Analytics · ConquerorZ</title>
<link rel="icon" type="image/svg+xml" href="/static/assets/logo-conquerorz.svg">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<style>
:root {
  --bg:#FAFAF9;--bg-elevated:#FFFFFF;--bg-muted:#F4F3F1;--bg-sunken:#EFEDE9;
  --border:#E8E6E1;--border-strong:#D4D1CB;--border-subtle:#F0EEEA;
  --fg:#0A0A0A;--fg-muted:#5C5A55;--fg-subtle:#8A8780;--fg-on-accent:#FFFFFF;
  --accent:#3B9DF7;--accent-hover:#1F7BD6;--accent-press:#1565B8;--accent-soft:#E4F1FE;--accent-soft-hover:#D0E5FC;
  --orange:#FF9500;--orange-soft:#FFF1DC;
  --success:#1F8A3C;--success-soft:#E3F4E7;--warning:#B8860B;--warning-soft:#FBF1D7;
  --danger:#D8241A;--danger-soft:#FBE0DE;--info:#2563EB;--info-soft:#DDE8FE;
  --font-sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --text-xs:12px;--text-sm:13px;--text-base:14px;--text-md:16px;--text-lg:18px;--text-xl:22px;--text-2xl:28px;
  --shadow-xs:0 1px 2px rgb(0 0 0/.04);--shadow-sm:0 1px 3px rgb(0 0 0/.06),0 1px 2px rgb(0 0 0/.04);
  --shadow-md:0 4px 12px rgb(0 0 0/.08);--shadow-lg:0 12px 32px rgb(0 0 0/.12);
  --ease:cubic-bezier(.2,0,0,1);--dur-micro:120ms;--dur-base:280ms;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--fg);font-size:var(--text-base);
  -webkit-font-smoothing:antialiased;line-height:1.5}
.cz-row:hover{background:var(--bg-muted)}
.cz-pulse{transform-box:fill-box;transform-origin:center;animation:czpulse 2.6s var(--ease) infinite}
@keyframes czpulse{0%{transform:scale(1);opacity:.42}70%{transform:scale(3.2);opacity:0}100%{transform:scale(3.2);opacity:0}}
.cz-spin{animation:czspin .8s linear infinite}
@keyframes czspin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--bg-elevated)}

/* ========== DRAWER ========== */
@keyframes dFade{from{opacity:0}to{opacity:1}}
@keyframes dSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-overlay{position:fixed;inset:0;background:rgba(10,11,36,.4);backdrop-filter:blur(4px);z-index:100;animation:dFade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(960px,100vw);background:#fff;z-index:101;display:grid;grid-template-columns:1fr 480px;animation:dSlide .25s cubic-bezier(.2,.9,.3,1)}
.drawer-form{overflow-y:auto;padding:22px 24px 110px;border-right:1px solid var(--border)}
.drawer-preview{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
.drawer-preview iframe{width:380px;height:calc(100vh - 40px);max-height:780px;border:none;border-radius:22px;box-shadow:0 20px 40px -16px rgba(10,11,36,.25);background:#fff}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drawer-head h2{font-family:'Geist',system-ui,sans-serif;font-weight:600;font-size:20px;margin:0;letter-spacing:-.48px}
.drawer-head .x{background:none;border:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--fg-muted);font-size:22px;line-height:1}
.drawer-head .x:hover{background:#f6f6f8}
.drawer-tabs{display:flex;gap:4px;padding:4px;background:#f0f0f5;border-radius:12px;margin-bottom:18px}
.drawer-tabs button{flex:1;background:transparent;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#6B6B6E;font-family:inherit}
.drawer-tabs button.active{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.06);font-weight:600}
.drawer-save{position:absolute;bottom:0;left:0;right:480px;background:#fff;border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px}
.drawer-save .status{flex:1;font-size:12.5px;color:var(--fg-muted)}
.drawer-save .status.saving{color:var(--accent)}
.drawer-save .status.saved{color:#34c759}
.drawer fieldset{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.drawer fieldset legend{font-size:14px;font-weight:600;padding:0 8px;color:var(--fg)}
.drawer fieldset label{display:block;font-size:12.5px;font-weight:500;color:var(--fg-muted);margin:10px 0 4px}
.drawer fieldset input[type="text"],.drawer fieldset input[type="url"],.drawer fieldset textarea,.drawer fieldset select{width:100%;height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#fff}
.drawer fieldset textarea{height:auto;padding:10px 12px;resize:vertical}
.drawer fieldset .hint{font-size:11.5px;color:var(--fg-subtle);margin:4px 0 0}
.drawer fieldset .slug-row{display:flex;align-items:center}
.drawer fieldset .slug-row .prefix{padding:0 10px;height:36px;display:flex;align-items:center;background:var(--bg-muted);border:1px solid var(--border-strong);border-right:none;border-radius:8px 0 0 8px;font-size:12px;color:var(--fg-subtle);white-space:nowrap}
.drawer fieldset .slug-row input{border-radius:0 8px 8px 0}
.drawer fieldset .toggle-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.drawer fieldset .toggle-row label{margin:0;cursor:pointer;font-size:13px}
.drawer fieldset .color-row{display:flex;align-items:center;gap:8px}
.drawer fieldset .color-row input[type="color"]{width:36px;height:36px;border:1px solid var(--border-strong);border-radius:8px;padding:2px;cursor:pointer}
.drawer fieldset .color-row input[type="text"]{flex:1}
.drawer fieldset .photo-row{display:flex;align-items:center;gap:12px;margin:4px 0}
.drawer fieldset .photo-preview{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
.drawer .seg{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.drawer .seg label{flex:1;cursor:pointer;text-align:center}
.drawer .seg label input{display:none}
.drawer .seg label .opt{display:block;padding:8px 10px;font-size:13px;font-weight:500;color:var(--fg-muted)}
.drawer .seg label input:checked+.opt{background:var(--accent);color:#fff;font-weight:600}

/* Link edit list */
.link-edit-empty{padding:24px;text-align:center;color:var(--fg-muted);background:#f6f6f8;border:1px dashed var(--border);border-radius:12px;font-size:13.5px}
.link-edit-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
.link-edit-handle{color:var(--fg-muted);font-size:14px;cursor:grab}
.link-edit-icon{width:32px;height:32px;border-radius:8px;background:#f6f6f8;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.link-edit-meta{flex:1;min-width:0}
.link-edit-title{font-weight:600;font-size:13.5px;color:var(--fg);display:flex;align-items:center;gap:6px}
.link-edit-off{font-size:10px;padding:1px 6px;border-radius:4px;background:#e8e8ec;color:#8a7a90;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.link-edit-sub{font-size:11.5px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.link-edit-user{color:var(--accent);font-weight:600}
.link-edit-stats{font-size:11px;color:var(--accent);background:#f0f0f5;padding:3px 8px;border-radius:999px;font-weight:600;flex:none}
.link-edit-btn{background:none;border:1px solid var(--border);width:28px;height:28px;border-radius:7px;cursor:pointer;color:var(--fg-subtle);font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.link-edit-btn:hover:not(:disabled){background:#f6f6f8;color:var(--fg)}
.link-edit-btn:disabled{opacity:.3;cursor:not-allowed}
.link-edit-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}

/* Theme / Card style / Background grids */
.theme-grid{display:flex;gap:8px;flex-wrap:wrap}
.theme-chip{border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.theme-chip.active{border-color:var(--accent)}
.theme-grad{width:40px;height:40px;border-radius:8px;display:block}
.theme-name{font-size:10px;color:var(--fg-muted);font-weight:500}
.cstyle-grid,.bg-grid{display:flex;gap:8px;flex-wrap:wrap}
.cstyle-chip,.bg-chip{border:2px solid transparent;border-radius:10px;padding:6px;cursor:pointer;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:72px}
.cstyle-chip.active,.bg-chip.active{border-color:var(--accent)}
.cstyle-mini{width:48px;height:32px;border-radius:6px;background:#f0f0f5;border:1px solid var(--border)}
.bg-preview{width:48px;height:32px;border-radius:6px;border:1px solid var(--border)}
.cstyle-name,.bg-name{font-size:10px;color:var(--fg-muted);font-weight:500}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,11,36,.4);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;animation:dFade .2s}
.modal{background:#fff;border-radius:16px;padding:24px;width:420px;max-width:92vw;box-shadow:0 20px 40px -16px rgba(10,11,36,.25);z-index:201}
.modal h3{font-size:18px;font-weight:600;margin:0 0 16px}
.modal label{display:block;font-size:12.5px;font-weight:500;color:var(--fg-muted);margin:10px 0 4px}
.modal input[type="text"],.modal input[type="url"]{width:100%;height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.modal .hint{font-size:11.5px;color:var(--fg-subtle);margin:4px 0 0}
.modal .modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* Btn styles for drawer */
.btn{height:36px;padding:0 18px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;border:1px solid var(--border-strong);background:#fff;color:var(--fg)}
.btn:hover{background:var(--bg-muted)}
.btn-primary{background:var(--accent);color:#fff;border:none}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;animation:dFade .2s}

@media(max-width:768px){
  .drawer{grid-template-columns:1fr;width:100vw}
  .drawer-preview{display:none}
  .drawer-save{right:0}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ============================================================ SUPABASE
const sb = window.supabase.createClient(
  "https://sfaxubipmidysfvtfvdx.supabase.co",
  "sb_publishable_lRUeA0F7gERIq5SdUcLEWA_p5czx1uv"
);

// ============================================================ HELPERS
function fmt(n){n=Math.round(n);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function pct(x,total){if(!total)return '0 %';return (Math.round((x/total)*1000)/10).toString().replace('.',',')+' %'}

// ============================================================ ATOMS
function Button({variant='primary',size='md',icon,children,...rest}){
  const s={
    base:{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,borderRadius:8,fontFamily:'inherit',fontWeight:500,border:'1px solid transparent',cursor:'pointer',transition:'background var(--dur-micro) var(--ease)',whiteSpace:'nowrap'},
    primary:{background:'var(--accent)',color:'#fff'},
    secondary:{background:'#fff',color:'var(--fg)',borderColor:'var(--border-strong)'},
    ghost:{background:'transparent',color:'var(--fg)'},
    sm:{height:28,padding:'0 10px',fontSize:13},md:{height:36,padding:'0 14px',fontSize:14},lg:{height:44,padding:'0 20px',fontSize:15},
  };
  return <button {...rest} style={{...s.base,...s[variant],...s[size],...(rest.style||{})}}>{icon&&<i data-lucide={icon} style={{width:14,height:14}}></i>}{children}</button>;
}

function Badge({tone='neutral',dot,children,style}){
  const tones={success:{background:'var(--success-soft)',color:'var(--success)'},orange:{background:'var(--orange-soft)',color:'var(--warning)'},danger:{background:'var(--danger-soft)',color:'var(--danger)'},accent:{background:'var(--accent-soft)',color:'var(--accent-press)'},info:{background:'var(--info-soft)',color:'var(--info)'},neutral:{background:'var(--bg-muted)',color:'var(--fg-muted)'}};
  return <span style={{display:'inline-flex',alignItems:'center',gap:6,height:22,padding:'0 8px',borderRadius:4,fontSize:11,fontWeight:600,letterSpacing:'0.04em',...tones[tone],...(style||{})}}>{dot&&<span style={{width:6,height:6,borderRadius:'50%',background:tones[tone]?.color}}></span>}{children}</span>;
}

function Segmented({options,value,onChange}){
  return(
    <div style={{display:'inline-flex',padding:2,gap:2,background:'var(--bg-muted)',border:'1px solid var(--border)',borderRadius:9}}>
      {options.map(o=>{const on=o.value===value;return(
        <button key={o.value} onClick={()=>onChange(o.value)} style={{height:34,padding:'0 12px',borderRadius:7,border:'none',cursor:'pointer',font:'inherit',fontSize:13,fontWeight:on?600:500,color:on?'var(--fg)':'var(--fg-muted)',background:on?'#fff':'transparent',boxShadow:on?'var(--shadow-xs)':'none',transition:'background var(--dur-micro) var(--ease)'}}>{o.label}</button>
      )})}
    </div>
  );
}

function Card({children,style,pad=20}){
  return <div style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',borderRadius:12,boxShadow:'var(--shadow-sm)',padding:pad,...(style||{})}}>{children}</div>;
}

function StatCard({label,value,unit,delta,tone='success',emphasis,icon}){
  return(
    <div style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',borderRadius:12,boxShadow:'var(--shadow-sm)',padding:18,position:'relative',overflow:'hidden',outline:emphasis?'1px solid var(--accent-soft)':'none'}}>
      {emphasis&&<div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,var(--accent-soft) 0%,transparent 42%)',opacity:.5,pointerEvents:'none'}}></div>}
      <div style={{position:'relative',display:'flex',alignItems:'center',gap:7}}>
        {icon&&<i data-lucide={icon} style={{width:14,height:14,color:emphasis?'var(--accent)':'var(--fg-subtle)'}}></i>}
        <span style={{fontSize:12,color:'var(--fg-muted)',fontWeight:500}}>{label}</span>
      </div>
      <div style={{position:'relative',display:'flex',alignItems:'baseline',gap:8,marginTop:9}}>
        <span style={{fontSize:30,fontWeight:600,letterSpacing:'-0.02em',fontVariantNumeric:'tabular-nums',lineHeight:1}}>{value}{unit&&<span style={{fontSize:16,color:'var(--fg-muted)',fontWeight:500,marginLeft:2}}>{unit}</span>}</span>
      </div>
      {delta!=null&&(
        <div style={{position:'relative',marginTop:10,display:'flex',alignItems:'center',gap:5}}>
          <i data-lucide={tone==='danger'?'trending-down':'trending-up'} style={{width:13,height:13,color:tone==='danger'?'var(--danger)':'var(--success)'}}></i>
          <span style={{fontSize:12,fontWeight:600,color:tone==='danger'?'var(--danger)':'var(--success)',fontFamily:'var(--font-mono)'}}>{delta}</span>
          <span style={{fontSize:12,color:'var(--fg-subtle)'}}>vs p&eacute;riode pr&eacute;c.</span>
        </div>
      )}
    </div>
  );
}

function MeterRow({label,sub,value,pctVal,color='var(--accent)',icon,code}){
  return(
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'9px 0'}}>
      {code&&<span style={{width:26,height:18,flexShrink:0,display:'grid',placeItems:'center',fontSize:10,fontWeight:600,fontFamily:'var(--font-mono)',color:'var(--fg-muted)',background:'var(--bg-muted)',border:'1px solid var(--border)',borderRadius:4}}>{code}</span>}
      {icon&&<i data-lucide={icon} style={{width:16,height:16,color:'var(--fg-muted)',flexShrink:0}}></i>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8,marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:500,color:'var(--fg)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{label}{sub&&<span style={{color:'var(--fg-subtle)',fontWeight:400,marginLeft:6}}>{sub}</span>}</span>
          <span style={{display:'flex',alignItems:'baseline',gap:8,flexShrink:0}}>
            <span style={{fontSize:12,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)'}}>{value}</span>
            <span style={{fontSize:13,fontWeight:600,color:'var(--fg)',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums',minWidth:42,textAlign:'right'}}>{pctVal}</span>
          </span>
        </div>
        <div style={{height:6,borderRadius:999,background:'var(--bg-muted)',overflow:'hidden'}}>
          <div style={{width:pctVal,height:'100%',borderRadius:999,background:color,transition:'width var(--dur-base) var(--ease)'}}></div>
        </div>
      </div>
    </div>
  );
}

// ============================================================ CHARTS
function TimeSeriesChart({series,height=240,accent='var(--accent)',gradId='ts-grad'}){
  const [hi,setHi]=useState(null);const wrapRef=useRef(null);
  const W=1000,H=1000,PL=4,PR=1,PT=6,PB=10;
  const pts=series.filter(s=>s.value!=null);const vals=pts.map(s=>s.value);
  const max=Math.max(10,...vals);const niceMax=Math.ceil(max/5)*5;const n=series.length;
  const xPct=i=>PL+(i*(100-PL-PR))/(n-1);const yPct=v=>PT+(1-v/niceMax)*(100-PT-PB);
  let dPath='',dArea='',firstX=null,lastX=null,started=false;
  series.forEach((s,i)=>{if(s.value==null)return;const x=xPct(i)*W/100,y=yPct(s.value)*H/100;if(!started){dPath+=`M ${x} ${y}`;firstX=x;started=true}else dPath+=` L ${x} ${y}`;lastX=x});
  const baseY=(100-PB)*H/100;if(started)dArea=dPath+` L ${lastX} ${baseY} L ${firstX} ${baseY} Z`;
  function onMove(e){const r=wrapRef.current.getBoundingClientRect();const relPct=(e.clientX-r.left)/r.width*100;let best=null,bd=1e9;series.forEach((s,i)=>{if(s.value==null)return;const d=Math.abs(xPct(i)-relPct);if(d<bd){bd=d;best=i}});setHi(best)}
  const gy=[0,.25,.5,.75,1];const hiPt=hi!=null?series[hi]:null;
  return(
    <div ref={wrapRef} style={{position:'relative',width:'100%',height}} onMouseMove={onMove} onMouseLeave={()=>setHi(null)}>
      {gy.map((g,i)=>{const topPct=PT+g*(100-PT-PB);const val=Math.round(niceMax*(1-g));return(
        <div key={i} style={{position:'absolute',left:0,right:0,top:`${topPct}%`,height:0}}>
          <div style={{position:'absolute',left:`${PL}%`,right:`${PR}%`,borderTop:i===gy.length-1?'1px solid var(--border)':'1px dashed var(--border-subtle)'}}></div>
          <div style={{position:'absolute',left:0,top:-8,width:`${PL}%`,paddingRight:8,textAlign:'right',fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums'}}>{fmt(val)}</div>
        </div>
      )})}
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',overflow:'visible'}}>
        <defs><linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3B9DF7" stopOpacity="0.20"/><stop offset="100%" stopColor="#3B9DF7" stopOpacity="0"/></linearGradient></defs>
        {dArea&&<path d={dArea} fill={`url(#${gradId})`}/>}
        {dPath&&<path d={dPath} fill="none" stroke={accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>}
        {hiPt&&hiPt.value!=null&&<line x1={xPct(hi)*W/100} x2={xPct(hi)*W/100} y1={PT*H/100} y2={baseY} stroke="var(--border-strong)" strokeWidth="1" strokeDasharray="3 3" vectorEffect="non-scaling-stroke"/>}
      </svg>
      {series.map((s,i)=>s.label?<div key={i} style={{position:'absolute',left:`${xPct(i)}%`,bottom:0,transform:'translateX(-50%)',fontSize:11,color:'var(--fg-subtle)',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>{s.label}</div>:null)}
      {hiPt&&hiPt.value!=null&&(

function Sparkline({series,width=96,height=30,color='var(--accent)'}){
  const pts=series.filter(s=>s.value!=null);const vals=pts.map(s=>s.value);
  const max=Math.max(1,...vals),min=Math.min(...vals);const n=pts.length;
  if(n<2)return <div style={{width,height}}></div>;
  const x=i=>(i*width)/(n-1);const y=v=>height-3-((v-min)/Math.max(1,max-min))*(height-6);
  const d=pts.map((s,i)=>`${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(s.value).toFixed(1)}`).join(' ');
  const area=d+` L ${width} ${height} L 0 ${height} Z`;
  return(
    <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} style={{display:'block'}}>

      <path d={area} fill="url(#spk)"/><path d={d} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function dateRange(period){
  const now=new Date();
  let from;
  if(period==='hier'){from=new Date(now);from.setDate(from.getDate()-1);from.setHours(0,0,0,0);const to=new Date(from);to.setHours(23,59,59,999);return{from:from.toISOString(),to:to.toISOString()}}
  if(period==='ajd'){from=new Date(now);from.setHours(0,0,0,0);return{from:from.toISOString(),to:now.toISOString()}}
  from=new Date(now);
  const days=PERIODS.find(p=>p.value===period)?.days||7;
  from.setDate(from.getDate()-days);from.setHours(0,0,0,0);
  return{from:from.toISOString(),to:now.toISOString()};
}

async function fetchVisits(period,pageId){
  const {from,to}=dateRange(period);
  // Supabase caps each response at 1000 rows, so paginate to get them all.
  const all=[];const CHUNK=1000;let offset=0;
  while(true){
    let q=sb.from('visits').select('*').gte('created_at',from).lte('created_at',to)
      .order('created_at',{ascending:true}).range(offset,offset+CHUNK-1);
    if(pageId)q=q.eq('page_id',pageId);
    const {data,error}=await q;
    if(error||!data||!data.length)break;
    all.push(...data);
    if(data.length<CHUNK)break;
    offset+=CHUNK;
  }
  return all;
}

async function fetchPages(){
  const {data}=await sb.from('landing_pages').select('id,slug,data,created_at').order('created_at',{ascending:true});
  return data||[];
}

function buildTimeSeries(visits,period){
  const {from}=dateRange(period);const per=PERIODS.find(p=>p.value===period);
  const days=per.days;const buckets=days<=1?24:days;
  const series=Array.from({length:buckets},(_,i)=>({label:'',value:0}));
  visits.forEach(v=>{
    const d=new Date(v.created_at);
    if(days<=1){const h=d.getHours();if(h<buckets){series[h].value++;series[h].label=h%3===0?h+'h':''}}
    else{const diff=Math.floor((d-new Date(from))/(1000*60*60*24));if(diff>=0&&diff<buckets){series[diff].value++;if(buckets<=7)series[diff].label=['lun','mar','mer','jeu','ven','sam','dim'][(diff+new Date(from).getDay())%7];else if(diff%5===0)series[diff].label=(diff+1)+''}}
  });
  return series;
}

function groupBy(arr,key){const m={};arr.forEach(v=>{const k=v[key]||'Inconnu';m[k]=(m[k]||0)+1});return Object.entries(m).map(([k,v])=>({key:k,count:v})).sort((a,b)=>b.count-a.count)}

function slugify(s){return s.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
function normalizeUrl(u){if(!u)return u;u=String(u).trim();if(!u)return u;if(/^[a-z]+:\/\//i.test(u))return u;return"https://"+u.replace(/^\/+/,"")}

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"") + "k";
  return String(n);
}

const STAT_PERIODS = [
  {id:"ajd", label:"Aujourd'hui", days:1},
  {id:"hier", label:"Hier", days:1},
  {id:"7j", label:"7 jours", days:7},
  {id:"30j", label:"30 jours", days:30},
  {id:"3mois", label:"3 mois", days:91},
];
let statPeriod = "7j";

function statDateRange(pid) {
  const now = new Date();
  const per = STAT_PERIODS.find(p=>p.id===pid) || STAT_PERIODS[2];
  let from;
  if (pid==="hier") { from=new Date(now); from.setDate(from.getDate()-1); from.setHours(0,0,0,0); const to=new Date(from); to.setHours(23,59,59,999); return {from:from.toISOString(),to:to.toISOString(),days:1}; }
  if (pid==="ajd") { from=new Date(now); from.setHours(0,0,0,0); return {from:from.toISOString(),to:now.toISOString(),days:1}; }
  from=new Date(now); from.setDate(from.getDate()-per.days); from.setHours(0,0,0,0);
  return {from:from.toISOString(),to:now.toISOString(),days:per.days};
}

function statGroupBy(arr, key) {
  const m={};
  arr.forEach(v=>{ const k=v[key]||"Inconnu"; m[k]=(m[k]||0)+1; });
  return Object.entries(m).map(([k,v])=>({key:k,count:v})).sort((a,b)=>b.count-a.count);
}

function statBarHTML(items, total, color) {
  if (!items.length) return `<div style="padding:12px 0;color:var(--muted);font-size:13px">Aucune donnée</div>`;
  return items.slice(0,8).map(it => {
    const pctVal = total ? Math.round((it.count/total)*100) : 0;
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:7px 0">
        <span style="flex:1;font-size:13px;font-weight:500">${esc(it.key)}</span>

        <span style="font-size:12px;font-weight:600;font-family:ui-monospace,monospace;min-width:40px;text-align:right">${pctVal}%</span>
      </div>
      <div style="height:5px;border-radius:99px;background:#f0f0f5;overflow:hidden;margin-bottom:2px">
        <div style="width:${pctVal}%;height:100%;border-radius:99px;background:${color};transition:width .3s"></div>
      </div>`;
  }).join("");
}

function statMiniChart(visits, range) {
  const days = range.days;
  const buckets = days <= 1 ? 24 : days;
  const counts = Array(buckets).fill(0);
  const from = new Date(range.from);
  visits.forEach(v => {
    const d = new Date(v.created_at);
    if (days <= 1) { const h=d.getHours(); if(h<buckets) counts[h]++; }
    else { const diff=Math.floor((d-from)/(1000*60*60*24)); if(diff>=0&&diff<buckets) counts[diff]++; }
  });
  const max = Math.max(1,...counts);
  const W=600, H=80, P=4;
  const gap = buckets>60?1:buckets>30?2:3;
  const bw = Math.max(2,(W-P*2-gap*(buckets-1))/buckets);
  let bars = "";
  counts.forEach((c,i)=>{
    const bh = c>0?Math.max(2,(c/max)*(H-10)):1;
    const x = P+i*(bw+gap);
    const y = H-bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${c>0?'var(--admin)':'#e0e0e5'}" opacity="${c>0?0.85:0.4}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">${bars}</svg>`;
}

      </div>
      <div style="background:#f6f6f8;border:1px solid var(--border);border-radius:12px;padding:14px">
        <div style="font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px">Vues</div>
        <div style="font-size:26px;font-weight:600;letter-spacing:-.02em">${formatNum(views.length)}</div>
      </div>
      <div style="background:#f6f6f8;border:1px solid var(--border);border-radius:12px;padding:14px">
        <div style="font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px">Conversion</div>
        <div style="font-size:26px;font-weight:600;letter-spacing:-.02em">${convRate.toString().replace(".",",")}%</div>
      </div>
    </div>

    <div style="background:#f6f6f8;border:1px solid var(--border);border-radius:12px;padding:14px 14px 8px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Clics · ${esc(perLabel)}</div>

async function onPhotoUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) { toast("Image > 5 Mo"); return; }
  setSaveStatus("Upload…", "saving");
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${currentPage().slug}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from("landing_photos").upload(path, file, { upsert: true, contentType: file.type });
  if (error) { toast(error.message); return; }
  const old = currentPage().photo_path;
  if (old && old !== path) { try { await sb.storage.from("landing_photos").remove([old]); } catch(_) {} }
  currentPage().photo_path = path;
  document.getElementById("photo_preview").src = sb.storage.from("landing_photos").getPublicUrl(path).data.publicUrl;
  await saveNow(); updatePreview();
}

  .photo-preview { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.08); background: #e8e8ec; }
  .photo-row { display: flex; align-items: center; gap: 12px; }
  .photo-row button { background: #fff; border: 1px solid var(--border); color: #6B6B6E; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer; font-weight: 500; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .toggle-row input { margin: 0; }
  .toggle-row label { margin: 0; font-size: 13px; cursor: pointer; }
  .slug-row { display: flex; gap: 8px; align-items: center; }
  .slug-row .prefix { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
  .slug-row input { flex: 1; }
  .hint { font-size: 11.5px; color: #9B9B9E; margin-top: 6px; line-height: 1.4; }

  /* Clicks chart */
  .chart-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; margin-bottom: 20px; box-shadow: rgba(10,11,36,0.016) 0px 3px 4px -2px; }
  .chart-card.chart-loading { color: var(--muted); text-align: center; font-size: 13.5px; padding: 30px; }
  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .chart-head h3 { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 18px; margin: 0 0 2px; letter-spacing: -0.48px; }
  .chart-head p { font-size: 12.5px; color: var(--muted); margin: 0; }
  .period-tabs { display: inline-flex; gap: 2px; padding: 3px; background: #f0f0f5; border-radius: 10px; flex-wrap: wrap; }
  .period-tab { background: transparent; border: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500; color: #6B6B6E; }
  .period-tab:hover { color: var(--ink); }
  .period-tab.active { background: #fff; color: var(--admin-deep); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .chart-platforms { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 6px; }
  .cplat { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-soft); background: #f6f6f8; padding: 4px 10px; border-radius: 999px; }
  .cplat .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--admin-deep)); }
  .cplat strong { color: var(--ink); font-weight: 700; margin-left: 2px; }
  .chart-area { margin: 4px 0 14px; }
  .chart-top { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--border); }
  .chart-top h4 { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 8px; }
  .chart-row { display: grid; grid-template-columns: 90px 1fr 40px; gap: 10px; align-items: center; padding: 4px 0; font-size: 12.5px; }
  .chart-slug { font-family: ui-monospace, monospace; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart-bar { height: 8px; background: #f6f6f8; border-radius: 999px; overflow: hidden; }
  .chart-bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--admin), var(--admin-deep)); border-radius: 999px; }
  .chart-n { text-align: right; color: var(--admin-deep); font-weight: 600; font-size: 12px; }

  /* Links edit list (inside drawer) */
  .links-edit-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .link-edit-empty { padding: 24px; text-align: center; color: var(--muted); background: #f6f6f8; border: 1px dashed var(--border); border-radius: 12px; font-size: 13.5px; }
  .link-edit-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
  .link-edit-handle { color: var(--muted); font-size: 14px; cursor: grab; }
  .link-edit-icon { width: 32px; height: 32px; border-radius: 8px; background: #f6f6f8; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .link-edit-meta { flex: 1; min-width: 0; }
  .link-edit-title { font-weight: 600; font-size: 13.5px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .link-edit-off { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #e8e8ec; color: #8a7a90; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
  .link-edit-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .link-edit-user { color: var(--admin-deep); font-weight: 600; }
  .link-edit-stats { font-size: 11px; color: var(--admin-deep); background: #f0f0f5; padding: 3px 8px; border-radius: 999px; font-weight: 600; flex: none; }
  .link-edit-btn { background: none; border: 1px solid var(--border); width: 28px; height: 28px; border-radius: 7px; cursor: pointer; color: var(--ink-soft); font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .link-edit-btn:hover:not(:disabled) { background: #f6f6f8; color: var(--ink); }
  .link-edit-btn:disabled { opacity: .3; cursor: not-allowed; }
  .link-edit-btn.danger:hover { background: #E4F1FE; color: #EF4444; border-color: #BBDDFB; }

  /* Card style picker */
  .cstyle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 6px; }
  .cstyle-chip { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .cstyle-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(10,11,36,.18); border-color: #d1d5db; }
  .cstyle-chip.active { border-color: var(--admin-deep); box-shadow: 0 0 0 2px rgba(59,157,247,.20); }
  .cstyle-name { font-size: 11.5px; font-weight: 500; color: var(--ink); text-align: center; }
  .cstyle-mini { height: 60px; border-radius: 8px; position: relative; overflow: hidden; }
  .cstyle-mini-soft { background: linear-gradient(135deg, #2D7FF9 0%, #1A6BE0 100%); }
  .cstyle-mini-soft::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 8px; height: 14px; border-radius: 8px; background: #fff; }
  .cstyle-mini-polaroid { background: #fff; border: 1px solid #ebe4ef; transform: rotate(-3deg); }
  .cstyle-mini-polaroid::after { content: ""; position: absolute; inset: 4px 4px 14px 4px; border-radius: 4px; background: linear-gradient(135deg, #d6e8ff, #5ba3ff); }
  .cstyle-mini-minimal { background: #fff7fa; border: 1.5px solid #b3d4ff; border-radius: 10px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; }
  .cstyle-mini-minimal::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #2D7FF9, #1A6BE0); }
  .cstyle-mini-sticker { background: #e8f0fe; border: 2px solid #1D1D1E; box-shadow: 3px 3px 0 0 #1D1D1E; }
  .cstyle-mini-sticker::after { content: "✿"; position: absolute; top: 8px; right: 10px; color: #1A6BE0; font-weight: 700; }
  .cstyle-mini-locked { background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,200,220,.5)); border: 1px solid #fff; }
  .cstyle-mini-locked::after { content: "🔒"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 18px; }
  .cstyle-mini-magnetic { background: linear-gradient(135deg, #2D7FF9, #1A6BE0); box-shadow: 0 0 12px rgba(45,127,249,.6); }
  .cstyle-mini-magnetic::after { content: "✨"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 18px; }
  .cstyle-mini-heartbeat { background: #fff7fa; border: 1.5px solid #b3d4ff; display: flex; align-items: center; justify-content: center; }
  .cstyle-mini-heartbeat::after { content: "♥"; color: #1A6BE0; font-size: 22px; animation: pmiBeat 1.4s ease-in-out infinite; }
  @keyframes pmiBeat { 0%,60%,100% { transform: scale(1); } 20% { transform: scale(1.3); } }
  .cstyle-mini-marquee { background: #e8f0fe; border: 2px solid #1D1D1E; box-shadow: 3px 3px 0 0 #1D1D1E; display: flex; align-items: center; justify-content: center; font-size: 9px; letter-spacing: .1em; font-weight: 700; color: #1D1D1E; }
  .cstyle-mini-marquee::after { content: "OPEN · OPEN"; }
  .cstyle-mini-liquid { background: #fff; border: 2px solid #1A6BE0; }
  .cstyle-mini-liquid::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(180deg, transparent, #1A6BE0); }
  .cstyle-mini-wordswap { background: linear-gradient(180deg, #1D1D1E, #5a2638); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-style: italic; font-family: 'Geist', system-ui, sans-serif; }
  .cstyle-mini-wordswap::after { content: "rejoindre →"; }
  .cstyle-mini-imessage { background: #fff7fa; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
  .cstyle-mini-imessage::before { content: ""; align-self: flex-start; width: 30%; height: 8px; border-radius: 6px; background: #fff; }
  .cstyle-mini-imessage::after { content: ""; align-self: flex-start; width: 60%; height: 12px; border-radius: 8px; background: linear-gradient(135deg, #2D7FF9, #1A6BE0); }
  .cstyle-mini-cassette { background: linear-gradient(135deg, #5ba3ff, #1A6BE0); display: flex; align-items: center; justify-content: space-around; padding: 0 10px; }
  .cstyle-mini-cassette::before, .cstyle-mini-cassette::after { content: "○"; color: #1D1D1E; font-size: 18px; font-weight: 700; }
  .cstyle-mini-slide { background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,200,220,.4)); display: flex; align-items: center; justify-content: flex-start; padding: 0 4px; }
  .cstyle-mini-slide::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #2D7FF9, #1A6BE0); margin-left: 2px; }
  .cstyle-mini-kiss { background: #fff7fa; display: flex; align-items: center; justify-content: center; }
  .cstyle-mini-kiss::after { content: "💋"; font-size: 22px; }
  .cstyle-mini-letter { background: #fff7fa; display: flex; align-items: center; justify-content: center; }
  .cstyle-mini-letter::after { content: ""; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5ba3ff, #1A6BE0 60%, #1456B8); box-shadow: 0 4px 8px -2px rgba(26,107,224,.6); }

  /* Background presets */
  .bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 6px; }
  .bg-chip { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .bg-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(10,11,36,.18); border-color: #d1d5db; }
  .bg-chip.active { border-color: var(--admin-deep); box-shadow: 0 0 0 2px rgba(59,157,247,.20); }
  .bg-preview { height: 42px; border-radius: 8px; background-size: cover !important; }
  .bg-name { font-size: 11.5px; font-weight: 500; color: var(--ink); text-align: center; }

  /* Theme presets */
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 6px; }
  .theme-chip { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .theme-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(10,11,36,.18); border-color: #d1d5db; }
  .theme-chip.active { border-color: var(--admin-deep); box-shadow: 0 0 0 2px rgba(59,157,247,.20); }
  .theme-grad { height: 36px; border-radius: 8px; }
  .theme-name { font-size: 12px; font-weight: 500; color: var(--ink); text-align: center; }

  /* Switch / segmented for platform target */
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; padding: 4px; background: #f0f0f5; border-radius: 12px; margin-top: 6px; }
  .seg label { margin: 0; cursor: pointer; }
  .seg input { display: none; }
  .seg .opt { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: #6B6B6E; text-align: center; transition: background .15s; }
  .seg input:checked + .opt { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .seg .opt svg { width: 14px; height: 14px; }

  /* Modal (folder editor) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,11,36,.4); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: dFade .2s; }
  .modal { background: #fff; border-radius: 18px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 30px 60px -20px rgba(10,11,36,.4); }
  .modal h3 { font-family: 'Geist', system-ui, sans-serif; font-weight: 600; font-size: 18px; margin: 0 0 14px; letter-spacing: -0.48px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* Domains section */
  .domains-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
  .domain-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: #fff; border: 1px solid var(--border); border-radius: 18px; box-shadow: rgba(10,11,36,0.016) 0px 3px 4px -2px; }
  .domain-status { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .domain-status.status-active { background: #34c759; box-shadow: 0 0 0 3px rgba(52,199,89,.18); }
  .domain-status.status-pending { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  .domain-status.status-error { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
  .domain-info { flex: 1; min-width: 0; }
  .domain-name { font-family: ui-monospace, monospace; font-size: 15px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .domain-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--admin-deep); color: #fff; letter-spacing: .04em; text-transform: uppercase; }
  .domain-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .domain-meta code { background: #f0f0f5; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  .domain-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .domain-actions .btn { padding: 8px 12px; font-size: 12.5px; }
  .domains-help { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; }
  .domains-help h3 { font-family: 'Geist', system-ui, sans-serif; font-weight: 500; font-size: 16px; margin: 0 0 10px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .domains-help ol { margin: 0 0 16px; padding-left: 22px; }
  .domains-help code { background: #f0f0f5; padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: ui-monospace, monospace; }
  .domains-help a { color: var(--admin-deep); }

  /* Domain copy menu */
  .domain-menu { position: absolute; z-index: 500; min-width: 260px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 6px; box-shadow: 0 16px 32px -12px rgba(10,11,36,.25); animation: dFade .15s; }
  .domain-menu-head { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #9B9B9E; font-weight: 600; padding: 8px 10px 4px; }
  .domain-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); text-align: left; }
  .domain-menu-item:hover { background: #f6f6f8; }
  .domain-menu-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
  .domain-menu-tag { background: var(--admin-deep); color: #fff; font-size: 9.5px; padding: 2px 6px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; font-family: inherit; flex: none; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: #1D1D1E; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; z-index: 1000; box-shadow: 0 14px 30px -10px rgba(0,0,0,.4); animation: tIn .2s; }
  @keyframes tIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Responsive */
  @media (max-width: 900px) {
    .admin-app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .drawer { grid-template-columns: 1fr; width: 100vw; }
    .drawer-preview { display: none; }
    .drawer-save { right: 0; }
  }

  /* ============================================================
     WEBAPP REDESIGN — ConquerorZ (overrides above; admin chrome only,
     public link cards & .cstyle-mini previews intentionally untouched)
     ============================================================ */
  .admin-app, .login-wrap, .drawer, .modal-overlay, .domain-menu, .toast {
    --s-bg:#FAFAF9; --s-card:#FFFFFF; --s-border:#E8E6E1; --s-border-strong:#D4D1CB;
    --s-ink:#16150F; --s-muted:#615F58; --s-subtle:#94908A; --s-muted-bg:#F4F3F1;
    --s-r:12px; --s-r-sm:8px; --s-ease:cubic-bezier(.2,0,0,1);
  }

  /* ---- Shell ---- */
  .admin-app { grid-template-columns: 252px 1fr; background: var(--s-bg); }
  .sidebar {
    background: var(--s-bg); border-right: 1px solid var(--s-border);
    padding: 16px 12px; gap: 2px;
  }
  .sb-logo { gap: 10px; padding: 8px 8px 18px; }
  .sb-logo .mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--admin); color:#fff;
    font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px -4px rgba(59,157,247,.5);
  }
  .sb-logo .lbl { color: var(--s-ink); font-weight: 600; font-size: 15px; }
  .sb-section {
    color: var(--s-subtle); font-size: 10.5px; letter-spacing: .12em;
    padding: 14px 10px 6px;
  }
  .sb-item {
    position: relative; color: var(--s-muted); font-size: 13.5px; font-weight: 500;
    padding: 9px 10px; border-radius: var(--s-r-sm); gap: 11px;
  }
  .sb-item svg { width: 17px; height: 17px; opacity: .85; }
  .sb-item:hover { background: var(--s-muted-bg); color: var(--s-ink); }
  .sb-item.active { background: var(--s-muted-bg); color: var(--s-ink); font-weight: 600; }
  .sb-item.active::before {
    content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:0 3px 3px 0; background: var(--admin);
  }
  .sb-item.active svg { color: var(--admin); opacity: 1; }
  .sb-foot { border-top: 1px solid var(--s-border); padding: 12px 8px 4px; }
  .sb-foot .email { color: var(--s-subtle); font-size: 12px; }
  .sb-foot button { color: var(--s-muted); text-decoration: none; font-weight: 500; }
  .sb-foot button:hover { color: var(--admin); }

  /* ---- Main + header ---- */
  .main { padding: 32px 40px 80px; max-width: 1180px; }
  .main-head { align-items: flex-start; margin-bottom: 24px; }
  .main-head h1 { font-size: 27px; font-weight: 600; color: var(--s-ink); letter-spacing: -0.03em; }
  .main-head .actions { gap: 10px; }

  /* ---- Buttons ---- */
  .btn {
    padding: 9px 14px; border-radius: var(--s-r-sm); border: 1px solid var(--s-border-strong);
    background: var(--s-card); color: var(--s-ink); font-size: 13px; font-weight: 500;
    box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: background .12s var(--s-ease), border-color .12s var(--s-ease);
  }
  .btn:hover { background: var(--s-muted-bg); border-color: var(--s-border-strong); }
  .btn-primary { background: var(--admin); color:#fff; border-color: var(--admin); box-shadow: 0 4px 12px -5px rgba(59,157,247,.55); }
  .btn-primary:hover { background: var(--admin-deep); border-color: var(--admin-deep); }
  .btn-danger { color: var(--admin); border-color: #BBDDFB; background: var(--s-card); }
  .btn-danger:hover { background: #E4F1FE; }
  .admin-app :focus-visible, .login-wrap :focus-visible, .drawer :focus-visible, .modal :focus-visible {
    outline: 2px solid var(--admin); outline-offset: 1px; border-radius: 6px;
  }

  /* ---- KPI tiles (global stats) ---- */
  .global-stats {
    display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px;
    margin-top: 16px; max-width: 560px;
  }
  .global-stats .stat {
    position: relative; flex-direction: column; align-items: flex-start; gap: 3px;
    background: var(--s-card); border: 1px solid var(--s-border); border-radius: var(--s-r);
    padding: 14px 16px; font-size: 12px; color: var(--s-muted); white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .global-stats .stat svg { position: absolute; top: 13px; right: 13px; width: 15px; height: 15px; color: var(--s-subtle); }
  .global-stats .stat strong {
    display: block; font-size: 26px; font-weight: 600; color: var(--s-ink);
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1;
  }

function renderLinksList(s) {
  const links = s._links || [];

  return `<div class="link-list">${links.map(l => `

    </a>
  `).join("")}</div>`;
}
function iconFor(url) {
  const u = String(url||"").toLowerCase();
  if (/t\.me|telegram/.test(u)) return "✈️";
  if (/instagram/.test(u)) return "📸";
  if (/tiktok/.test(u)) return "🎵";
  if (/snapchat/.test(u)) return "👻";
  if (/x\.com|twitter/.test(u)) return "𝕏";
  if (/onlyfans/.test(u)) return "🔒";
  if (/youtube|youtu\.be/.test(u)) return "▶️";
  if (/wa\.me|whatsapp/.test(u)) return "💬";
  if (/discord/.test(u)) return "🎮";
  if (/spotify/.test(u)) return "🎧";
  if (/mailto:/.test(u)) return "✉️";
  return "🔗";
}

function detectEnv() {
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  const isInstagram = /Instagram/.test(ua);
  const isFacebook = /FBAN|FBAV/.test(ua);
  const isTikTok = /BytedanceWebview|TikTok|musical_ly/i.test(ua);
  const isSnapchat = /Snapchat/.test(ua);
  const isMessenger = /Messenger/.test(ua);
  const isLine = /Line\//.test(ua);
  const isInApp = isInstagram || isFacebook || isTikTok || isSnapchat || isMessenger || isLine;
  return { isIOS, isAndroid, isInApp, isInstagram, isFacebook, isTikTok, isSnapchat };
}

function smartOpen(url, env) {
  if (!url) return;
  if (env.isAndroid && env.isInApp) {
    const stripped = url.replace(/^https?:\/\//, "");
    window.location.href = `intent://${stripped}#Intent;scheme=https;package=com.android.chrome;end`;
    return;
  }
  if (env.isIOS && env.isInApp) {
    const safariUrl = url.replace(/^https?:\/\//, "x-safari-https://");
    window.location.href = safariUrl;
    setTimeout(() => showOpenInBrowserBanner(env), 400);
    return;
  }
  window.location.href = url;
}

function showOpenInBrowserBanner(env) {
  if (document.getElementById("escape-banner")) return;
  if (sessionStorage.getItem("escapeDismissed")) return;
  const browser = env.isIOS ? "Safari" : "Chrome";
  const banner = document.createElement("div");
  banner.id = "escape-banner";
  banner.innerHTML = `
    <div class="escape-card">
      <button class="escape-x">×</button>
      <div class="escape-title">Ouvre dans ${browser} :</div>
      <div class="escape-steps">
        <div class="escape-step"><span class="num">1</span><span>Appuie sur <strong>…</strong> en haut à droite.</span></div>
        <div class="escape-step"><span class="num">2</span><span>Choisis <strong>Ouvrir dans le navigateur</strong>.</span></div>
      </div>
    </div>`;
  document.body.appendChild(banner);
  banner.querySelector(".escape-x").addEventListener("click", () => { banner.remove(); sessionStorage.setItem("escapeDismissed","1"); });
}

function maybeAutoShowEscape() {
  const env = detectEnv();
  if (!env.isInApp) return;
  if (env.isTikTok) return; // TikTok handled by overlay
  setTimeout(() => showOpenInBrowserBanner(env), 3000);
}

async function hydrateNearbyCity(container) {
  const el = container.querySelector(".loc-text");
  if (!el) return;
  try {
    const r = await fetch("/api/geo", { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.nearby) el.textContent = "Proche de " + d.nearby;
  } catch(e) {}
}

function bindInputs(area) {
  area.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.field;
      const val = el.type === "checkbox" ? el.checked : (el.type === "radio" ? el.value : el.value);
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), [key]: val };
      const pick = area.querySelector('[data-pick="'+key+'"]');
      if (pick && el.type === "text" && /^#[0-9a-f]{6}$/i.test(val)) pick.value = val;
      scheduleSave(); updatePreview();
    });
  });
  area.querySelectorAll("[data-pick]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.pick;
      const val = el.value;
      const p = currentPage(); p.data = { ...(p.data||{}), [key]: val };
      const txt = area.querySelector('[data-field="'+key+'"]'); if (txt) txt.value = val;
      scheduleSave(); updatePreview();
    });
  });
  const slugInp = area.querySelector("[data-slug]");
  if (slugInp) slugInp.addEventListener("change", async e => {
    const newSlug = slugify(e.target.value);
    const p = currentPage();
    if (!newSlug) { e.target.value = p.slug; return; }
    if (newSlug === p.slug) return;
    p.slug = newSlug; e.target.value = newSlug;
    const h = document.getElementById("hint_slug"); if (h) h.textContent = newSlug;
    clearTimeout(drawerSaveTimer);
    await saveNow();
  });
  // Photo upload
  const photoBtn = document.getElementById("photo_btn");
  if (photoBtn) {
    photoBtn.addEventListener("click", () => document.getElementById("photo_input").click());
    document.getElementById("photo_input").addEventListener("change", onPhotoUpload);
  }
  // Card style picker
  area.querySelectorAll(".cstyle-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.style;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), card_style: id };
      area.querySelectorAll(".cstyle-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Background presets
  area.querySelectorAll(".bg-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.bg;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), bg_style: id };
      area.querySelectorAll(".bg-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
  });
  // Theme presets
  area.querySelectorAll(".theme-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = THEMES.find(x => x.id === chip.dataset.theme); if (!t) return;
      const p = currentPage(); if (!p) return;
      p.data = { ...(p.data||{}), c_rose: t.rose, c_deep: t.deep, c_ink: t.ink, c_inksoft: t.inksoft };
      const set = (k, v) => {
        const txt = area.querySelector('[data-field="'+k+'"]');
        const pick = area.querySelector('[data-pick="'+k+'"]');
        if (txt) txt.value = v; if (pick) pick.value = v;
      };
      set("c_rose",t.rose);set("c_deep",t.deep);set("c_ink",t.ink);set("c_inksoft",t.inksoft);
      area.querySelectorAll(".theme-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      scheduleSave(); updatePreview();
    });
    const t = THEMES.find(x => x.id === chip.dataset.theme);
    const p = currentPage(); const dd = p?.data || {};
    if (t && dd.c_rose===t.rose && dd.c_deep===t.deep && dd.c_ink===t.ink && dd.c_inksoft===t.inksoft) chip.classList.add("active");
  });
}

function scheduleSave() {
  setSaveStatus("Modification en attente...","saving");
  clearTimeout(drawerSaveTimer);
  drawerSaveTimer = setTimeout(saveNow, 600);
}

async function saveNow() {
  const p = currentPage(); if (!p) return;
  setSaveStatus("Sauvegarde...","saving");
  if (p.data?.url) {
    const normalized = normalizeUrl(p.data.url);
    if (normalized !== p.data.url) {
      p.data.url = normalized;
      const inp = document.querySelector('[data-field="url"]');
      if (inp) inp.value = normalized;
    }
  }
  const {error} = await sb.from("landing_pages").update({
    slug: p.slug, data: p.data, photo_path: p.photo_path, folder_id: p.folder_id
  }).eq("id", p.id);
  if (error) { setSaveStatus("Erreur: "+error.message); return; }
  setSaveStatus("Sauvegarde ✓","saved");
}

function setSaveStatus(text, cls) {
  const el = document.getElementById("save_status");
  if (!el) return;
  el.textContent = text;
  el.className = "status"+(cls?" "+cls:"");

function updatePreview() {
  const p = currentPage(); if (!p) return;
  const iframe = document.getElementById("preview");
  if (!iframe) return;
  const photoUrl = p.photo_path ? sb.storage.from("landing_photos").getPublicUrl(p.photo_path).data.publicUrl : "";

  const s = { ...(p.data||{}), photo: photoUrl, slug: p.slug, _origin: window.location.origin, _links: enabledLinks };
  const wrap = document.createElement("div");

    return;
  }
  list.innerHTML = links.map((l, idx) => `
    <div class="link-edit-row" data-id="${esc(l.id)}">
      <div class="link-edit-handle" title="Glisser pour reordonner">&#8286;&#8286;</div>
      <div class="link-edit-icon">${esc(l.icon || iconFor(l.url))}</div>

      </div>
      <button class="link-edit-btn" data-act="up" ${idx===0?"disabled":""} title="Monter">&#x25B2;</button>
      <button class="link-edit-btn" data-act="down" ${idx===links.length-1?"disabled":""} title="Descendre">&#x25BC;</button>
      <button class="link-edit-btn" data-act="edit" title="Modifier">&#9998;</button>
      <button class="link-edit-btn" data-act="toggle" title="${l.enabled?"Desactiver":"Activer"}">${l.enabled?"&#x1F441;":"&#x1F6AB;"}</button>
      <button class="link-edit-btn danger" data-act="delete" title="Supprimer">&#x1F5D1;</button>
    </div>
  `).join("");
  list.querySelectorAll(".link-edit-row").forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", e => { e.stopPropagation(); onLinkAction(btn.dataset.act, id); });
    });
  });
}

async function onLinkAction(action, id) {
  const p = currentPage(); if (!p) return;
  const links = p._links || [];
  const idx = links.findIndex(l => l.id === id);
  if (idx < 0) return;
  const link = links[idx];

  if (action === "edit") return openLinkModal(link);
  if (action === "delete") {
    if (!confirm('Supprimer le lien "'+link.title+'" ?')) return;
    await sb.from("page_links").delete().eq("id", id);
    p._links = links.filter(l => l.id !== id);
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "toggle") {
    const newVal = !link.enabled;
    await sb.from("page_links").update({enabled: newVal}).eq("id", id);
    link.enabled = newVal;
    renderLinksEditList(); updatePreview();
    return;
  }
  if (action === "up" || action === "down") {
    const swapIdx = action === "up" ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= links.length) return;
    const other = links[swapIdx];
    const linkPos = link.position, otherPos = other.position;
    await Promise.all([
      sb.from("page_links").update({position: otherPos}).eq("id", link.id),
      sb.from("page_links").update({position: linkPos}).eq("id", other.id)
    ]);
    link.position = otherPos; other.position = linkPos;
    p._links = [...links].sort((a,b) => a.position - b.position);
    renderLinksEditList(); updatePreview();
    return;
  }
}

  const editing = !!link;

  const modal = document.createElement("div"); modal.className = "modal";
  modal.innerHTML = `
    <h3>${editing ? "Modifier le lien" : "Nouveau lien"}</h3>

    <input type="text" id="ml_title" placeholder="Ex: Mon Telegram" value="${editing?esc(link.title):""}">
    <label>URL</label>
    <input type="url" id="ml_url" placeholder="https://t.me/..." value="${editing?esc(link.url):""}">
    <label>Username du compte (interne, pour l'orga)</label>
    <input type="text" id="ml_username" placeholder="@sophie_xxx" value="${editing?esc(link.username||""):""}">
    <p class="hint">Le username n'apparait jamais sur la landing publique.</p>
    <label>Icone (1 emoji, optionnel)</label>
    <input type="text" id="ml_icon" maxlength="4" placeholder="auto" value="${editing?esc(link.icon||""):""}">
    <p class="hint">Laisse vide pour detection auto (Telegram = plane, Insta = camera, etc.)</p>
    <div class="modal-btns">
      <button class="btn" id="ml_cancel">Annuler</button>
      <button class="btn btn-primary" id="ml_submit">${editing ? "Enregistrer" : "Creer"}</button>
    </div>
  `;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  document.getElementById("ml_cancel").addEventListener("click", () => overlay.remove());
  document.getElementById("ml_title").focus();
  document.getElementById("ml_submit").addEventListener("click", async () => {
    const title = document.getElementById("ml_title").value.trim();
    let url = document.getElementById("ml_url").value.trim();
    const username = document.getElementById("ml_username").value.trim();
    const icon = document.getElementById("ml_icon").value.trim() || null;
    if (!title || !url) return;
    url = normalizeUrl(url);
    const p = currentPage();
    if (editing) {
      const {error} = await sb.from("page_links").update({title, url, username, icon}).eq("id", link.id);
      if (error) { toast(error.message); return; }
      Object.assign(link, {title, url, username, icon});
    } else {
      const pos = (p._links||[]).length;
      const {data:row, error} = await sb.from("page_links").insert({
        page_id: p.id, title, url, username, icon, position: pos, enabled: true
      }).select().single();
      if (error) { toast(error.message); return; }
      p._links = [...(p._links||[]), row];
    }
    overlay.remove();
    renderLinksEditList(); updatePreview();
    toast(editing ? "Lien modifie" : "Lien ajoute");
  });
}

async function onDeleteCurrentPage() {
  const p = currentPage(); if (!p) return;
  if (!confirm('Supprimer la page "'+p.slug+'" definitivement ?')) return;
  await sb.from("landing_pages").delete().eq("id", p.id);
  closePageDrawer();
  toast("Page supprimee");
  // Reload the page list
  setTimeout(() => window.location.reload(), 500);
}
// ============================================================ APP
function TopBar({title,subtitle,back}){
  return(
    <header style={{height:56,padding:'0 24px',display:'flex',alignItems:'center',gap:14,borderBottom:'1px solid var(--border)',background:'rgb(250 250 249/.85)',backdropFilter:'blur(8px)',position:'sticky',top:0,zIndex:20}}>
      {back&&<button onClick={back} title="Retour" style={{width:32,height:32,marginLeft:-4,display:'grid',placeItems:'center',borderRadius:8,border:'1px solid var(--border)',background:'#fff',cursor:'pointer',color:'var(--fg-muted)',flexShrink:0}}><i data-lucide="arrow-left" style={{width:16,height:16}}></i></button>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:15,fontWeight:600,letterSpacing:'-0.01em'}}>{title}</div>
        {subtitle&&<div style={{fontSize:12,color:'var(--fg-muted)',marginTop:1}}>{subtitle}</div>}
      </div>
    </header>
  );
}

function App(){
  const [view,setView]=useState('overview');const [page,setPage]=useState(null);const [period,setPeriod]=useState('7j');
  useEffect(()=>{if(window.lucide)lucide.createIcons()});
  function openPage(p){setPage(p);setView('detail');window.scrollTo(0,0)}
  function back(){setView('overview');setPage(null)}
  function openEdit(p){openPageDrawer(p)}
  let title,subtitle,backFn=null,screen;
  if(view==='detail'&&page){title=page.data?.title||page.slug;subtitle='Analytics de la page';backFn=back;screen=<PageDetail page={page} period={period} setPeriod={setPeriod}/>}
  else{title='Mes pages';subtitle='Suivi des clics sur vos pages';screen=<LinksOverview period={period} setPeriod={setPeriod} onOpen={openPage} onEdit={openEdit}/>}
  return(
    <div style={{minHeight:'100vh',maxWidth:1320,margin:'0 auto'}}>
      <TopBar title={title} subtitle={subtitle} back={backFn}/>
      {screen}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
