<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sophie · Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF9;
    --bg-elevated: #FFFFFF;
    --bg-muted: #F4F3F1;
    --border: #E8E6E1;
    --border-strong: #D4D1CB;
    --fg: #0A0A0A;
    --fg-muted: #5C5A55;
    --fg-subtle: #8A8780;
    --accent: #FF3B30;
    --accent-hover: #E62E24;
    --ring: rgba(255, 59, 48, 0.35);
    --radius: 8px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 3px rgb(0 0 0 / 0.06), 0 1px 2px rgb(0 0 0 / 0.04);
    --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.10);
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "ss01", "cv11";
    display: grid;
    place-items: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* subtle warm halo, very faint — no gradient mesh */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(620px 420px at 50% -8%, rgba(255, 59, 48, 0.05), transparent 60%);
    pointer-events: none;
  }
  .card {
    position: relative;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 392px;
    box-shadow: var(--shadow-lg);
  }
  .logo {
    width: 40px; height: 40px;
    background: var(--accent);
    color: #fff;
    border-radius: 11px;
    display: grid; place-items: center;
    font-weight: 700; font-size: 18px;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px -4px rgba(255, 59, 48, 0.5);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 24px; font-weight: 600;
    letter-spacing: -0.025em;
    color: var(--fg);
  }
  .sub {
    color: var(--fg-subtle);
    font-size: 13.5px;
    font-family: "Geist Mono", ui-monospace, monospace;
    letter-spacing: -0.01em;
    margin: 0 0 30px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--fg-muted);
    font-weight: 500;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 120ms var(--ease), box-shadow 120ms var(--ease);
  }
  input::placeholder { color: var(--fg-subtle); letter-spacing: 0.15em; }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--ring);
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background 120ms var(--ease);
  }
  button:hover { background: var(--accent-hover); }
  button:active { opacity: 0.85; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .err {
    color: var(--accent);
    font-size: 12.5px;
    margin-top: 14px;
    text-align: center;
  }
</style>
</head>
<body>
<form class="card" method="post">
  <input type="hidden" name="next" value="{{ request.args.get('next', '/dashboard') }}">
  <div class="logo">S</div>
  <h1>Sophie</h1>
  <p class="sub">Landing · Dashboard · Crea</p>
  <label for="pw">mot de passe</label>
  <input id="pw" type="password" name="password" autofocus required placeholder="••••••••">
  <button type="submit">Entrer</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
