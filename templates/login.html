<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Sophie · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    margin:0; min-height: 100vh;
    background: #F8F8F8;
    color: #1D1D1E;
    font-family: "Geist", -apple-system, sans-serif;
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff;
    border: 1px solid #E5E5EA;
    border-radius: 18px;
    padding: 36px;
    width: 380px;
    box-shadow: rgba(10,11,36,0.02) 0px 11px 11px 0px, rgba(10,11,36,0.02) 0px 3px 6px 0px;
  }
  .logo {
    width: 36px; height: 36px;
    background: #2D7FF9; color: #fff;
    border-radius: 10px;
    display: grid; place-items: center;
    font-weight: 700; font-size: 15px;
    margin-bottom: 20px;
  }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.54px; font-weight: 700; color: #1D1D1E; }
  .sub { color: #9B9B9E; font-size: 14px; margin-bottom: 28px; }
  label { font-size: 12px; color: #6B6B6E; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px;
    border: 1px solid #E5E5EA; border-radius: 7px;
    background: #fff; color: #1D1D1E;
    font-family: inherit; font-size: 14px;
    outline: none; transition: all .15s;
    box-sizing: border-box;
  }
  input:focus { border-color: #2D7FF9; box-shadow: 0 0 0 3px rgba(45,127,249,0.12); }
  button {
    width: 100%; margin-top: 20px;
    padding: 12px;
    background: #1D1D1E; color: #fff;
    border: 0; border-radius: 7px;
    font-family: inherit; font-size: 16px; font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #4A4A4C; }
  .err { color: #FF3B30; font-size: 12px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<form class="card" method="post">
  <input type="hidden" name="next" value="{{ request.args.get('next', '/dashboard') }}">
  <div class="logo">S</div>
  <h1>Sophie</h1>
  <div class="sub">Landing &middot; Dashboard &middot; Crea</div>
  <label>Mot de passe</label>
  <input type="password" name="password" autofocus required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
  <button type="submit">Entrer</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
